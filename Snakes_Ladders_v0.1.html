<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>蛇棋 Snakes &amp; Ladders</title>
<style>
  :root { --bg:#2f6b3a; --card:#fff8e6; --fg:#3a2a14; --muted:#7a6342; --rule:#d9b98a; --accent:#f2892b; --accent-fg:#fff; --wood:#8a5a2b; color-scheme: light; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; min-height:100%; background:radial-gradient(ellipse at 50% 0%,#5ea44f 0%,#2f6b3a 55%,#1f4d2a 100%) fixed; color:var(--fg); font-family:-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; }
  body { padding:calc(env(safe-area-inset-top,0px) + 14px + var(--sb,0px)) 12px calc(env(safe-area-inset-bottom,0px) + 24px); display:flex; justify-content:center; touch-action:manipulation; }
  main { width:100%; max-width:600px; }
  h1 { margin:0 0 4px; font-size:1.6rem; color:#fff8e6; text-shadow:0 3px 0 #1f4d2a; }
  main > .sub { color:#e6f2d8 !important; }
  .sub { margin:0 0 14px; color:var(--muted); font-size:.88rem; line-height:1.55; }
  .card { background:var(--card); border:4px solid var(--wood); border-radius:18px; padding:20px; box-shadow:0 10px 30px rgba(0,0,0,.35); }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  .pick button, .btn { border:2px solid var(--rule); background:var(--card); color:var(--fg); border-radius:14px; padding:12px 16px; font-size:1rem; cursor:pointer; font-family:inherit; font-weight:700; box-shadow:0 3px 0 var(--rule); transition:transform .1s; }
  .pick button:active, .btn:active { transform:translateY(2px); box-shadow:0 1px 0 var(--rule); }
  .pick button { flex:1; font-weight:700; font-size:1.1rem; }
  .pick button.on { background:var(--accent); color:var(--accent-fg); border-color:var(--accent); }
  .btn.p { background:linear-gradient(#ffad4d,#e9731b); color:#fff; border-color:#c75d10; font-weight:800; box-shadow:0 3px 0 #a84c0c; text-shadow:0 1px 0 rgba(0,0,0,.25); }
  .btn:disabled { opacity:.45; cursor:default; }
  label.opt { display:flex; align-items:center; gap:8px; margin:14px 0; font-size:.92rem; cursor:pointer; }
  label.opt input { width:18px; height:18px; accent-color:var(--accent); }
  .rules { margin:14px 0 0; padding-left:1.2em; color:var(--muted); font-size:.85rem; line-height:1.7; }
  #game { display:none; }
  #hud { display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap; }
  .chip { flex:1; min-width:70px; padding:7px 8px; border:3px solid var(--rule); border-radius:14px; background:var(--card); box-shadow:0 3px 8px rgba(0,0,0,.25); font-size:.82rem; text-align:center; line-height:1.3; }
  .chip.on { border-color:var(--c); box-shadow:0 0 0 2px var(--c); }
  .chip b { display:inline-block; width:18px; height:18px; line-height:18px; border-radius:50%; color:#fff; font-size:.72rem; background:var(--c); margin-right:4px; }
  #board { --bs:340px; --n:10; position:relative; width:var(--bs); height:var(--bs); margin:0 auto; display:grid; grid-template-columns:repeat(10,minmax(0,1fr)); grid-template-rows:repeat(10,minmax(0,1fr)); border:8px solid var(--wood); outline:3px solid #5c3a17; border-radius:14px; box-shadow:0 14px 36px rgba(0,0,0,.45); overflow:hidden; user-select:none; -webkit-user-select:none; }
  .cell { position:relative; min-width:0; min-height:0; overflow:hidden; font-size:calc(var(--bs) / 10 * .26); color:#4b412f; padding:2px 3px; font-weight:600; line-height:1; }
  .cell.a { background:linear-gradient(135deg,#fbefcf,#f4e2b4); } .cell.b { background:linear-gradient(135deg,#f1d9a0,#e8c983); }
  .cell.head { background:#f6b8ae; } .cell.tail { background:#c4e7b3; } .cell.lb { background:#e5c19a; } .cell.lt { background:#f3e2b0; }
  .cell.end { background:#ffd166; }
  .cell i { position:absolute; right:2px; bottom:1px; font-style:normal; font-size:1.5em; opacity:.85; }
  #deco { position:absolute; left:0; top:0; width:100%; height:100%; pointer-events:none; }
  .pawn { position:absolute; width:5.6%; height:5.6%; border-radius:50%; border:2px solid #fff; background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.75) 0 14%,var(--c) 42%,color-mix(in srgb,var(--c),#000 35%) 100%); box-shadow:0 3px 5px rgba(0,0,0,.45); color:#fff; font-weight:800; font-size:calc(var(--bs) * .032); display:flex; align-items:center; justify-content:center; transform:translate(-50%,-50%); transition:left .18s ease-out, top .18s ease-out; z-index:3; box-shadow:0 2px 5px rgba(0,0,0,.45); }
  .pawn.slow { transition:left .8s ease-in-out, top .8s ease-in-out; }
  #ctrl { display:flex; align-items:center; gap:14px; justify-content:center; margin:14px 0 6px; }
  #die { width:76px; height:76px; border-radius:18px; border:3px solid var(--rule); background:linear-gradient(160deg,#fff,#f3e8d0); box-shadow:0 6px 0 #c9a46c,0 10px 18px rgba(0,0,0,.35); font-size:3.4rem; line-height:1; display:flex; align-items:center; justify-content:center; color:var(--fg); cursor:pointer; padding:0; }
  #die.roll { animation:shake .12s infinite; }
  @keyframes shake { 50% { transform:rotate(8deg) scale(1.05); } }
  #roll { font-size:1.15rem; padding:14px 22px; }
  #msg { min-height:2.8em; text-align:center; font-size:.95rem; line-height:1.5; margin:4px 0 10px; color:#fff8e6; font-weight:700; text-shadow:0 2px 3px rgba(0,0,0,.5); }
  .tools { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; } .tools .btn { padding:9px 12px; font-size:.85rem; }
  #ov { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,.6); display:none; align-items:center; justify-content:center; padding:20px; z-index:25; }
  #ov .box { background:var(--card); border:4px solid var(--wood); border-radius:18px; box-shadow:0 14px 40px rgba(0,0,0,.5); padding:26px 22px; text-align:center; max-width:340px; width:100%; }
  #ov h2 { margin:0 0 8px; font-size:1.6rem; } #ov p { margin:4px 0 18px; color:var(--muted); line-height:1.6; }
  button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .pawn.hop { animation:hop .21s ease-out; } @keyframes hop { 50% { transform:translate(-50%,-80%) scale(1.15); } }
  .shake { animation:shk .4s; } @keyframes shk { 25% { transform:translateX(-6px); } 50% { transform:translateX(5px); } 75% { transform:translateX(-3px); } }
  .pop { position:absolute; z-index:5; font-weight:900; font-size:calc(var(--bs) * .07); color:#fff; -webkit-text-stroke:1.5px #3a2a14; transform:translate(-50%,-50%); pointer-events:none; animation:popUp 1.1s ease-out forwards; white-space:nowrap; }
  @keyframes popUp { 0% { opacity:0; transform:translate(-50%,-20%) scale(.4); } 20% { opacity:1; transform:translate(-50%,-60%) scale(1.15); } 100% { opacity:0; transform:translate(-50%,-160%) scale(1); } }
  .spark { position:absolute; z-index:4; width:8px; height:8px; border-radius:50%; pointer-events:none; }
  .conf { position:fixed; top:-20px; z-index:20; width:10px; height:14px; pointer-events:none; }
  /* 右上角的音樂／音效大按鈕（各款遊戲統一） */
  #sndBox { position:fixed; right:max(12px,env(safe-area-inset-right)); top:max(12px,env(safe-area-inset-top)); z-index:30; display:flex; gap:10px; }
  #sndBox button { width:54px; height:54px; padding:0; border-radius:50%; font-size:28px; line-height:50px; cursor:pointer; background:var(--card); border:3px solid var(--wood); box-shadow:0 4px 12px rgba(0,0,0,.35); }
  #sndBox button.off { filter:grayscale(1); opacity:.5; }
  /* v0.1 首頁：背景是四位電腦自動擲骰的廣告影片 */
  body.promo main > h1, body.promo main > .sub, body.promo #hud, body.promo #ctrl, body.promo .tools, body.promo #setup { visibility:hidden; }
  body.promo #setup { display:none !important; } body.promo #game { display:block !important; }
  body.promo #msg { visibility:hidden; }
  body.promo main > h1, body.promo main > .sub, body.promo #hud { display:none; }
  body.promo #board { margin-top:var(--pt,0px); }
  #promo { position:fixed; inset:0; z-index:15; display:none; flex-direction:column; align-items:center; justify-content:space-between; pointer-events:none;
    padding:calc(env(safe-area-inset-top,0px) + 10px + var(--sb,0px)) 12px calc(env(safe-area-inset-bottom,0px) + 14px);
    background:linear-gradient(180deg,rgba(20,50,25,.88) 0%,rgba(20,50,25,0) 22%,rgba(20,50,25,0) 76%,rgba(20,50,25,.9) 100%); }
  body.promo #promo { display:flex; }
  #pLogo { text-align:center; }
  #pLogo h2 { margin:0; font-size:clamp(46px,min(14vw,12vmin),80px); font-weight:900; color:#ffe27a; letter-spacing:6px; text-shadow:0 5px 0 #8a5a2b,0 9px 20px rgba(0,0,0,.5); }
  #pLogo h2 span { display:inline-block; }
  #pLogo .sn { animation:wig 1.4s ease-in-out infinite; } #pLogo .ld { animation:cl 1.8s ease-in-out infinite; }
  @keyframes wig { 0%,100% { transform:rotate(-10deg); } 50% { transform:rotate(10deg) translateY(-4px); } }
  @keyframes cl { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-10px); } }
  #pLogo .en { color:#fff8e6; font-weight:800; letter-spacing:.3em; font-size:.8rem; margin-top:2px; }
  #pCap { min-height:38px; margin-top:6px; text-align:center; }
  #pCap .cp { display:inline-block; background:var(--card); border:3px solid var(--wood); border-radius:999px; padding:5px 16px; font-weight:800; font-size:15px; color:var(--fg); box-shadow:0 4px 12px rgba(0,0,0,.35); }
  #pCap .cp span { display:inline-block; opacity:0; animation:pIn .35s cubic-bezier(.3,1.8,.5,1) forwards; }
  @keyframes pIn { 0% { opacity:0; transform:translateY(10px) scale(.4); } 100% { opacity:1; transform:none; } }
  #pBtns { display:flex; gap:10px; pointer-events:auto; width:min(92vw,400px); }
  #pBtns .btn { flex:1; } #pBtns .btn.p { flex:2; font-size:1.25rem; animation:pPulse 1.5s ease-in-out infinite; }
  @keyframes pPulse { 50% { transform:scale(1.05); } }
</style>
</head>
<body>
<div id="sndBox"><button id="bMus" aria-label="背景音樂開關">🎵</button><button id="bSnd" aria-label="音效開關">🔊</button></div>
<div id="promo">
  <div><div id="pLogo"><h2><span class="sn">🐍</span>蛇棋<span class="ld">🪜</span></h2><div class="en">SNAKES &amp; LADDERS ・ v0.1</div></div><div id="pCap"></div></div>
  <div id="pBtns"><button class="btn" id="pRules">📖 規則</button><button class="btn p" id="pStart">▶ 開始遊戲</button></div>
</div>
<main>
  <h1>🐍 蛇棋 🪜</h1>
  <p class="sub">比賽看誰先走到第 100 格!遇到樓梯往上爬,踩到蛇頭就滑下去。</p>

  <section id="setup" class="card">
    <div style="font-weight:700;margin-bottom:8px">幾個人玩?</div>
    <div class="row pick" id="pick"><button data-n="1">1 人</button><button data-n="2" class="on">2 人</button><button data-n="3">3 人</button><button data-n="4">4 人</button></div>
    <label class="opt"><input type="checkbox" id="exact" checked> 終點需剛好擲中(超過 100 會往回走)</label>
    <button class="btn p" id="start" style="width:100%;font-size:1.1rem">開始遊戲</button>
    <ol class="rules">
      <li>棋盤共 100 格,從 1 開始,<b>一列往右、下一列往左</b>來回走到 100。</li>
      <li>輪流擲骰子(1~6),依點數前進。</li>
      <li>停在<b>樓梯底部</b>會爬到樓梯頂端;走到樓梯頂端不會往下走。</li>
      <li>停在<b>蛇頭</b>會滑到蛇尾;走到蛇尾什麼事也沒有。</li>
      <li>第 <b>99 格</b>一定有蛇頭,踩到會<b>直接滑回第 1 格</b>;第 <b>88 格</b>一定有樓梯,可以<b>直達第 100 格直接獲勝</b>!其他的樓梯和蛇每一局都是隨機產生的。</li>
    </ol>
  </section>

  <section id="game">
    <div id="hud"></div>
    <div id="board"></div>
    <div id="ctrl"><button id="die" aria-label="骰子">⚀</button><button class="btn p" id="roll">擲骰子</button></div>
    <div id="msg"></div>
    <div class="tools"><button class="btn" id="newmap">🎲 新地圖</button><button class="btn" id="again">↻ 重玩這張</button><button class="btn" id="back">⚙ 回設定</button></div>
  </section>
</main>
<div id="ov"><div class="box"><h2 id="ovt"></h2><p id="ovp"></p><div class="row"><button class="btn" id="ov1" style="flex:1">重玩這張</button><button class="btn p" id="ov2" style="flex:1">新地圖</button></div></div></div>

<script>
const $ = id => document.getElementById(id);
const COLORS = ['#e53935', '#1e88e5', '#43a047', '#f9a825'], FACES = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];
const SNAKE_COL = ['#2e9e4f', '#8e44ad', '#d35400', '#16a0a0', '#c0392b', '#7d8c1f', '#2c6fb7', '#b0408a'];
let cfg = { n: 2, exact: true }, board, pos = [], rolls = [], turn = 0, busy = false, over = false, sndOn = true, demo = false, gameId = 0;

// ---------- 地圖產生 ----------
const rowOf = n => Math.floor((n - 1) / 10), ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
function genBoard() {
  for (let attempt = 0; attempt < 300; attempt++) {
    const used = new Set([1, 100]), snakes = [], ladders = [];
    const free = n => !used.has(n), add = (arr, a, b) => { arr.push([a, b]); used.add(a); used.add(b); };
    add(snakes, 99, 1); add(ladders, 88, 100); // 第 99 格蛇頭直接滑回第 1 格;第 88 格樓梯直達 100(直接過關)
    const mk = (arr, up, count) => {
      for (let i = 0; i < count; i++) {
        let done = false;
        for (let k = 0; k < 100 && !done; k++) {
          const a = up ? ri(2, 88) : ri(14, 98), b = up ? a + ri(8, 50) : a - ri(8, 50);
          if (b < 2 || b > 98 || !free(a) || !free(b) || rowOf(a) === rowOf(b)) continue;
          add(arr, a, b); done = true;
        }
        if (!done) return false;
      }
      return true;
    };
    if (mk(snakes, false, 7) && mk(ladders, true, 7)) {
      const snakeAt = {}, ladderAt = {}; snakes.forEach(([h, tl]) => snakeAt[h] = tl); ladders.forEach(([b, tp]) => ladderAt[b] = tp);
      return { snakes, ladders, snakeAt, ladderAt };
    }
  }
}
function stepsPath(p, d, exact) { // 這一步依序經過的格子(終點需剛好時,超過 100 會往回走)
  const path = []; let dir = 1;
  for (let i = 0; i < d; i++) {
    if (!exact && p >= 100) break;
    p += dir; path.push(p);
    if (exact && p === 100 && i < d - 1) dir = -1;
  }
  return path;
}

// ---------- 座標 ----------
function cellXY(n) { const r = rowOf(n), c = r % 2 === 0 ? (n - 1) % 10 : 9 - (n - 1) % 10; return [c * 10 + 5, (9 - r) * 10 + 5]; }
const OFFS = [[-1.6, -1.6], [1.6, -1.6], [-1.6, 1.6], [1.6, 1.6]];

// ---------- 畫棋盤 ----------
function drawBoard() {
  const b = $('board'); b.innerHTML = '';
  for (let r = 9; r >= 0; r--) for (let c = 0; c < 10; c++) {
    const n = r * 10 + (r % 2 === 0 ? c + 1 : 10 - c), d = document.createElement('div');
    let cls = 'cell ' + ((r + c) % 2 ? 'a' : 'b'), icon = '';
    if (board.snakeAt[n]) { cls += ' head'; icon = '🐍'; } else if (board.snakes.some(s => s[1] === n)) cls += ' tail';
    else if (board.ladderAt[n]) { cls += ' lb'; icon = '🪜'; } else if (board.ladders.some(l => l[1] === n)) cls += ' lt';
    if (n === 100) { cls += ' end'; icon = '🏁'; }
    d.className = cls; d.innerHTML = n + (icon ? '<i>' + icon + '</i>' : ''); b.appendChild(d);
  }
  const NS = 'http://www.w3.org/2000/svg', svg = document.createElementNS(NS, 'svg'); svg.setAttribute('viewBox', '0 0 100 100'); svg.id = 'deco';
  const el = (tag, at) => { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); svg.appendChild(e); return e; };
  board.ladders.forEach(([lo, hi]) => { // 樓梯:兩根邊柱 + 橫槓
    const [x1, y1] = cellXY(lo), [x2, y2] = cellXY(hi), L = Math.hypot(x2 - x1, y2 - y1), ux = (x2 - x1) / L, uy = (y2 - y1) / L, nx = -uy * 1.5, ny = ux * 1.5;
    for (let k = 1; k < L / 3.6; k++) { const t = k * 3.6; el('line', { x1: x1 + ux * t + nx, y1: y1 + uy * t + ny, x2: x1 + ux * t - nx, y2: y1 + uy * t - ny, stroke: '#8a5a2b', 'stroke-width': 1, 'stroke-linecap': 'round' }); }
    [1, -1].forEach(s => el('line', { x1: x1 + nx * s, y1: y1 + ny * s, x2: x2 + nx * s, y2: y2 + ny * s, stroke: '#a8703a', 'stroke-width': 1.3, 'stroke-linecap': 'round' }));
  });
  board.snakes.forEach(([h, tl], i) => { // 蛇:彎彎曲曲的身體,蛇頭有眼睛
    const [x1, y1] = cellXY(h), [x2, y2] = cellXY(tl), L = Math.hypot(x2 - x1, y2 - y1), ux = (x2 - x1) / L, uy = (y2 - y1) / L, nx = -uy, ny = ux, waves = Math.max(1, Math.round(L / 15)), amp = Math.min(3.4, L * 0.09);
    let d = ''; for (let k = 0; k <= 40; k++) { const t = k / 40, o = Math.sin(t * Math.PI * 2 * waves) * amp * (1 - t * 0.5); d += (k ? 'L' : 'M') + (x1 + (x2 - x1) * t + nx * o).toFixed(2) + ' ' + (y1 + (y2 - y1) * t + ny * o).toFixed(2); }
    const col = SNAKE_COL[i % SNAKE_COL.length]; board.path = board.path || {}; board.path[h] = []; for (let k = 0; k <= 24; k++) { const t = k / 24, o = Math.sin(t * Math.PI * 2 * waves) * amp * (1 - t * 0.5); board.path[h].push([x1 + (x2 - x1) * t + nx * o, y1 + (y2 - y1) * t + ny * o]); }
    el('path', { d, fill: 'none', stroke: col, 'stroke-width': 2.4, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', opacity: .92 });
    el('path', { d, fill: 'none', stroke: '#fff', 'stroke-width': 0.9, 'stroke-dasharray': '1 2.6', opacity: .45 });
    el('circle', { cx: x1, cy: y1, r: 2.5, fill: col }); el('circle', { cx: x1 - 0.9, cy: y1 - 0.7, r: .6, fill: '#fff' }); el('circle', { cx: x1 + 0.9, cy: y1 - 0.7, r: .6, fill: '#fff' });
    el('circle', { cx: x1 - 0.9, cy: y1 - 0.7, r: .28, fill: '#111' }); el('circle', { cx: x1 + 0.9, cy: y1 - 0.7, r: .28, fill: '#111' });
    el('circle', { cx: x2, cy: y2, r: 1, fill: col });
  });
  b.appendChild(svg);
  for (let i = 0; i < cfg.n; i++) { const p = document.createElement('div'); p.className = 'pawn'; p.id = 'pawn' + i; p.style.setProperty('--c', COLORS[i]); p.textContent = i + 1; b.appendChild(p); }
}
function placeXY(i, x, y) { const p = $('pawn' + i), o = cfg.n > 1 ? OFFS[i] : [0, 0]; p.classList.remove('slow'); p.style.left = (x + o[0]) + '%'; p.style.top = (y + o[1]) + '%'; }
function placePawn(i, n, slow) {
  const p = $('pawn' + i), [x, y] = cellXY(n), o = cfg.n > 1 ? OFFS[i] : [0, 0];
  p.classList.toggle('slow', !!slow); p.style.left = (x + o[0]) + '%'; p.style.top = (y + o[1]) + '%';
}
function fit() {
  if (document.body.classList.contains('promo') && $('pCap')) {   // 首頁：棋盤放在標題和字卡下面、按鈕上面
    const B = $('board'), top = $('pCap').getBoundingClientRect().bottom + 8, bot = $('pBtns').getBoundingClientRect().top - 8;
    const natural = B.getBoundingClientRect().top - (parseFloat(getComputedStyle(B).marginTop) || 0);
    B.style.setProperty('--bs', Math.max(200, Math.min(window.innerWidth - 24, 560, bot - top)) + 'px');
    document.documentElement.style.setProperty('--pt', Math.max(0, top - natural) + 'px'); return; }
  document.documentElement.style.setProperty('--pt', '0px');
  $('board').style.setProperty('--bs', Math.max(250, Math.min(window.innerWidth - 24, 560, window.innerHeight - 250 - (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sb')) || 0))) + 'px'); }
addEventListener('resize', fit);

// ---------- 聲音 ----------
let actx = null;
function tone(f, d, type, v, when) {
  if (!sndOn || demo) return; try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume();
    const t = actx.currentTime + (when || 0), o = actx.createOscillator(), g = actx.createGain(); o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v || .12, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + d + .02);

const sfx = {
  tick: () => tone(300 + Math.random() * 300, .05, 'square', .05), step: () => tone(520, .06, 'triangle', .1),
  up: () => [523, 659, 784, 1046].forEach((f, i) => tone(f, .14, 'triangle', .13, i * .09)),
  down: () => { for (let i = 0; i < 8; i++) tone(700 * Math.pow(.85, i), .1, 'sawtooth', .09, i * .07); },
  win: () => [523, 659, 784, 1046, 784, 1046, 1318].forEach((f, i) => tone(f, .2, 'triangle', .14, i * .12))
};

// ---------- 遊戲流程 ----------
const sleep = ms => { const id = gameId; return new Promise((r, j) => setTimeout(() => id === gameId ? r() : j('abort'), ms)); };
function popAt(n, txt) { const [x, y] = cellXY(n), d = document.createElement('div'); d.className = 'pop'; d.textContent = txt; d.style.left = x + '%'; d.style.top = y + '%'; $('board').appendChild(d); setTimeout(() => d.remove(), 1150); }
function sparksAt(n, col) { const [x, y] = cellXY(n); for (let k = 0; k < 14; k++) { const d = document.createElement('div'); d.className = 'spark'; d.style.background = col; d.style.left = x + '%'; d.style.top = y + '%'; $('board').appendChild(d);
  const a = Math.random() * Math.PI * 2, r = 30 + Math.random() * 40; d.animate([{ transform: 'translate(-50%,-50%) scale(1)', opacity: 1 }, { transform: `translate(calc(-50% + ${Math.cos(a) * r}px),calc(-50% + ${Math.sin(a) * r}px)) scale(.2)`, opacity: 0 }], { duration: 600, easing: 'ease-out' }).onfinish = () => d.remove(); } }
function confetti() { const C = ['#ffe27a', '#e53935', '#1e88e5', '#43a047', '#fff']; for (let k = 0; k < 70; k++) { const d = document.createElement('div'); d.className = 'conf'; d.style.left = Math.random() * 100 + 'vw'; d.style.background = C[k % C.length]; document.body.appendChild(d);
  d.animate([{ transform: 'translateY(0) rotate(0)' }, { transform: `translate(${(Math.random() - .5) * 200}px,${innerHeight + 40}px) rotate(${Math.random() * 900}deg)` }], { duration: 1800 + Math.random() * 1500, delay: Math.random() * 400 }).onfinish = () => d.remove(); } }
const pname = i => demo ? ['小紅', '小藍', '小綠', '小黃'][i] : '玩家 ' + (i + 1);
function hud() {
  $('hud').innerHTML = pos.map((p, i) => `<div class="chip${i === turn && !over ? ' on' : ''}" style="--c:${COLORS[i]}"><b>${i + 1}</b>玩家 ${i + 1}<br>第 ${p} 格</div>`).join('');
}
function startGame(sameBoard) {
  gameId++;
  if (!sameBoard || !board) board = genBoard();
  pos = Array(cfg.n).fill(1); rolls = Array(cfg.n).fill(0); turn = 0; busy = false; over = false;
  $('setup').style.display = 'none'; $('game').style.display = 'block'; $('ov').style.display = 'none';
  fit(); drawBoard(); for (let i = 0; i < cfg.n; i++) placePawn(i, 1);
  $('die').textContent = '⚀'; $('roll').disabled = false; hud();
  $('msg').textContent = cfg.n > 1 ? '輪到 玩家 1,按「擲骰子」開始!' : '按「擲骰子」開始!';
}
async function doRoll() { try { await doRoll2(); } catch (e) { if (e !== 'abort') throw e; } }
async function doRoll2() {
  if (busy || over) return; busy = true; $('roll').disabled = true;
  $('die').classList.add('roll'); for (let k = 0; k < 8; k++) { $('die').textContent = FACES[ri(0, 5)]; sfx.tick(); await sleep(85); }
  const d = ri(1, 6); $('die').classList.remove('roll'); $('die').textContent = FACES[d - 1];
  const me = turn, who = pname(me); rolls[me]++;
  const path = stepsPath(pos[me], d, cfg.exact);
  $('msg').textContent = `${who} 擲出 ${d} 點`; await sleep(250);
  for (const c of path) { placePawn(me, c); const pw = $('pawn' + me); pw.classList.remove('hop'); void pw.offsetWidth; pw.classList.add('hop'); pos[me] = c; sfx.step(); hud(); await sleep(210); }
  let land = pos[me], note = '';
  if (land === 100) { await sleep(150); return win(me); }
  if (board.snakeAt[land]) { const to = board.snakeAt[land]; note = `🐍 ${who} 踩到蛇頭!從 ${land} 滑到 ${to}`; $('msg').textContent = note; sfx.down(); popAt(land, '嘶～🐍'); $('board').classList.remove('shake'); void $('board').offsetWidth; $('board').classList.add('shake'); await sleep(250);
    for (const [x, y] of board.path[land]) { placeXY(me, x, y); await sleep(38); } placePawn(me, to); pos[me] = to; await sleep(500); }
  else if (board.ladderAt[land]) { const to = board.ladderAt[land]; note = `🪜 ${who} 爬上樓梯!從 ${land} 到 ${to}`; $('msg').textContent = note; sfx.up(); popAt(land, '爬！🪜'); sparksAt(land, '#ffe27a'); await sleep(250); placePawn(me, to, true); pos[me] = to; await sleep(850); sparksAt(to, '#ffe27a'); }
  else if (board.snakes.some(s => s[1] === land)) note = `${who} 走到蛇尾,什麼事也沒發生`;
  else if (board.ladders.some(l => l[1] === land)) note = `${who} 走到樓梯頂,樓梯只能往上走`;
  else note = `${who} 走到第 ${land} 格`;
  if (pos[me] === 100) { $('msg').textContent = `🪜 ${who} 爬上樓梯,直達終點!`; await sleep(300); return win(me); }
  $('msg').textContent = note;
  turn = (turn + 1) % cfg.n; hud(); busy = false; $('roll').disabled = false;
  if (cfg.n > 1) $('msg').textContent = note + `  → 輪到 ${pname(turn)}`;
  if (demo) { await sleep(350); doRoll(); }
}
function win(i) {
  over = true; busy = false; hud(); sfx.win(); confetti(); popAt(100, '🏁 GOAL!');
  if (demo) { const id = gameId; setTimeout(() => { if (demo && id === gameId) demoStart(); }, 3600); return; }
  $('ovt').textContent = cfg.n > 1 ? `🎉 玩家 ${i + 1} 獲勝!` : '🎉 抵達終點!';
  $('ovp').innerHTML = cfg.n > 1 ? `玩家 ${i + 1} 擲了 <b>${rolls[i]}</b> 次骰子,最先走到第 100 格!` : `你用了 <b>${rolls[i]}</b> 次骰子走到第 100 格!`;
  $('ov').style.display = 'flex';
}

// ---------- 事件 ----------
$('pick').onclick = e => { const b = e.target.closest('button'); if (!b) return; cfg.n = +b.dataset.n; [...$('pick').children].forEach(x => x.classList.toggle('on', x === b)); };
$('exact').onchange = e => { cfg.exact = e.target.checked; };
$('start').onclick = () => startGame(false);
$('roll').onclick = doRoll; $('die').onclick = doRoll;
$('newmap').onclick = () => startGame(false); $('again').onclick = () => startGame(true);
$('ov1').onclick = () => startGame(true); $('ov2').onclick = () => startGame(false);
$('back').onclick = () => { gameId++; $('game').style.display = 'none'; $('setup').style.display = 'block'; $('ov').style.display = 'none'; over = true; };

// ---------- 背景音樂：鄉村藍草「爬樓梯快跑」----------
// G 大調、132 BPM：班鳩琴三指滾奏（亮金屬感撥弦合成）＋木低音提琴一拍一下＋洗衣板刷擊，第二輪加口哨旋律
let musOn = true; try { musOn = localStorage.getItem('snakes_music') !== '0'; sndOn = localStorage.getItem('snakes_snd') !== '0'; } catch (e) {}
const MU = { timer: null, bus: null, next: 0, step: 0, ks: {}, nb: null };
const mf = m => 440 * Math.pow(2, (m - 69) / 12);
const BG_CH = [[43, [55, 59, 62, 67]], [43, [55, 59, 62, 67]], [48, [55, 60, 64, 67]], [43, [55, 59, 62, 67]], [43, [55, 59, 62, 67]], [50, [54, 57, 62, 66]], [43, [55, 59, 62, 67]], [50, [54, 57, 62, 66]]];
const ROLL = [0, 1, 3, 0, 2, 3, 1, 3];   // 班鳩琴前後滾奏的撥弦順序（和弦音的第幾個）
const WH = [[79, 0, 81, 0, 83, 0, 81, 79], [76, 0, 0, 0, 74, 0, 0, 0], [76, 0, 79, 0, 81, 0, 79, 76], [74, 0, 0, 0, 0, 0, 0, 0], [79, 0, 81, 0, 83, 0, 86, 0], [81, 0, 79, 0, 78, 0, 76, 0], [74, 0, 76, 0, 79, 0, 0, 0], [78, 0, 0, 0, 79, 0, 0, 0]];
function ksBuf(m) { if (MU.ks[m]) return MU.ks[m]; const a = actx, sr = a.sampleRate, len = Math.floor(sr * .7), buf = a.createBuffer(1, len, sr), d = buf.getChannelData(0);
  const P = Math.max(2, Math.round(sr / mf(m))); for (let i = 0; i < P; i++) d[i] = Math.random() * 2 - 1;
  for (let i = P; i < len; i++) d[i] = (d[i - P] + d[i - P + 1]) * .494;   // 衰減快：班鳩琴的短促金屬音
  return MU.ks[m] = buf; }
function banjo(m, t, v) { const s = actx.createBufferSource(), g = actx.createGain(), hp = actx.createBiquadFilter(); s.buffer = ksBuf(m); hp.type = 'highpass'; hp.frequency.value = 350; g.gain.value = v; s.connect(hp); hp.connect(g); g.connect(MU.bus); s.start(t); s.stop(t + .7); }
function bassN(m, t, v) { const o = actx.createOscillator(), g = actx.createGain(), lp = actx.createBiquadFilter(); o.type = 'triangle'; o.frequency.value = mf(m); lp.type = 'lowpass'; lp.frequency.value = 500;
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + .32); o.connect(lp); lp.connect(g); g.connect(MU.bus); o.start(t); o.stop(t + .34); }
function wash(t, v) { const a = actx; if (!MU.nb) { MU.nb = a.createBuffer(1, a.sampleRate * .3, a.sampleRate); const d = MU.nb.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(); s.buffer = MU.nb; f.type = 'bandpass'; f.frequency.value = 4200; f.Q.value = 2; g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + .07); s.connect(f); f.connect(g); g.connect(MU.bus); s.start(t); s.stop(t + .08); }
function whistle(m, t, d, v) { const o = actx.createOscillator(), g = actx.createGain(), l = actx.createOscillator(), lg = actx.createGain(); o.frequency.value = mf(m); l.frequency.value = 5.5; lg.gain.value = mf(m) * .012; l.connect(lg); lg.connect(o.frequency);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .04); g.gain.setValueAtTime(v, t + d * .7); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g); g.connect(MU.bus); [o, l].forEach(x => { x.start(t); x.stop(t + d + .05); }); }
function musicTick() {
  if (!actx || !MU.bus) return; const E8 = 60 / 132 / 2;
  if (MU.next < actx.currentTime) MU.next = actx.currentTime + .05;
  while (MU.next < actx.currentTime + .2) {
    const t = MU.next, st = MU.step % 64, bar = st >> 3, i8 = st % 8, [root, ch] = BG_CH[bar];
    banjo(ch[ROLL[i8]] + 12, t, i8 % 2 ? .16 : .22);
    if (i8 % 2 === 0) bassN(root + (i8 === 2 || i8 === 6 ? 7 : 0), t, .34);
    wash(t, i8 % 2 ? .05 : .025);
    if (MU.step >= 64) { const n = WH[bar][i8]; if (n) whistle(n, t, E8 * (WH[bar][i8 + 1] === 0 ? 1.8 : .9), .05); }
    MU.next += E8; MU.step++;
  }
}
function musicStart() { if (!musOn || MU.timer) return; try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) { return; }
  if (!MU.bus) { MU.bus = actx.createGain(); MU.bus.connect(actx.destination); }
  MU.bus.gain.cancelScheduledValues(actx.currentTime); MU.bus.gain.setValueAtTime(0, actx.currentTime); MU.bus.gain.linearRampToValueAtTime(.55, actx.currentTime + 1.2);
  MU.step = 0; MU.next = actx.currentTime + .1; MU.timer = setInterval(musicTick, 50); musicTick(); }
function musicStop() { if (!MU.timer) return; clearInterval(MU.timer); MU.timer = null; if (MU.bus) MU.bus.gain.setTargetAtTime(0, actx.currentTime, .12); }
function sndUI() { $('bSnd').textContent = sndOn ? '🔊' : '🔇'; $('bSnd').classList.toggle('off', !sndOn); $('bMus').classList.toggle('off', !musOn); }
$('bSnd').onclick = () => { sndOn = !sndOn; try { localStorage.setItem('snakes_snd', sndOn ? '1' : '0'); } catch (e) {} sndUI(); };
$('bMus').onclick = () => { musOn = !musOn; try { localStorage.setItem('snakes_music', musOn ? '1' : '0'); } catch (e) {} sndUI(); musOn ? musicStart() : musicStop(); };
addEventListener('pointerdown', () => musicStart(), true);
document.addEventListener('visibilitychange', () => { if (document.hidden) musicStop(); else if (actx) musicStart(); });
function fitSnd() {
  const root = document.documentElement; root.style.setProperty('--sb', '0px'); const box = $('sndBox').getBoundingClientRect();
  const hit = [...document.querySelectorAll('main > h1,#hud .chip,#pLogo h2,#board')].some(e => { const r = e.getBoundingClientRect(); return r.width && r.right > box.left - 6 && r.top < box.bottom + 6 && r.bottom > box.top && r.left < box.right; });
  if (hit) root.style.setProperty('--sb', (box.bottom + 2) + 'px'); fit();
}
addEventListener('resize', fitSnd);

// ---------- 首頁廣告影片：四位電腦自動擲骰對戰 ----------
const CAPS = ['🎲 輪流擲骰子，先走到第 100 格就贏！', '🪜 停在樓梯底部，一路爬上去', '🐍 踩到蛇頭，會沿著蛇身滑下去', '⚠️ 第 99 格的大蛇直接滑回起點！'];
let capI = 0, capT = null;
function pCap(t) { $('pCap').innerHTML = '<span class="cp">' + [...t].map((ch, i) => `<span style="animation-delay:${i * .03}s">${ch === ' ' ? '&nbsp;' : ch}</span>`).join('') + '</span>'; }
let userCfg = null;
function demoStart() { if (!userCfg) userCfg = { ...cfg }; demo = true; cfg = { n: 4, exact: false }; startGame(false); fitSnd(); setTimeout(() => { if (demo) doRoll(); }, 600); }
function showPromo() { document.body.classList.add('promo'); $('ov').style.display = 'none'; capI = 0; pCap(CAPS[capI++]); clearInterval(capT); capT = setInterval(() => pCap(CAPS[capI++ % CAPS.length]), 5000); demoStart(); }
function leavePromo() { demo = false; gameId++; if (userCfg) { cfg = userCfg; userCfg = null; } clearInterval(capT); document.body.classList.remove('promo'); $('game').style.display = 'none'; $('setup').style.display = 'block'; busy = false; over = true; fitSnd(); }
$('pStart').onclick = () => { musicStart(); leavePromo(); };
$('pRules').onclick = () => { $('ovt').textContent = '📖 規則'; $('ovp').innerHTML = '<ol style="text-align:left;padding-left:1.2em;margin:0">' + document.querySelector('.rules').innerHTML + '</ol>'; $('ov1').style.display = 'none'; $('ov2').textContent = '知道了'; $('ov2').onclick = () => { $('ov').style.display = 'none'; $('ov1').style.display = ''; $('ov2').textContent = '新地圖'; $('ov2').onclick = () => startGame(false); }; $('ov').style.display = 'flex'; };
sndUI(); showPromo(); fitSnd();
addEventListener('keydown', e => { if ((e.code === 'Space' || e.key === 'Enter') && $('game').style.display === 'block' && $('ov').style.display !== 'flex') { e.preventDefault(); doRoll(); } });
</script>
