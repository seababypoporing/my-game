<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>七巧板</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
  :root { --bg:#1d2433; --panel:#2a3347; --ink:#f3ead7; --accent:#f2b84b; --muted:#93a0b8; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif; }
  body { display:flex; flex-direction:column; align-items:center; padding:10px 16px; gap:8px; }
  /* 一般：左組（上一關/下一關、關卡）在左上，右組（音樂/音效、時間、提示）在右上，畫布在下面 */
  #main { width:100%; max-width:1200px; display:grid; grid-template-columns:1fr 1fr;
    grid-template-areas:"L R" "C C"; gap:6px 10px; align-items:start; }
  #leftP { grid-area:L; justify-content:flex-start; }
  #rightP { grid-area:R; justify-content:flex-end; }
  #wrap { grid-area:C; }
  .side { display:flex; flex-wrap:wrap; align-items:center; gap:6px 8px; min-width:0; }
  .grp { display:flex; gap:6px; flex:none; }
  .stat, h1 { white-space:nowrap; }
  button.sm { font-size:14px; padding:6px 11px; white-space:nowrap; }
  /* 兩側有空位時：把兩組移到畫布左右兩邊，上方空出來給畫布 */
  body.sidep #main { grid-template-columns:auto auto auto; grid-template-areas:"L C R"; justify-content:center; column-gap:12px; }
  body.sidep .side { flex-direction:column; flex-wrap:nowrap; align-items:stretch; gap:8px; }
  body.sidep .grp { flex-direction:column; }
  body.sidep .grp { order:1; margin-top:6px; }   /* 兩側排法：按鈕放在資訊下面 */
  body.sidep .stat, body.sidep h1 { text-align:center; }
  body.sidep .lvstat b#lvName { display:block; }
  h1 { font-size:22px; margin:0; color:var(--accent); letter-spacing:4px; }
  .stat { background:var(--panel); border-radius:8px; padding:5px 12px; font-size:15px; }
  .stat b { color:var(--accent); font-variant-numeric:tabular-nums; }
  .spacer { flex:1; }
  #wrap { width:100%; position:relative; display:flex; justify-content:center; min-width:0; }
  canvas#game { width:100%; display:block; border-radius:14px; background:#f3ead7; touch-action:none; cursor:grab; }
  .bar { width:100%; max-width:1200px; display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  button { font:inherit; font-size:15px; color:var(--ink); background:var(--panel); border:1px solid #3d4963;
    border-radius:10px; padding:9px 14px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); color:#2a2010; border-color:var(--accent); font-weight:bold; }
  .tip { color:var(--muted); font-size:13px; text-align:center; max-width:960px; }
  .overlay { position:fixed; inset:0; background:rgba(10,14,22,.78); display:none; align-items:center;
    justify-content:center; padding:16px; z-index:10; }
  .overlay.show { display:flex; }
  .dialog { background:var(--panel); border-radius:16px; padding:22px; max-width:640px; width:100%;
    max-height:90vh; overflow:auto; text-align:center; }
  .dialog h2 { margin:0 0 12px; color:var(--accent); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:10px; margin:14px 0; }
  .lv { background:#f3ead7; color:#2a2010; border:2px solid transparent; border-radius:12px; padding:6px;
    display:flex; flex-direction:column; align-items:center; gap:2px; font-size:13px; }
  .lv.cur { border-color:var(--accent); }
  .lv canvas { width:90px; height:70px; }
  .lv .st { color:#c98a12; letter-spacing:2px; min-height:16px; }
  #menu .dialog { max-width:1200px; max-height:96vh; padding:26px; }
  #menu h2 { font-size:30px; }
  #menu .grid { grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:14px; }
  #menu .lv { font-size:17px; padding:10px; gap:4px; }
  #menu .lv canvas { width:144px; height:112px; }
  #menu .lv .st { font-size:18px; min-height:22px; }
  #menu #bClose { font-size:18px; padding:11px 28px; }
  .stars { font-size:40px; color:var(--accent); letter-spacing:6px; margin:6px 0; }
  /* 橫拿手機（畫面矮）：把上下的列壓扁，讓遊戲區更大 */
  @media (max-height:560px) {
    body { padding:4px 10px; gap:4px; }
    h1 { font-size:17px; letter-spacing:2px; }
    .stat { font-size:13px; padding:2px 8px; }
    .bar { gap:5px; }
    .bar button { font-size:13px; padding:5px 9px; border-radius:8px; }
    button.sm { font-size:12px; padding:4px 8px; }
    .tip { display:none; }
  }
  @media (pointer:coarse) { .tip { display:none; } }
  @media (max-width:560px) {
    body { padding:8px 8px; gap:6px; }
    h1 { font-size:18px; }
    .stat { font-size:13px; padding:3px 8px; }
    button.sm { font-size:13px; padding:5px 8px; }
    .bar { gap:5px; }
    .bar { flex-wrap:nowrap; }
    .bar button { font-size:13px; padding:8px 2px; flex:1 1 0; min-width:0; white-space:nowrap; }
    .tip { font-size:12px; }
  }
  .row { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:14px; }
  /* v0.8 WebGPU：背景流動水墨 + 粒子特效（不支援時自動隱藏，遊戲照常） */
  #gpuBg { position:fixed; inset:0; width:100%; height:100%; z-index:-1; display:none; pointer-events:none; }
  #gpuFx { position:fixed; inset:0; width:100%; height:100%; z-index:20; display:none; pointer-events:none; }
  body.gpu #gpuBg, body.gpu #gpuFx { display:block; }
  body.gpu { background:transparent; }
  body.gpu .stat { background:rgba(42,51,71,.82); }
  /* v0.9 首頁：背景是自動拼圖的廣告影片 */
  body.promo #leftP, body.promo #rightP, body.promo .bar, body.promo .tip { visibility:hidden; }
  #tgPromo { position:fixed; inset:0; z-index:15; display:none; flex-direction:column; align-items:center; justify-content:space-between;
    padding:calc(10px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg, rgba(14,18,28,.88) 0%, rgba(14,18,28,0) 26%, rgba(14,18,28,0) 70%, rgba(14,18,28,.9) 100%); }
  body.promo #tgPromo { display:flex; }
  #tgLogo { text-align:center; }
  #tgLogo .w { display:inline-flex; gap:10px; font-family:"Noto Serif TC","Songti TC","PMingLiU",serif; font-weight:900;
    font-size:clamp(40px,9vmin,76px); letter-spacing:4px; }
  #tgLogo .w span { display:inline-block; color:#f3ead7; text-shadow:0 4px 0 var(--c), 0 7px 14px rgba(0,0,0,.55); animation:tgbob 2.8s ease-in-out infinite; }
  @keyframes tgbob { 0%,100% { transform:translateY(0) rotate(0); } 35% { transform:translateY(-8px) rotate(-5deg); } 65% { transform:translateY(0) rotate(3deg); } }
  #tgLogo .s { display:inline-block; margin-top:4px; color:var(--accent); font-size:clamp(12px,2.8vmin,15px); letter-spacing:3px; background:rgba(20,26,40,.85); border-radius:999px; padding:3px 14px; }
  #tgCap { min-height:38px; margin-top:8px; text-align:center; }
  #tgCap .pill { display:inline-block; background:rgba(42,51,71,.92); border:2px solid var(--accent); color:var(--ink); font-weight:bold;
    font-size:clamp(14px,3vmin,16px); border-radius:999px; padding:6px 16px; box-shadow:0 4px 12px rgba(0,0,0,.45); }
  #tgCap .pill span { display:inline-block; opacity:0; animation:tgIn .4s cubic-bezier(.3,1.8,.5,1) forwards; }
  @keyframes tgIn { 0% { opacity:0; transform:translateY(12px) scale(.4); } 100% { opacity:1; transform:none; } }
  #tgCard { display:flex; flex-direction:column; align-items:center; gap:8px; }
  #tgCard .row2 { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  #tgStart { font-size:20px; padding:12px 40px; animation:tgpulse 1.6s ease-in-out infinite; }
  @keyframes tgpulse { 50% { transform:scale(1.05); } }
  #tgCard .ver { font-size:11px; color:var(--muted); }
</style>
</head>
<body>
<canvas id="gpuBg"></canvas>
<canvas id="gpuFx"></canvas>
<div id="tgPromo">
  <div><div id="tgLogo"><div class="w"><span style="--c:#e4572e">七</span><span style="--c:#2e86ab;animation-delay:.18s">巧</span><span style="--c:#76b041;animation-delay:.36s">板</span></div>
    <div class="s">TANGRAM ‧ 七塊板，拼出萬千形狀</div></div>
  <div id="tgCap"></div></div>
  <div id="tgCard"><button class="primary" id="tgStart">▶ 開始遊戲</button>
    <div class="row2"><button id="tgMenu">☰ 選關</button></div><div class="ver">v0.9</div></div>
</div>
<div id="main">
  <div class="side" id="leftP">
    <div class="grp" id="navG">
      <button class="sm" id="bPrev">◀ 上一關</button>
      <button class="sm" id="bNext">下一關 ▶</button>
    </div>
    <h1>七巧板</h1>
    <div class="stat lvstat">第 <b id="lvNo">1</b> 關　<b id="lvName"></b></div>
  </div>
  <div id="wrap"><canvas id="game"></canvas></div>
  <div class="side" id="rightP">
    <div class="grp" id="sndG">
      <button class="sm" id="bMusic">🎵 音樂 開</button>
      <button class="sm" id="bSfx">🔊 音效 開</button>
      <button class="sm" id="bFx" title="WebGPU 特效">✨ 特效 …</button>
    </div>
    <div class="stat">時間 <b id="time">0:00</b></div>
    <div class="stat">提示 <b id="hints">0</b></div>
  </div>
</div>
<div class="bar">
  <button id="bL">⟲ 左轉</button>
  <button id="bR">⟳ 右轉</button>
  <button id="bF">⇋ 翻面</button>
  <button id="bH">💡 提示</button>
  <button id="bReset">↺ 重來</button>
  <button id="bMenu">☰ 選關</button>
  <button id="bHome">🏠 首頁</button>
</div>
<div class="tip">v0.9 首頁自動示範｜拖曳移動｜點一下板塊＝右轉 45°｜滾輪旋轉｜右鍵或「翻面」＝翻轉（平行四邊形會用到）｜鍵盤 Q/E 旋轉、F 翻面</div>

<div class="overlay" id="menu"><div class="dialog">
  <h2>選擇關卡</h2>
  <div class="grid" id="grid"></div>
  <button id="bClose">關閉</button>
</div></div>

<div class="overlay" id="win"><div class="dialog">
  <h2>完成！</h2>
  <div class="stars" id="wStars"></div>
  <div id="wInfo"></div>
  <div class="row">
    <button id="wAgain">再玩一次</button>
    <button id="wMenu">選關</button>
    <button class="primary" id="wNext">下一關 ▶</button>
  </div>
</div></div>

<script>
"use strict";
const U = 74, SNAP = 18;
// 版面：橫向畫面→板塊放左右兩側；直向畫面→板塊放下方
// slots 順序對應 ORDER：大、大、中三角、正方形、小、小、平行四邊形
// 每個 slot = [外框中心 x, 外框中心 y, 初始角度]；板塊區用最扁的擺法，省下空間給拼圖區
const LAYOUTS = {
  side:  { W:912, H:481, BX:487, BY:240.5, board:[246, 0, 727, 481],
           trays:[[0, 0, 246, 481], [727, 0, 912, 481]],
           slots:[[123,102,1],[123,256,1],[123,394,1],[820,202,0],[820,311,1],[820,409,1],[820,83,0]] },
  stack: { W:481, H:807, BX:240.5, BY:240.5, board:[0, 0, 481, 481],
           trays:[[0, 481, 481, 807]],
           slots:[[125,552,1],[356,552,1],[152,659,1],[240,752,0],[125,752,1],[356,752,1],[329,659,0]] },
};
function placeInSlot(p, L) {
  const s = L.slots[p.slot], v = xform(p.type, s[2], 0);
  const xs = v.map(q => q[0]*U), ys = v.map(q => q[1]*U);
  p.rot = s[2]; p.flip = 0;
  p.x = s[0] - (Math.min(...xs) + Math.max(...xs)) / 2;
  p.y = s[1] - (Math.min(...ys) + Math.max(...ys)) / 2;
}
let LY = LAYOUTS.side, W = LY.W, H = LY.H, BX = LY.BX, BY = LY.BY;
function pickLayout() { return chooseFit().L; }
const R2 = Math.SQRT2;
const COLORS = { L:['#e4572e','#f29e4c'], M:['#2e86ab'], S:['#76b041','#17bebb'], Q:['#f2c14e'], P:['#a05cc5'] };
const ORDER = ['L','L','M','Q','S','S','P'];

// 板塊外形（單位長 = 小三角形的直角邊），以重心為原點
const SHAPES = (() => {
  const raw = { L:[[0,0],[2,0],[0,2]], M:[[0,0],[R2,0],[0,R2]], S:[[0,0],[1,0],[0,1]],
                Q:[[0,0],[1,0],[1,1],[0,1]], P:[[0,0],[1,0],[2,1],[1,1]] };
  const out = {};
  for (const k in raw) { const c = centroid(raw[k]); out[k] = raw[k].map(p => [p[0]-c[0], p[1]-c[1]]); }
  return out;
})();

function centroid(poly) {
  let x = 0, y = 0; for (const p of poly) { x += p[0]; y += p[1]; }
  return [x/poly.length, y/poly.length];
}
function xform(type, rot, flip) {
  const a = rot * Math.PI / 4, c = Math.cos(a), s = Math.sin(a);
  return SHAPES[type].map(p => { const x = flip ? -p[0] : p[0], y = p[1]; return [x*c - y*s, x*s + y*c]; });
}
function inPoly(x, y, poly) {
  let inside = false;
  for (let i = 0, j = poly.length-1; i < poly.length; j = i++) {
    const [xi, yi] = poly[i], [xj, yj] = poly[j];
    if ((yi > y) !== (yj > y) && x < (xj-xi)*(y-yi)/(yj-yi) + xi) inside = !inside;
  }
  return inside;
}

// 關卡：每一關是七塊板的解答位置（格點座標），剪影 = 七塊的聯集
const T = (t, ...n) => { const pts = []; for (let i = 0; i < n.length; i += 2) pts.push([n[i], n[i+1]]); return { t, pts }; };
const SQ4 = (dx, dy) => [ // 用 M、Q、S、S、P 拼出 2x2 正方形
  T('M', 0+dx,2+dy, 2+dx,2+dy, 1+dx,1+dy), T('Q', 0+dx,0+dy, 1+dx,0+dy, 1+dx,1+dy, 0+dx,1+dy),
  T('S', 0+dx,1+dy, 1+dx,1+dy, 0+dx,2+dy), T('P', 1+dx,0+dy, 2+dx,1+dy, 2+dx,2+dy, 1+dx,1+dy),
  T('S', 1+dx,0+dy, 2+dx,0+dy, 2+dx,1+dy) ];
// 組合用的零件（都落在格點上），可用 G() 旋轉 / 翻轉後擺到指定位置
const A1 = [ T('L',0,0,2,0,0,2), T('L',2,0,2,2,0,2) ];                 // 兩大三角：2x2 正方形
const A2 = [ T('L',2,0,2,2,0,2), T('L',2,0,4,2,2,2) ];                 // 兩大三角：尖端朝上的大三角
const A3 = [ T('L',0,0,2,0,2,2), T('L',2,0,4,2,2,2) ];                 // 兩大三角：平行四邊形
const L0 = [ T('L',0,0,2,0,0,2) ], M0 = [ T('M',0,1,2,1,1,0) ];
const B1 = SQ4(0,0);                                                    // 五小塊：2x2 正方形
const B2 = [ T('Q',1,0,2,0,2,1,1,1), T('S',0,0,1,0,1,1), T('M',1,1,3,1,2,2),
             T('P',3,0,4,0,3,1,2,1), T('S',2,0,3,0,2,1) ];              // 五小塊：尖端朝下的大三角
const B3 = [ T('S',0,0,1,0,1,1), T('Q',1,0,2,0,2,1,1,1), T('S',2,0,3,0,2,1), T('P',2,1,3,1,4,0,3,0) ]; // 上寬下窄梯形（不含 M）
const B4 = [ T('S',0,0,1,0,0,1), T('P',1,0,2,0,1,1,0,1), T('S',1,1,2,0,2,1), T('Q',2,0,3,0,3,1,2,1) ]; // 3x1 長條（不含 M）
const B6 = [ T('S',0,0,1,0,0,1), T('M',0,1,2,1,1,0), T('P',1,0,2,0,3,1,2,1), T('S',2,0,3,0,3,1), T('Q',3,0,4,0,4,1,3,1) ]; // 4x1 長條
const TF = { I:(x,y)=>[x,y], H:(x,y)=>[-x,y], V:(x,y)=>[x,-y], R:(x,y)=>[-y,x], L:(x,y)=>[y,-x], U:(x,y)=>[-x,-y] };
function G(parts, tf, dx, dy) {
  const out = parts.map(s => ({ t:s.t, pts:s.pts.map(([x, y]) => TF[tf](x, y)) }));
  let mx = 1e9, my = 1e9;
  for (const s of out) for (const p of s.pts) { mx = Math.min(mx, p[0]); my = Math.min(my, p[1]); }
  for (const s of out) for (const p of s.pts) { p[0] += dx - mx; p[1] += dy - my; }
  return out;
}
const C = (name, ...g) => ({ name, p:g.flatMap(a => G(...a)) });

const LEVELS = [
  { name:'小屋', p:[ T('L',2,0,2,2,0,2), T('L',2,0,4,2,2,2), ...SQ4(1,2) ] },
  { name:'小魚', p:[ T('L',0,2,2,0,2,2), T('L',0,2,2,2,2,4), T('P',2,0,3,1,3,2,2,1), T('S',2,1,3,2,2,2),
                     T('Q',2,2,3,2,3,3,2,3), T('S',2,3,3,3,2,4), T('M',3,2,4,1,4,3) ] },
  { name:'帆船', p:[ T('L',2,1,2,3,0,3), T('L',2,1,4,3,2,3), T('M',2,-1,3,0,2,1), T('S',0,3,1,3,1,4),
                     T('Q',1,3,2,3,2,4,1,4), T('S',2,3,3,3,2,4), T('P',2,4,3,4,4,3,3,3) ] },
  { name:'火箭', p:[ T('M',1,1,3,1,2,0), T('L',1,1,3,1,1,3), T('L',3,1,3,3,1,3), T('S',1,3,1,4,0,4),
                     T('Q',1,3,2,3,2,4,1,4), T('S',2,3,3,4,2,4), T('P',2,3,3,3,4,4,3,4) ] },
  { name:'雙峰山', p:[ T('L',2,2,2,4,0,4), T('L',2,2,4,4,2,4), T('M',4,4,6,4,5,3), T('S',1,4,2,4,2,5),
                     T('Q',2,4,3,4,3,5,2,5), T('S',3,4,4,4,3,5), T('P',3,5,4,5,5,4,4,4) ] },
  { name:'長方形', p:[ T('L',0,0,2,0,0,2), T('L',2,0,2,2,0,2), ...SQ4(2,0) ] },
  { name:'梯形', p:[ T('L',2,0,2,2,0,2), T('L',4,0,6,2,4,2), ...SQ4(2,0) ] },
  { name:'平行四邊形', p:[ T('L',0,0,2,0,2,2), T('L',4,0,4,2,6,2), ...SQ4(2,0) ] },
  { name:'大三角形', p:[ T('L',0,0,0,2,2,2), T('L',2,2,2,4,4,4), ...SQ4(0,2) ] },
  { name:'鑽石', p:[ T('L',0,2,2,0,2,2), T('L',2,0,4,2,2,2), T('Q',1,2,2,2,2,3,1,3), T('S',0,2,1,2,1,3),
                     T('M',1,3,3,3,2,4), T('P',3,2,4,2,3,3,2,3), T('S',2,2,3,2,2,3) ] },
  C('陀螺',   [B6,'I',0,0], [A2,'V',0,1]),
  C('帽子',   [A1,'I',1,0], [B6,'I',0,2]),
  C('靴子',   [B6,'R',0,0], [A1,'I',1,2]),
  C('旗子',   [B6,'R',0,0], [A1,'I',1,0]),
  C('子彈',   [B6,'R',0,0], [A2,'R',1,0]),
  C('滑梯',   [B6,'I',0,0], [A3,'I',0,1]),
  C('聖誕樹', [M0,'I',1,0], [A2,'I',0,1], [B3,'V',0,3]),
  C('獎盃',   [A2,'V',0,0], [M0,'I',1,2], [B3,'V',0,3]),
  C('沙漏',   [A2,'V',0,0], [B2,'V',0,2]),

  for (const s of L.p) for (const [x, y] of s.pts) { x0 = Math.min(x0,x); x1 = Math.max(x1,x); y0 = Math.min(y0,y); y1 = Math.max(y1,y); }

// ---------- 繪圖 ----------
function path(c, pts) { c.beginPath(); pts.forEach((p, i) => i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1])); c.closePath(); }
function draw() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#f3ead7'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#e6dac0';
  for (const t of LY.trays) ctx.fillRect(t[0], t[1], t[2]-t[0], t[3]-t[1]);
  ctx.strokeStyle = '#cdbf9f'; ctx.lineWidth = 2; ctx.setLineDash([8, 8]); ctx.beginPath();
  const b = LY.board;   // 在拼圖區與板塊區的交界畫虛線
  if (b[0] > 0) { ctx.moveTo(b[0], 0); ctx.lineTo(b[0], H); }
  if (b[2] < W) { ctx.moveTo(b[2], 0); ctx.lineTo(b[2], H); }
  if (b[3] < H) { ctx.moveTo(0, b[3]); ctx.lineTo(W, b[3]); }
  ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = '#3a4258'; ctx.strokeStyle = '#3a4258'; ctx.lineWidth = 1.5; ctx.lineJoin = 'round';
  for (const s of target) { path(ctx, s.pts); ctx.fill(); ctx.stroke(); }
  for (const p of pieces) {
    path(ctx, vverts(p));

    5,_,7,6, 5,_,3,_, 4,5,7,_, 6,_,_,_,
    7,_,8,7, 6,5,3,_, 4,_,3,2, 3,_,_,_,
    5,6,7,_, 9,_,8,7, 6,_,5,6, 7,_,_,_,
    8,7,6,5, 3,_,4,5, 3,_,2,_, 5,_,_,_ ];
  const BASS = [38,38, 35,35, 43,43, 45,38];      // 每小節的低音

    sfxGain = ac.createGain(); sfxGain.gain.value = 0.35; sfxGain.connect(ac.destination);

    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

    rot:   () => tone('triangle', 520, 780, 0.07, 0.45),

// ---------- 判定 ----------
function snap(p) {
  const cand = snapPts.slice();
  for (const o of pieces) if (o !== p) cand.push(...verts(o));
  let best = SNAP, dx = 0, dy = 0;
  for (const v of verts(p)) for (const c of cand) {
    const d = Math.hypot(c[0]-v[0], c[1]-v[1]);
    if (d < best) { best = d; dx = c[0]-v[0]; dy = c[1]-v[1]; }
  }
  p.x += dx; p.y += dy;
  p.x = Math.max(20, Math.min(W-20, p.x)); p.y = Math.max(20, Math.min(H-20, p.y));
  return best < SNAP;
}
function rasterize(polys) {
  mctx.clearRect(0, 0, W, H); mctx.fillStyle = '#000';
  for (const pts of polys) { path(mctx, pts); mctx.fill(); }
  return mctx.getImageData(0, 0, W, H).data;
}
function checkWin() {
  if (won) return;
  const a = rasterize(target.map(s => s.pts)), b = rasterize(pieces.map(verts));
  let area = 0, miss = 0, out = 0;
  for (let i = 3; i < a.length; i += 4) {
    const A = a[i] > 127, B = b[i] > 127;
    if (A) { area++; if (!B) miss++; } else if (B) out++;
  }
  if (miss < area*0.04 && out < area*0.04) finish();
}
function finish() {
  won = true; sel = null; elapsed = (performance.now() - t0) / 1000;
  const stars = (hints === 0 && elapsed < 120) ? 3 : (hints <= 1 || elapsed < 300) ? 2 : 1;
  const old = save[cur];
  if (!old || stars > old.stars || (stars === old.stars && elapsed < old.time)) { save[cur] = { stars, time:elapsed }; persist(); }
  document.getElementById('wStars').textContent = '★'.repeat(stars) + '☆'.repeat(3 - stars);
  document.getElementById('wInfo').textContent = `「${LEVELS[cur].name}」用時 ${fmt(elapsed)}，使用提示 ${hints} 次`;
  draw(); Snd.play('win');
  GPU.win(pieces.map(p => ({ v:verts(p), color:p.color })), BX, BY);
  if (GS) { // 拼好的圖發出金光，板塊一塊塊跳一下
    GS.timeline({ onUpdate:req }).to(VIS, { glow:1, duration:.3, ease:'power2.out' }).to(VIS, { glow:0, duration:.8, ease:'power2.in' }, '+=.4');
    pieces.forEach((p, i) => GS.timeline({ delay:i*.06, onUpdate:req }).to(p, { sc:1.12, duration:.14, ease:'power2.out' }).to(p, { sc:1, duration:.4, ease:'elastic.out(1,.4)' }));
  }
  setTimeout(() => {
    if (!won) return;
    document.getElementById('win').classList.add('show');
    if (GS) {
      const st = document.getElementById('wStars');
      st.innerHTML = [...st.textContent].map(c => `<span style="display:inline-block">${c}</span>`).join('');
      GS.from('#win .dialog', { scale:.6, opacity:0, duration:.4, ease:'back.out(1.8)', clearProps:'transform,opacity' });
      GS.from(st.children, { scale:0, rotation:-120, duration:.5, stagger:.15, delay:.2, ease:'back.out(2.5)' });
    }
  }, GS ? 900 : 450);
}
function fmt(s) { s = Math.floor(s); return Math.floor(s/60) + ':' + String(s%60).padStart(2, '0'); }
setInterval(() => { if (!won) elapsed = (performance.now() - t0) / 1000; document.getElementById('time').textContent = fmt(elapsed); }, 250);

// ---------- 操作 ----------
function pos(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height]; }

function settle(p, sound) {
  const x0 = p.x, y0 = p.y;
  const s = snap(p); if (sound) Snd.play(s ? 'snap' : 'drop');
  if (s && sound) GPU.burst(verts(p), p.color);
  if (GS) { // 吸附：從原本位置「咔」一下滑進去，吸到時再彈一下
    p.ox = (p.ox || 0) + x0 - p.x; p.oy = (p.oy || 0) + y0 - p.y;
    anim(p, { ox:0, oy:0, duration:s ? .2 : .12, ease:s ? 'back.out(3)' : 'power2.out' });
    if (s && sound) GS.timeline({ onUpdate:req }).to(p, { sc:1.07, duration:.07 }).to(p, { sc:1, duration:.35, ease:'elastic.out(1,.35)' });

}
function rotate(p, d) { if (!p || won) return; p.rot = (p.rot + d + 8) % 8; Snd.play('rot');
  if (GS) { p.ra = (p.ra || 0) - d * Math.PI / 4; anim(p, { ra:0, duration:.28, ease:'back.out(2)' }); }
  settle(p); }
function flip(p) { if (!p || won) return; p.flip ^= 1; p.rot = (8 - p.rot) % 8; Snd.play('flip');
  if (GS) { p.ra = -(p.ra || 0); p.wsx = -1; anim(p, { wsx:1, ra:0, duration:.35, ease:'power2.inOut' }); }
  settle(p); }

cv.addEventListener('pointerdown', e => {
  if (won || e.button > 0) return;
  const [x, y] = pos(e), p = pick(x, y);
  sel = p;
  if (p) {
    pieces.splice(pieces.indexOf(p), 1); pieces.push(p);
    drag = { dx:x - p.x, dy:y - p.y, sx:x, sy:y, moved:false, t:performance.now() };
    cv.setPointerCapture(e.pointerId); cv.style.cursor = 'grabbing'; Snd.play('pick');
    anim(p, { lift:1, sc:1.05, duration:.15, ease:'power2.out' });   // 拿起：放大＋影子
  }
  draw();
});
cv.addEventListener('pointermove', e => {
  if (!drag || !sel) return;
  const [x, y] = pos(e);
  if (Math.hypot(x - drag.sx, y - drag.sy) > 6) drag.moved = true;
  if (drag.moved) { sel.x = x - drag.dx; sel.y = y - drag.dy; draw(); GPU.trail(sel.x, sel.y, sel.color); }
});
function endDrag() {
  if (!drag || !sel) { drag = null; return; }
  const tap = !drag.moved && performance.now() - drag.t < 400;
  drag = null; cv.style.cursor = 'grab';
  anim(sel, { lift:0, sc:1, duration:.2, ease:'power2.out' });       // 放下：影子收回
  if (tap) rotate(sel, 1); else settle(sel, true);
}
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);
cv.addEventListener('contextmenu', e => { e.preventDefault(); const [x, y] = pos(e), p = pick(x, y); if (p) { sel = p; flip(p); } });
cv.addEventListener('wheel', e => {
  const [x, y] = pos(e), p = pick(x, y) || sel; if (!p) return;
  e.preventDefault(); sel = p; rotate(p, e.deltaY > 0 ? 1 : -1);
}, { passive:false });
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'q') rotate(sel, -1); else if (k === 'e' || k === 'r') rotate(sel, 1); else if (k === 'f') flip(sel);
});

function hint() {
  if (won) return;
  const used = new Set();
  let pickT = null;
  for (const s of target) {
    const c = centroid(s.pts);
    const m = pieces.find(p => !used.has(p) && p.type === s.t && Math.hypot(p.x - c[0], p.y - c[1]) < 8);
    if (m) used.add(m); else if (!pickT) pickT = s;
  }
  if (!pickT) return;
  const free = pieces.find(p => !used.has(p) && p.type === pickT.t);
  hints++; document.getElementById('hints').textContent = hints; Snd.play('hint');
  const h = hintShow = { pts:pickT.pts, color:free ? free.color : '#fff', pulse:0 };
  anim(h, { pulse:1, duration:.3, yoyo:true, repeat:9, ease:'sine.inOut' });   // 提示框一閃一閃
  draw();
  setTimeout(() => { if (hintShow === h) { hintShow = null; draw(); } }, 3000);
}

function buildMenu() {
  const g = document.getElementById('grid'); g.innerHTML = '';
  LEVELS.forEach((L, i) => {
    const b = document.createElement('button'); b.className = 'lv' + (i === cur ? ' cur' : '');
    const c = document.createElement('canvas'); c.width = 180; c.height = 140;
    const x = c.getContext('2d');
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    for (const s of L.p) for (const [px, py] of s.pts) { x0 = Math.min(x0,px); x1 = Math.max(x1,px); y0 = Math.min(y0,py); y1 = Math.max(y1,py); }
    const k = Math.min(150/(x1-x0), 115/(y1-y0));
    x.fillStyle = x.strokeStyle = '#3a4258'; x.lineWidth = 1.5;
    for (const s of L.p) { path(x, s.pts.map(([px, py]) => [90 + (px-(x0+x1)/2)*k, 70 + (py-(y0+y1)/2)*k])); x.fill(); x.stroke(); }
    const st = save[i] ? '★'.repeat(save[i].stars) : '';
    const name = document.createElement('div'); name.textContent = (i+1) + '. ' + L.name;
    const stars = document.createElement('div'); stars.className = 'st'; stars.textContent = st;
    b.append(c, name, stars);
    b.onclick = () => { document.getElementById('menu').classList.remove('show'); loadLevel(i); };
    g.appendChild(b);
  });
}
function openMenu() { buildMenu(); document.getElementById('win').classList.remove('show'); document.getElementById('menu').classList.add('show'); }

function labels() { $('bMusic').textContent = '🎵 音樂 ' + (Snd.musicOn ? '開' : '關'); $('bSfx').textContent = '🔊 音效 ' + (Snd.sfxOn ? '開' : '關'); }
$('bMusic').onclick = () => { Snd.toggleMusic(); labels(); };
$('bSfx').onclick = () => { Snd.toggleSfx(); labels(); };
labels();
function fxLabel() {
  if (!GPU.ok) { $('bFx').textContent = '✨ 特效 不支援'; $('bFx').disabled = true; $('bFx').title = '這個瀏覽器沒有 WebGPU'; return; }
  $('bFx').textContent = '✨ 特效 ' + (GPU.on ? '開' : '關');
}
$('bFx').onclick = () => { GPU.toggle(); fxLabel(); };
GPU.ready.then(() => { fxLabel(); resize(); });
for (const id of ['bReset','bPrev','bNext','bMenu','bClose','wAgain','wMenu','wNext','bMusic','bSfx','bFx'])
  $(id).addEventListener('click', () => Snd.play('ui'));

// 除錯用：在主控台輸入 tangramDebug.solve() 直接擺出解答
window.tangramDebug = { solve() {
  const used = new Set();
  for (const s of target) {
    const p = pieces.find(q => !used.has(q) && q.type === s.t); used.add(p);
    const o = orientFor(s.t, s.pts.map(v => [v[0]/U, v[1]/U]));
    p.rot = o.r; p.flip = o.f; p.x = o.c[0]*U; p.y = o.c[1]*U;
  }
  draw(); checkWin(); return won;
}, area() { let n = 0; const a = rasterize(target.map(s => s.pts)); for (let i = 3; i < a.length; i += 4) if (a[i] > 127) n++; return n / (8*U*U); },
  level:i => loadLevel(i), state:() => ({ cur, won, n:LEVELS.length }) };

addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 200));
// ---------- v0.9 首頁廣告影片：自動把七塊板飛進剪影，拼好就放煙火 ----------
// 用自己的 requestAnimationFrame 補間，沒有 GSAP 也能動
let demo = false, demoId = 0, demoLv = 0, capT = null, capI = 0;
const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
function tween(ms, fn, id) { return new Promise(res => { const t0 = performance.now();
  (function f(now) { if (id !== demoId) return res(false); const k = Math.min(1, (now - t0) / ms); fn(k); draw(); if (k < 1) requestAnimationFrame(f); else res(true); })(t0); }); }
const wait = (ms, id) => new Promise(r => setTimeout(() => r(id === demoId), ms));
const CAPS = () => ['拖曳、旋轉、翻面，拼出黑色剪影！', '七塊板：兩大、一中、兩小三角形，加上正方形和平行四邊形', LEVELS.length + ' 個剪影關卡，看你能拿幾顆星 ★★★'];
function cap() { const t = CAPS()[capI++ % 3]; $('tgCap').innerHTML = '<span class="pill">' + [...t].map((c, i) => `<span style="animation-delay:${i*.03}s">${c}</span>`).join('') + '</span>'; }
async function demoRun(id) {
  while (id === demoId) {
    loadLevel(demoLv++ % LEVELS.length); won = true;   // won=true：示範時不計時、不能操作
    if (!await wait(900, id)) return;
    const order = target.map((s, k) => k).sort((a, b) => 'LMQSP'.indexOf(target[a].t) - 'LMQSP'.indexOf(target[b].t));
    const used = new Set();
    for (const k of order) {
      const s = target[k], p = pieces.find(q => !used.has(q) && q.type === s.t); used.add(p);
      const o = orientFor(s.t, s.pts.map(v => [v[0]/U, v[1]/U]));
      pieces.splice(pieces.indexOf(p), 1); pieces.push(p);
      const x0 = p.x, y0 = p.y, x1 = o.c[0]*U, y1 = o.c[1]*U, fl = p.flip !== o.f;
      let ra0 = ((p.rot - o.r) % 8 + 8) % 8; if (ra0 > 4) ra0 -= 8; ra0 *= Math.PI / 4;
      p.rot = o.r; p.flip = o.f;
      if (!await tween(700, k => { const e = ease(k); p.x = x0 + (x1 - x0) * e; p.y = y0 + (y1 - y0) * e;
        p.oy = -46 * Math.sin(Math.PI * k); p.ox = 0; p.ra = fl ? 0 : ra0 * (1 - e); p.wsx = fl ? (2*e - 1 || .01) : 1;
        p.lift = Math.sin(Math.PI * k); p.sc = 1 + .08 * Math.sin(Math.PI * k);
        if (GPU.on && k < .95) GPU.trail(p.x, p.y + p.oy, p.color); }, id)) return;
      p.oy = 0; p.ra = 0; p.wsx = 1; p.lift = 0;
      if (GPU.on) GPU.burst(verts(p), p.color);
      if (!await tween(260, k => { p.sc = 1 + .1 * Math.sin(Math.PI * k) * (1 - k); }, id)) return;
      p.sc = 1;
      if (!await wait(120, id)) return;
    }
    if (GPU.on) GPU.win(pieces.map(p => ({ v:verts(p), color:p.color })), BX, BY);
    $('tgCap').innerHTML = `<span class="pill">✨ 完成「${LEVELS[cur].name}」！ ★★★</span>`;
    if (!await tween(1400, k => { VIS.glow = Math.sin(Math.PI * k); pieces.forEach((p, i) => { const q = Math.max(0, Math.min(1, k * 2 - i * .1)); p.sc = 1 + .12 * Math.sin(Math.PI * q); }); }, id)) return;
    VIS.glow = 0; pieces.forEach(p => p.sc = 1);
    if (!await wait(1300, id)) return;
    cap();
  }
}
function showPromo() {
  $('menu').classList.remove('show'); $('win').classList.remove('show');
  document.body.classList.add('promo'); demo = true; demoId++; sel = null; drag = null;
  capI = 0; cap(); clearInterval(capT); capT = setInterval(() => { if (demo) cap(); }, 5200);
  demoRun(demoId);
}
function leavePromo() {
  demo = false; demoId++; clearInterval(capT); VIS.glow = 0;
  document.body.classList.remove('promo');
}
function firstUnsolved() { for (let i = 0; i < LEVELS.length; i++) if (!save[i]) return i; return 0; }
$('tgStart').onclick = () => { Snd.play('ui'); leavePromo(); loadLevel(firstUnsolved()); };
$('tgMenu').onclick = () => { Snd.play('ui'); leavePromo(); loadLevel(firstUnsolved()); openMenu(); };
$('bHome').onclick = () => { Snd.play('ui'); showPromo(); };
$('tgStart').textContent = Object.keys(save).some(k => /^\d+$/.test(k)) ? '▶ 繼續挑戰' : '▶ 開始遊戲';

LY = pickLayout(); W = LY.W; H = LY.H; BX = LY.BX; BY = LY.BY; mask.width = W; mask.height = H;
loadLevel(0); resize(); showPromo();
</script>
</body>
</html>
