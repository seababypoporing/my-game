<!DOCTYPE html>
<html lang="zh-Hant">
<head>

<title>小朋友下樓梯</title>
<style>

*{box-sizing:border-box}
html,body{height:100%;margin:0;background:radial-gradient(circle at 50% 40%,#141a38,#05070f 75%);overflow:hidden;font-family:var(--font);touch-action:none;user-select:none;-webkit-user-select:none;color:var(--ink);-webkit-tap-highlight-color:transparent}

canvas{display:block}
.ui{position:absolute;inset:0}
.hide{display:none!important}
/* 首頁：標題在上、按鈕在下，中間留給背景的自動示範影片 */
#title{display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:calc(var(--s)*58px) calc(var(--s)*20px) calc(var(--s)*34px);background:linear-gradient(to bottom,rgba(6,8,22,.82) 0%,rgba(6,8,22,.25) 30%,rgba(6,8,22,0) 45%,rgba(6,8,22,0) 62%,rgba(6,8,22,.88) 100%)}
.logo{text-align:center}
.logo h1{margin:0;font-size:calc(var(--s)*50px);line-height:1.1;font-weight:900;letter-spacing:.02em;white-space:nowrap}
.logo h1 span{display:inline-block;color:var(--gold);text-shadow:0 calc(var(--s)*4px) 0 #c0560f,0 0 calc(var(--s)*3px) var(--outline),calc(var(--s)*2.5px) 0 0 var(--outline),calc(var(--s)*-2.5px) 0 0 var(--outline),0 calc(var(--s)*2.5px) 0 var(--outline),0 calc(var(--s)*-2.5px) 0 var(--outline),0 calc(var(--s)*8px) calc(var(--s)*14px) rgba(0,0,0,.6);animation:hop 2.4s ease-in-out infinite}
@keyframes hop{0%,70%,100%{transform:translateY(0) scale(1)}78%{transform:translateY(calc(var(--s)*-12px)) scale(1.08,.94)}86%{transform:translateY(0) scale(1.1,.88)}92%{transform:translateY(calc(var(--s)*-3px)) scale(.97,1.04)}}
.logo .tag{margin-top:calc(var(--s)*10px);display:inline-block;font-size:calc(var(--s)*14px);color:#fff;background:rgba(255,255,255,.1);border:1px solid var(--line);border-radius:999px;padding:calc(var(--s)*4px) calc(var(--s)*14px);backdrop-filter:blur(4px)}
.btns{display:flex;flex-direction:column;align-items:center;gap:calc(var(--s)*12px);width:100%}
.best{font-size:calc(var(--s)*14px);color:var(--sub)}
.best b{color:var(--gold)}
.btn{font:inherit;font-weight:800;cursor:pointer;border-radius:999px;border:calc(var(--s)*2.5px) solid var(--outline);color:#fff;padding:calc(var(--s)*12px) calc(var(--s)*34px);font-size:calc(var(--s)*20px);background:linear-gradient(#ffb13b,#ff6b3d);box-shadow:0 calc(var(--s)*5px) 0 #a33b16,0 calc(var(--s)*10px) calc(var(--s)*20px) rgba(0,0,0,.45);text-shadow:0 2px 0 rgba(0,0,0,.35);transition:transform .08s}
.btn:active{transform:translateY(calc(var(--s)*4px));box-shadow:0 calc(var(--s)*1px) 0 #a33b16}
.btn.big{font-size:calc(var(--s)*24px);padding:calc(var(--s)*13px) calc(var(--s)*48px);animation:pulse 1.6s ease-in-out infinite}

.btn.sec{font-size:calc(var(--s)*15px);padding:calc(var(--s)*8px) calc(var(--s)*22px);background:linear-gradient(#5b6aa8,#36407a);box-shadow:0 calc(var(--s)*4px) 0 #1d2350,0 calc(var(--s)*8px) calc(var(--s)*16px) rgba(0,0,0,.4)}
.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
.row{display:flex;gap:calc(var(--s)*10px);justify-content:center;flex-wrap:wrap}
/* 彈窗 */
.modal{z-index:7;display:flex;align-items:center;justify-content:center;padding:calc(var(--s)*16px);background:rgba(4,6,16,.6)}
.card{background:var(--glass);border:1px solid var(--line);border-radius:calc(var(--s)*18px);padding:calc(var(--s)*20px) calc(var(--s)*22px);width:100%;max-height:100%;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.55);backdrop-filter:blur(8px);animation:popin .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes popin{from{transform:scale(.7);opacity:0}}
.card h2{margin:0 0 calc(var(--s)*8px);font-size:calc(var(--s)*26px);color:var(--gold);text-shadow:0 3px 0 #a33b16;text-align:center}
.card p{font-size:calc(var(--s)*14px);line-height:1.65;color:var(--sub);margin:calc(var(--s)*6px) 0}
.card b{color:#fff}
.card ul{list-style:none;padding:0;margin:calc(var(--s)*8px) 0}
.card li{display:flex;align-items:center;gap:calc(var(--s)*10px);font-size:calc(var(--s)*13.5px);line-height:1.45;color:var(--sub);margin:calc(var(--s)*5px) 0}

.card .row{margin-top:calc(var(--s)*12px)}

.stat div{background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:calc(var(--s)*12px);padding:calc(var(--s)*8px) calc(var(--s)*14px);text-align:center;font-size:calc(var(--s)*12px);color:var(--sub)}
.stat b{display:block;font-size:calc(var(--s)*26px);color:var(--gold)}

/* 遊戲中按鈕 */
.ic{position:absolute;border-radius:999px;border:1px solid var(--line);background:rgba(10,14,32,.62);color:#fff;font:inherit;cursor:pointer;backdrop-filter:blur(4px)}
#mute{left:calc(var(--s)*10px);bottom:calc(var(--s)*10px);width:calc(var(--s)*40px);height:calc(var(--s)*40px);font-size:calc(var(--s)*18px);z-index:6}
#slowBtn{display:none;left:50%;transform:translateX(-50%);bottom:calc(var(--s)*14px);padding:calc(var(--s)*10px) calc(var(--s)*22px);font-size:calc(var(--s)*16px);font-weight:800;z-index:5}
@media (pointer:coarse){body.playing #slowBtn{display:block}}
.ic:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" aria-label="小朋友下樓梯遊戲畫面"></canvas>
  <button class="ic" id="mute" aria-label="開關聲音" title="聲音（M）">🔊</button>
  <button class="ic" id="slowBtn">減速</button>

  <div class="ui" id="title">
    <div class="logo">
      <h1 id="logoTxt">小朋友下樓梯</h1>
      <div class="tag">v0.7 ・ 🔥 火焰地板 ・ 💧 水地板會滅火</div>
    </div>
    <div class="btns">
      <div class="best" id="bestTxt"></div>
      <button class="btn big" id="go">開始遊戲</button>
      <button class="btn sec" id="helpBtn">❓ 玩法說明</button>
    </div>
  </div>

  <div class="ui modal hide" id="help"><div class="card">
    <h2>玩法說明</h2>
    <p>一路往下走，別被天花板的尖刺碰到，也別掉出畫面下方。<b>越往下捲動越快</b>，超過 100 層尖刺樓梯會明顯變多。</p>
    <ul id="legend"></ul>
    <p>天花板扣 30 點血。電腦用 ← → 或 A D 移動；手機按住畫面左半邊或右半邊。</p>
    <p><b>減速技能</b>：空白鍵（手機按「減速」），5 秒內樓梯變慢；用完要再往下 50 層才能再用。M 鍵或左下角喇叭可開關聲音。</p>
    <div class="row"><button class="btn sec" id="helpClose">知道了</button></div>
  </div></div>

  <div class="ui modal hide" id="over"><div class="card" id="overCard"></div></div>
</div>
<script>
'use strict';
const $ = id => document.getElementById(id), cv = $('c'), ctx = cv.getContext('2d');
const W = 400, H = 600, CEIL = 24, FL = 75;
const rnd = (a, b) => a + Math.random() * (b - a), clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const FONT = '"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif';
let S = 1;
function fit() {
  S = Math.min(innerWidth / W, innerHeight / H);
  const d = Math.min(devicePixelRatio || 1, 2), w = $('wrap');
  w.style.width = W * S + 'px'; w.style.height = H * S + 'px'; w.style.setProperty('--s', S);
  cv.style.width = W * S + 'px'; cv.style.height = H * S + 'px'; cv.width = Math.round(W * S * d); cv.height = Math.round(H * S * d);
}
addEventListener('resize', fit); fit();
// 標題逐字彈跳
$('logoTxt').innerHTML = [...'小朋友下樓梯'].map((c, i) => `<span style="animation-delay:${i * .09}s">${c}</span>`).join('');

// ---------- 狀態 ----------
let state = 'title', pl = [], p, hp = 100, hpShow = 100, dist = 0, floors = 0, ft = [], parts = [], best = 0, tm = 0, overAt = 0;
let hurtFx = 0, whiteFx = 0, shake = 0, hitStop = 0, flash = null, slowT = 0, slowReadyAt = 0, lastLb = '', seen = {};
const ai = {t: null};
try { best = +localStorage.getItem('stairsBest') || 0; } catch (e) {}
let kL = 0, kR = 0, tD = 0;
const demo = () => state === 'title';
const dir = () => demo() ? aiDir() : (tD || (kR - kL));
const ZONES = [{at: 0, n: '泥土隧道'}, {at: 50, n: '水晶洞窟'}, {at: 100, n: '熔岩深淵'}];

// ======================================================================
// 音樂與音效：Web Audio 即時合成。曲風「拉丁騷莎」——鋼琴 montuno、tumbao 貝斯、
// 康加鼓、響棒（clave）、刮瓜（güiro）、銅管與天巴鼓；音效用鋼鼓、康加、刮瓜等拉丁音色
// ======================================================================
let ac = null, master, mBus, mLP, sBus, NZ, slideG, burnG, muted = false;
function audio() {
  if (!ac) {
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
    master = ac.createGain(); master.gain.value = muted ? 0 : .9; master.connect(ac.destination);
    mLP = ac.createBiquadFilter(); mLP.type = 'lowpass'; mLP.frequency.value = 16000; mLP.connect(master);
    mBus = ac.createGain(); mBus.gain.value = .55; mBus.connect(mLP);
    sBus = ac.createGain(); sBus.gain.value = 1; sBus.connect(master);
    NZ = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const a = NZ.getChannelData(0); for (let i = 0; i < a.length; i++) a[i] = Math.random() * 2 - 1;
    // 在水裡走路的「嘩啦」涉水聲（持續迴圈，用音量控制）
    const sl = ac.createBufferSource(); sl.buffer = NZ; sl.loop = true;
    const hp1 = ac.createBiquadFilter(); hp1.type = 'lowpass'; hp1.frequency.value = 1000; hp1.Q.value = 1.2;
    slideG = ac.createGain(); slideG.gain.value = 0; sl.connect(hp1); hp1.connect(slideG); slideG.connect(sBus); sl.start();
    // 燃燒時的劈啪聲
    const cb = ac.createBuffer(1, ac.sampleRate * 1.5, ac.sampleRate), ca = cb.getChannelData(0);
    for (let i = 0; i < ca.length; i++) if (Math.random() < .0016) { const L = 40 + Math.random() * 120, s = Math.random() < .5 ? -1 : 1; for (let k = 0; k < L && i + k < ca.length; k++) ca[i + k] += s * (Math.random() * .6 + .4) * Math.exp(-k / 18); }
    const cs = ac.createBufferSource(); cs.buffer = cb; cs.loop = true;
    const chp = ac.createBiquadFilter(); chp.type = 'highpass'; chp.frequency.value = 700;
    burnG = ac.createGain(); burnG.gain.value = 0; cs.connect(chp); chp.connect(burnG); burnG.connect(sBus); cs.start();
    setInterval(sched, 25);
  }
  if (ac.state === 'suspended') ac.resume();
  if (!mus.mode) setMusic(state === 'play' ? 'play' : state === 'title' ? 'title' : null);
}
const N = m => 440 * Math.pow(2, (m - 69) / 12);
function env(g, t, v, a, d) { g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); }
function osc(type, f, t, d, v, dest, f2, a = .004) {
  const o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  env(g, t, v, a, d); o.connect(g); g.connect(dest); o.start(t); o.stop(t + a + d + .05); return o;
}
function nz(t, d, v, dest, ft = 'bandpass', f = 2000, q = 1, f2 = 0) {
  const s = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = NZ; fl.type = ft; fl.frequency.setValueAtTime(f, t); fl.Q.value = q; if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t + d);
  env(g, t, v, .003, d); s.connect(fl); fl.connect(g); g.connect(dest); s.start(t, Math.random() * .5); s.stop(t + d + .05);
}
// --- 樂器 ---
function piano(m, t, v, dest = mBus) { osc('triangle', N(m), t, .42, v, dest); osc('sine', N(m) * 2, t, .25, v * .35, dest); }
function bass(m, t, d) { osc('sine', N(m), t, d, .2, mBus, 0, .01); osc('triangle', N(m), t, d * .6, .07, mBus, 0, .01); }
function conga(k, t, dest = mBus, vm = 1) {
  if (k === 'm') osc('sine', 310, t, .05, .035 * vm, dest);
  else if (k === 's') { nz(t, .05, .14 * vm, dest, 'bandpass', 1600, 1.2); osc('sine', 380, t, .06, .08 * vm, dest); }
  else if (k === 'o') osc('sine', 340, t, .26, .13 * vm, dest, 300);
  else osc('sine', 235, t, .32, .14 * vm, dest, 212);
}
function clave(t, dest = mBus, v = .08) { osc('sine', 2480, t, .055, v, dest); osc('sine', 3720, t, .03, v * .25, dest); }
function guiro(t, d, v = .05, dest = mBus) {
  const s = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = NZ; fl.type = 'bandpass'; fl.frequency.value = 3400; fl.Q.value = 1.6;
  const gr = .021, n = Math.max(2, Math.floor(d / gr));
  g.gain.setValueAtTime(0, t);
  for (let k = 0; k < n; k++) { g.gain.setValueAtTime(v * (0.6 + .4 * k / n), t + k * gr); g.gain.setValueAtTime(v * .12, t + k * gr + gr * .55); }
  g.gain.setValueAtTime(0, t + n * gr);
  s.connect(fl); fl.connect(g); g.connect(dest); s.start(t, Math.random() * .5); s.stop(t + n * gr + .05);
}
function brass(m, t, d, v = .045, dest = mBus) {
  const fl = ac.createBiquadFilter(), g = ac.createGain(); fl.type = 'lowpass'; fl.Q.value = 2;
  fl.frequency.setValueAtTime(700, t); fl.frequency.linearRampToValueAtTime(2600, t + .04); fl.frequency.exponentialRampToValueAtTime(1300, t + d);
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + .03); g.gain.setValueAtTime(v * .8, t + d * .8); g.gain.exponentialRampToValueAtTime(0.0001, t + d + .08);
  [-6, 6].forEach(dt => { const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = N(m); o.detune.value = dt; o.connect(fl); o.start(t); o.stop(t + d + .12); });
  fl.connect(g); g.connect(dest);
}
function timbale(t, f, dest = mBus, v = .1) { osc('sine', f, t, .16, v, dest, f * .82); nz(t, .07, v * .7, dest, 'bandpass', 4200, 2); }
function pan(m, t, v = .09, dest = sBus, d = .6) {   // 鋼鼓
  const f = N(m); osc('sine', f * 1.015, t, d, v, dest, f, .003); osc('sine', f * 2, t, d * .55, v * .45, dest); osc('sine', f * 2.97, t, d * .3, v * .2, dest);
}
// --- 樂曲 ---
const CH = {Gm: {r: 43, t: [55, 58, 62]}, Cm: {r: 36, t: [55, 60, 63]}, F: {r: 41, t: [53, 57, 60]}, Bb: {r: 46, t: [53, 58, 62]}, Eb: {r: 39, t: [55, 58, 63]}, D7: {r: 38, t: [54, 57, 60]}};
const SONG = {
  title: {bpm: 90, ch: ['Gm', 'Cm', 'D7', 'Gm', 'Eb', 'Cm', 'D7', 'D7']},
  play: {bpm: 104, ch: ['Gm', 'Cm', 'F', 'Bb', 'Eb', 'Cm', 'D7', 'D7']}
};
const MEL = [[0,0,74,3],[0,4,72,2],[0,6,70,2],[0,10,67,5],[1,2,72,2],[1,4,70,2],[1,6,67,4],[1,12,63,3],[2,0,72,2],[2,3,69,2],[2,6,65,4],[2,12,69,3],
  [3,0,70,6],[3,8,74,6],[4,0,75,3],[4,4,74,2],[4,6,70,2],[4,10,67,4],[5,2,72,2],[5,4,75,2],[5,6,74,4],[5,12,72,3],[6,0,74,2],[6,3,72,2],[6,6,69,2],[6,8,66,4],[6,12,69,3],[7,0,74,8],[7,10,62,4]];
const MON = [[0, 'c'], [3, 0], [4, 'c'], [6, 1], [8, 'c'], [10, 2], [11, 'c'], [14, 0]];
const mus = {mode: null, step: 0, next: 0};
function setMusic(m) { mus.mode = m; mus.step = 0; if (ac) mus.next = ac.currentTime + .06; }
function curBpm() {
  if (mus.mode === 'title') return SONG.title.bpm;
  return (SONG.play.bpm + Math.min(36, Math.floor(floors / 8) * 2.5)) * (slowT > 0 ? .78 : 1);
}
function sched() {
  if (!ac || !mus.mode) return;
  if (mus.next < ac.currentTime - .25) mus.next = ac.currentTime + .03;
  while (mus.next < ac.currentTime + .12) { playStep(mus.step, mus.next); mus.next += 60 / curBpm() / 4; mus.step++; }
}
function playStep(n, t) {
  const sg = SONG[mus.mode], s = n % 16, bar = Math.floor(n / 16), b8 = bar % 8, loop = Math.floor(bar / 8);
  const c = CH[sg.ch[b8]], nx = CH[sg.ch[(b8 + 1) % 8]], st = 60 / curBpm() / 4;
  if (mus.mode === 'title') {     // 首頁：慢一點的波麗露風騷莎
    [[0, 'c'], [6, 1], [8, 'c'], [12, 2]].forEach(([k, w]) => { if (k === s) (w === 'c' ? c.t : [c.t[w]]).forEach(m => piano(m + 12, t, w === 'c' ? .045 : .06)); });
    if (s === 0) bass(c.r, t, st * 6); if (s === 8) bass(c.r + 7, t, st * 4);
    if (s === 4) conga('s', t, mBus, .7); if (s === 12) conga('o', t, mBus, .8); if (s === 14) conga('t', t, mBus, .8);
    if ((bar % 2 === 0 && (s === 4 || s === 8)) || (bar % 2 === 1 && (s === 0 || s === 6 || s === 12))) clave(t, mBus, .06);
    if (loop % 2 === 1) MEL.forEach(([b, k, m, L]) => { if (b === b8 && k === s) piano(m + 12, t, .05); });
    return;
  }
  // 遊戲中：完整騷莎
  MON.forEach(([k, w]) => { if (k === s) { if (w === 'c') c.t.forEach(m => piano(m + 12, t, .042)); else { piano(c.t[w] + 12, t, .055); piano(c.t[w] + 24, t, .03); } } });
  if (s === 6) bass(c.r + 7, t, st * 5.5);
  if (s === 12) bass(nx.r, t, st * 9);
  ({0: 'm', 2: 'm', 4: 's', 6: 'm', 8: 'm', 10: 'm', 12: 'o', 14: 't'})[s] && conga({0: 'm', 2: 'm', 4: 's', 6: 'm', 8: 'm', 10: 'm', 12: 'o', 14: 't'}[s], t);
  if ((bar % 2 === 0 && (s === 4 || s === 8)) || (bar % 2 === 1 && (s === 0 || s === 6 || s === 12))) clave(t);
  if (s === 0 || s === 8) guiro(t, st * 1.6); if (s === 6 || s === 14) guiro(t, .045, .04);
  if (loop % 2 === 1) MEL.forEach(([b, k, m, L]) => { if (b === b8 && k === s) brass(m, t, st * L * .92); });
  if (b8 === 7 && s >= 12) timbale(t, s % 2 ? 620 : 760);
}
// --- 音效 ---
const SFX = {
  land: t => { osc('sine', 205, t, .12, .17, sBus, 118); nz(t, .012, .05, sBus, 'bandpass', 3200, 2); },
  heal: t => [67, 71, 74, 79].forEach((m, i) => pan(m, t + i * .075, .085)),

// ---------- 更新 ----------
function update(dt) {

  slowT = Math.max(0, slowT - dt);
  pl.forEach(q => { q.py = q.y; q.y -= spd * dt; if (q.sp !== undefined) q.sp += dt; });
  dist += spd * dt;
  const nf = Math.floor(dist / FL);
  if (demo() && nf > 72) { whiteFx = .45; reset(true); return; }
  if (nf > floors) {
    floors = nf;
    if (!demo()) {
      if (slowReadyAt && floors === slowReadyAt) { sfx('ready'); pop('減速已充飽！', '#ffd23f'); }
      const z = ZONES.find(z => z.at === floors && z.at > 0);
      if (z) { bigText(z.n, z.at >= 100 ? '#ff8a5c' : '#c9a7ff', 2.2); sfx('zone'); if (floors === 100) pop('刺針變多了！', '#ff5a4f', 1); }

    }
  }

  const inWater = p.stand && p.stand.ty === 'water';

  else { const tg = d * 170, acc = d ? 1300 : 420; p.vx += clamp(tg - p.vx, -acc * dt, acc * dt); }
  p.x += p.vx * dt;
  if (p.x < 0) { p.x = 0; p.vx = 0; } if (p.x > W - p.w) { p.x = W - p.w; p.vx = 0; }

  if (p.stand) {
    const q = p.stand;

    else {

      if (q.ty === 'conv') p.x = clamp(p.x + q.dir * 70 * dt, 0, W - p.w);
      if (q.ty === 'fire') p.burn = 5;          // 站在火上一直燒，離開後再燒 5 秒
      if (q.ty === 'water' && Math.abs(p.vx) > 10) { if (Math.random() < .35) part({x: p.x + p.w / 2 + rnd(-8, 8), y: q.y - 2, vx: -p.vx * .6 + rnd(-25, 25), vy: rnd(-90, -40), g: 500, t: .4, s: rnd(1.5, 2.5), c: '#bfeeff', k: 'circle', front: 1}); if (Math.random() < .08) part({x: p.x + p.w / 2, y: q.y - 1, on: q, oy: -1, t: .7, s: 10, c: '#d8f6ff', k: 'ring'}); }

          for (let i = 0; i < 12; i++) part({x: q.x + rnd(0, q.w), y: q.y + rnd(0, 10), vx: rnd(-60, 60), vy: rnd(-60, 40), g: 900, t: .8, s: rnd(3, 6), c: i % 2 ? '#c99762' : '#8d5f34', k: 'sq', rot: rnd(0, 6)}); }
      }
    }
  }
  if (!p.stand) {

    const nb = p.y + p.h;

  }

    if (p.burnAcc >= 3) { p.burnAcc -= 3; pop('-3', '#ff9a3c'); hurtFx = Math.max(hurtFx, .12); }
    if (Math.random() < .7) part({x: p.x + rnd(3, p.w - 3), y: p.y + rnd(4, 26), vx: rnd(-15, 15), vy: rnd(-90, -50), t: rnd(.3, .55), s: rnd(3, 6), c: '#ff9a3c', k: 'flame', front: 1});
    if (Math.random() < .15) part({x: p.x + p.w / 2, y: p.y, vx: rnd(-10, 10), vy: -40, t: .9, s: 4, c: 'rgba(90,80,90,.5)', k: 'smoke', front: 1});

  // 拖尾

    if (q.ty === 'water' && Math.random() < q.w / 2500) part({x: q.x + rnd(8, q.w - 8), y: q.y + 2, on: q, oy: 2, vy: -14, t: .7, s: rnd(1.2, 2.2), c: 'rgba(220,248,255,.8)', k: 'bubble'});

function updateFx(dt) {

  ctx.save(); ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 6.5); ctx.clip();
  ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.fillRect(bx, by, bw * hpShow / 100, bh);
  const col = burning ? ['#ffc15a', '#ff6a2a'] : hp > 50 ? ['#7ff5b0', '#27a065'] : hp > 25 ? ['#ffe680', '#e2a100'] : ['#ff8a7a', '#d8322a'];
  const hg = ctx.createLinearGradient(0, by, 0, by + bh); hg.addColorStop(0, col[0]); hg.addColorStop(1, col[1]);
  ctx.fillStyle = hg; ctx.fillRect(bx, by, bw * Math.max(0, hp) / 100, bh);
  ctx.fillStyle = 'rgba(255,255,255,.4)'; ctx.fillRect(bx, by + 2, bw, 2.5);
  ctx.restore();
  ctx.strokeStyle = 'rgba(20,24,52,.9)'; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 6.5); ctx.stroke();
  ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff'; ctx.font = `bold 13px ${FONT}`; ctx.fillText(Math.ceil(Math.max(0, hp)), 168, 49);
  if (burning) { flameIcon(22, 72, 6 + Math.sin(tm * 14)); ctx.fillStyle = '#ffb347'; ctx.font = `bold 12px ${FONT}`; ctx.fillText(p.stand && p.stand.ty === 'fire' ? '灼燒中（站在火上）' : `灼燒 ${p.burn.toFixed(1)} 秒`, 36, 72); }
  // 右側
  panel(W - 142, 32, 134, 74);
  ctx.textAlign = 'right'; ctx.fillStyle = '#fff'; ctx.font = `900 20px ${FONT}`; ctx.fillText(`地下 ${floors} 層`, W - 16, 50);
  ctx.font = `12px ${FONT}`; ctx.fillStyle = '#bcc5ea'; ctx.fillText(`速度 第 ${1 + Math.floor(floors / 8)} 級`, W - 16, 70);
  const rdy = slowT <= 0 && floors >= slowReadyAt;
  ctx.fillStyle = slowT > 0 ? '#7cc4ff' : rdy ? '#ffd23f' : 'rgba(255,255,255,.65)'; ctx.font = `bold 12px ${FONT}`;
  ctx.fillText(slowT > 0 ? `減速中 ${slowT.toFixed(1)} 秒` : rdy ? '空白鍵：減速' : `減速 還要 ${slowReadyAt - floors} 層`, W - 16, 90);
  const pr = slowT > 0 ? slowT / 5 : rdy ? 1 : 1 - (slowReadyAt - floors) / 50;
  ctx.strokeStyle = 'rgba(255,255,255,.15)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(W - 128, 90, 6, 0, 7); ctx.stroke();
  ctx.strokeStyle = slowT > 0 ? '#7cc4ff' : '#ffd23f'; ctx.beginPath(); ctx.arc(W - 128, 90, 6, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * clamp(pr, 0, 1)); ctx.stroke();
  ctx.textAlign = 'left';
  const lb = slowT > 0 ? '減速中' : rdy ? '減速' : `減速 ${slowReadyAt - floors}`;
  if (lb !== lastLb) { lastLb = lb; $('slowBtn').textContent = lb; }
}
const easeBack = t => { const c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
function drawFlash() {
  if (!flash) return;
  const age = flash.d - flash.t, out = clamp(flash.t / .35, 0, 1), cy = 205, chars = [...flash.s];
  ctx.save(); ctx.font = `900 36px ${FONT}`; ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
  // 放射光
  ctx.globalAlpha = .22 * out * clamp(age / .2, 0, 1); ctx.translate(W / 2, cy); ctx.rotate(tm * .6);
  const rg = ctx.createRadialGradient(0, 0, 0, 0, 0, 150); rg.addColorStop(0, flash.c); rg.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = rg;
  for (let i = 0; i < 12; i++) { ctx.rotate(Math.PI / 6); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(150, -14); ctx.lineTo(150, 14); ctx.fill(); }
  ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
  // 光帶
  ctx.globalAlpha = .55 * out; const bandW = 320 * clamp(age / .25, 0, 1);
  const bg = ctx.createLinearGradient(W / 2 - bandW / 2, 0, W / 2 + bandW / 2, 0); bg.addColorStop(0, 'rgba(10,14,34,0)'); bg.addColorStop(.5, 'rgba(10,14,34,.85)'); bg.addColorStop(1, 'rgba(10,14,34,0)');
  ctx.fillStyle = bg; ctx.fillRect(W / 2 - bandW / 2, cy - 30, bandW, 60);
  // 逐字彈跳
  const ws = chars.map(c => ctx.measureText(c).width), tot = ws.reduce((a, b) => a + b, 0); let x = W / 2 - tot / 2;
  chars.forEach((c, i) => {
    const a = age - i * .045, cxp = x + ws[i] / 2; x += ws[i]; if (a <= 0) return;
    const sc = a < .22 ? easeBack(a / .22) : 1, yy = cy - (a < .22 ? (1 - a / .22) * 26 : 0) + Math.sin(tm * 6 + i) * 1.5;
    ctx.save(); ctx.globalAlpha = out; ctx.translate(cxp, yy); ctx.scale(sc, sc);
    ctx.lineWidth = 7; ctx.strokeStyle = '#1a1f3d'; ctx.lineJoin = 'round'; ctx.strokeText(c, 0, 0);
    const fg = ctx.createLinearGradient(0, -18, 0, 18); fg.addColorStop(0, '#fff'); fg.addColorStop(.45, flash.c); fg.addColorStop(1, flash.c);
    ctx.fillStyle = fg; ctx.fillText(c, 0, 0); ctx.restore();
  });
  ctx.restore();
}
function draw() {
  ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
  ctx.save(); if (shake > 0) ctx.translate(rnd(-1, 1) * shake * 14, rnd(-1, 1) * shake * 14);
  drawBg();
  pl.forEach(q => drawPl(q));
  drawParts(false);
  p.trail.forEach(r => drawKid({x: r.x, y: r.y, w: p.w, h: p.h, face: p.face, vx: 0, vy: 0, inv: 0, burn: 0}, r.t * 2.2, true));
  if (state !== 'over' || hp > 0 || p.y < H) drawKid();
  drawParts(true);
  drawCeil();
  ft.forEach(f => {
    const a = Math.min(1, f.t * 2.2), sc = f.t > .85 ? easeBack((1 - f.t) / .15) : 1;
    ctx.save(); ctx.globalAlpha = a; ctx.translate(f.x, f.y); ctx.scale(sc, sc);
    ctx.font = `900 ${f.big ? 22 : 17}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 4.5; ctx.strokeStyle = '#1a1f3d'; ctx.lineJoin = 'round'; ctx.strokeText(f.s, 0, 0); ctx.fillStyle = f.c; ctx.fillText(f.s, 0, 0); ctx.restore();
  });
  ctx.restore();
  if (slowT > 0 && state === 'play') { ctx.fillStyle = 'rgba(80,160,255,.13)'; ctx.fillRect(0, 0, W, H); }
  if (p.burn > 0) { const vg = ctx.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, H * .75); vg.addColorStop(0, 'rgba(255,100,20,0)'); vg.addColorStop(1, `rgba(255,100,20,${.22 + .08 * Math.sin(tm * 10)})`); ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H); }
  if (hurtFx > 0) { ctx.fillStyle = `rgba(255,50,50,${hurtFx * 1.3})`; ctx.fillRect(0, 0, W, H); }
  if (whiteFx > 0) { ctx.fillStyle = `rgba(255,255,255,${whiteFx * 1.2})`; ctx.fillRect(0, 0, W, H); }
  // 暗角
  const vg = ctx.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * .8); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.45)'); ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  if (state !== 'title') drawHud();
  drawFlash();
}

// ---------- 說明圖示（用遊戲裡同一支繪圖程式畫，風格一致） ----------
(function legend() {
  const items = [['normal', '一般樓梯：第一次踩上去補 2 點血'], ['heal', '粉紅樓梯：補 25 點血，每塊只能用一次'], ['spike', '尖刺樓梯：扣 20 點血'],
    ['spring', '彈簧：把你彈高，每彈一次補 2 點血'], ['conv', '輸送帶：推著你走'], ['fake', '易碎樓梯：站太久會碎掉'],
    ['fire', '<b>火焰地板</b>：站在上面一直扣血，離開後還會再燒 5 秒（每秒扣 3 點）'], ['water', '<b>水地板</b>：在水裡走路速度變慢；身上著火時踩上去可以<b>滅火</b>']];
  const c = document.createElement('canvas'), g = c.getContext('2d'); c.width = 124; c.height = 52;
  $('legend').innerHTML = items.map(([ty, txt]) => {
    g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, c.width, c.height); g.setTransform(2, 0, 0, 2, 0, 0);
    drawPl({x: 4, y: 11, w: 52, ty, dir: 1, t: 0, seed: 3}, g, 1.3);
    return `<li><img alt="" src="${c.toDataURL()}"><span>${txt}</span></li>`;
  }).join('');
})();

// ---------- 輸入 ----------
addEventListener('keydown', e => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') { kL = 1; e.preventDefault(); }
  if (k === 'ArrowRight' || k === 'd' || k === 'D') { kR = 1; e.preventDefault(); }
  audio();
  if (k === 'm' || k === 'M') setMute(!muted);
  if (k === ' ' && state === 'play') { e.preventDefault(); if (!e.repeat) useSlow(); }
  if (k === 'Escape') $('help').classList.add('hide');
  if ((k === 'Enter' || k === ' ') && state !== 'play' && $('help').classList.contains('hide') && performance.now() - overAt > 900) { e.preventDefault(); start(); }
});
addEventListener('keyup', e => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') kL = 0;
  if (k === 'ArrowRight' || k === 'd' || k === 'D') kR = 0;
});
addEventListener('pointerdown', () => audio(), true);
const side = e => { const r = cv.getBoundingClientRect(); return e.clientX - r.left < r.width / 2 ? -1 : 1; };
cv.addEventListener('pointerdown', e => { if (state !== 'play') return; tD = side(e); try { cv.setPointerCapture(e.pointerId); } catch (er) {} });
cv.addEventListener('pointermove', e => { if (tD) tD = side(e); });
['pointerup', 'pointercancel'].forEach(ev => cv.addEventListener(ev, () => tD = 0));
$('go').onclick = () => start();
$('helpBtn').onclick = () => { sfx('click', true); $('help').classList.remove('hide'); };
$('helpClose').onclick = () => { sfx('click', true); $('help').classList.add('hide'); };
$('help').onclick = e => { if (e.target === $('help')) $('help').classList.add('hide'); };

// ---------- 主迴圈 ----------
showTitle();
let last = performance.now();
(function loop(now) {
  const dt = Math.min(.033, (now - last) / 1000); last = now; tm += dt;
  if (state === 'play' || state === 'title') update(dt);
  updateFx(dt); setLoops(); draw(); requestAnimationFrame(loop);
})(last);
</script>
