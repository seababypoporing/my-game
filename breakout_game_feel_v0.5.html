<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>打方塊 · Game Feel</title>
<style>
  :root { --bg:#0a1230; --panel:#0f1b45; --fg:#eef3ff; --muted:#7f92c7; --gold:#ffc542; --blue:#4da6ff; color-scheme: dark; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:var(--bg); color:var(--fg); font-family:-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; overscroll-behavior:none; touch-action:none; }
  #app { position:fixed; top:0; left:0; right:0; bottom:0; display:flex; flex-direction:column; align-items:center; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  .head, .hud, #pw { width:100%; max-width:var(--rowW,560px); }
  .head { padding:6px 14px 0; }
  .k { color:var(--blue); font-size:.72rem; font-weight:800; letter-spacing:.14em; }
  h1 { margin:2px 0 0; font-size:clamp(1.15rem,4.6vw,1.6rem); letter-spacing:.02em; }
  .hud { display:flex; justify-content:space-between; align-items:flex-start; padding:6px 14px 6px; }
  .hud small { display:block; color:var(--muted); font-size:.62rem; letter-spacing:.12em; font-weight:700; }
  .hud b { font-size:1.5rem; font-variant-numeric:tabular-nums; letter-spacing:.02em; }
  .hud .juice { text-align:center; } #jd { display:flex; gap:3px; margin-top:6px; justify-content:center; } #jd i { width:11px; height:3px; border-radius:2px; background:#27386f; } #jd i.on { background:var(--gold); }
  .hud .r { text-align:right; }
  #pw { min-height:26px; display:flex; gap:6px; flex-wrap:wrap; padding:0 14px 4px; }
  .chip { display:inline-flex; align-items:center; gap:5px; font-size:.7rem; font-weight:800; padding:2px 8px; border-radius:999px; background:#14224f; border:1px solid var(--c); color:var(--c); }
  .chip i { font-style:normal; } .chip span { color:#cfd9ff; font-variant-numeric:tabular-nums; }
  #stage { position:relative; flex:none; }
  #cv { display:block; border-top:1px solid #1d2c63; border-bottom:1px solid #1d2c63; touch-action:none; }
  #ov { position:absolute; top:0; left:0; right:0; bottom:0; display:none; align-items:center; justify-content:center; background:rgba(5,9,26,.78); text-align:center; padding:20px; }
  #ov h2 { margin:0 0 6px; font-size:1.8rem; color:var(--gold); } #ov p { color:var(--muted); margin:4px 0 16px; line-height:1.6; }
  #ov button { border:none; background:var(--gold); color:#2b1d00; font-weight:800; font-size:1.05rem; padding:12px 26px; border-radius:12px; cursor:pointer; font-family:inherit; }
  #set, #lvl { position:fixed; inset:0; z-index:10; display:none; flex-direction:column; align-items:center; overflow-y:auto; background:var(--bg); padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 18px); }
  #set.open, #lvl.open { display:flex; }
  #lvgrid { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
  .lv { position:relative; border:2px solid #2b3d7d; background:#141c44; color:var(--fg); border-radius:12px; padding:10px 0 8px; font-family:inherit; font-size:1.15rem; font-weight:800; cursor:pointer; line-height:1.1; }
  .lv small { display:block; font-size:.58rem; font-weight:700; color:var(--muted); margin-top:3px; letter-spacing:.04em; }
  .lv.done { border-color:#3c8f69; background:#11302a; } .lv.done small { color:#5bd69a; }
  .lv.cur { border-color:var(--gold); box-shadow:0 0 0 2px rgba(255,209,102,.35); }
  .lvtier { grid-column:1 / -1; color:var(--muted); font-size:.75rem; font-weight:700; letter-spacing:.12em; margin:6px 0 -2px; }
  .musrow { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:12px; padding:12px 14px; border:2px solid #2b3d7d; border-radius:14px; background:#141c44; cursor:pointer; }
  .musrow b { font-size:1.05rem; } .musrow small { display:block; color:var(--muted); font-size:.72rem; margin-top:2px; }
  .musrow .sw { font-size:.72rem; font-weight:800; padding:3px 9px; border-radius:999px; background:#27386f; color:#9fb0e0; }
  .musrow.on { border-color:#5b7cff; } .musrow.on .sw { background:#5b7cff; color:#fff; }
  #ov .ob { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; } #ov button.sec { background:transparent; color:var(--fg); border:1px solid #5a6aa8; }
  .setin { width:100%; max-width:560px; }
  .sethead { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:4px; }
  .sethead h2 { margin:0; font-size:1.4rem; }
  #setj { color:var(--gold); font-weight:800; font-size:.85rem; letter-spacing:.12em; }
  .setnote { color:var(--muted); font-size:.85rem; margin:4px 0 14px; line-height:1.5; }
  #fxgrid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  .fx { border:2px solid #3a2f12; background:#1a2250; color:#9a8a5a; border-radius:14px; padding:14px 12px; cursor:pointer; font-family:inherit; line-height:1.2; display:flex; align-items:center; justify-content:space-between; gap:8px; text-align:left; }
  .fx b { display:block; font-size:1.1rem; font-weight:800; } .fx small { display:block; font-size:.62rem; letter-spacing:.1em; font-weight:700; opacity:.85; margin-top:3px; }
  .fx .sw { flex:none; font-size:.72rem; font-weight:800; padding:3px 9px; border-radius:999px; background:#27386f; color:#9fb0e0; }
  .fx.on .sw { background:#2b1d00; color:var(--gold); }
  .setbtns { display:flex; gap:8px; flex-wrap:wrap; margin-top:16px; }
  .setbtns button { border:1px solid #2b3d7d; background:transparent; color:var(--fg); border-radius:999px; padding:9px 16px; font-size:.9rem; cursor:pointer; font-family:inherit; }
  .setbtns button.main { background:var(--gold); border-color:var(--gold); color:#2b1d00; font-weight:800; margin-left:auto; }
  .fx.on { background:var(--gold); border-color:var(--gold); color:#2b1d00; }
  .mini { display:flex; gap:8px; padding:8px 10px 6px; }
  .mini button { border:1px solid #2b3d7d; background:transparent; color:var(--muted); border-radius:999px; padding:6px 14px; font-size:.78rem; cursor:pointer; font-family:inherit; }
  button:focus-visible { outline:2px solid var(--blue); outline-offset:2px; }
</style>
</head>
<body>
<div id="app">
  <div class="head"><div class="k">GAME FEEL ・ 5 分鐘的好玩</div><h1>同一款遊戲,只差在手感</h1></div>
  <div class="hud"><div><small>SCORE</small><b id="score">00000</b></div><div class="juice"><small id="jl">JUICE 10/10</small><div id="jd"></div></div><div class="r"><small>COMBO</small><b id="combo">×0</b></div></div>
  <div id="pw"></div>
  <div id="stage"><canvas id="cv"></canvas>
    <div id="ov"><div><h2 id="ovt"></h2><p id="ovp"></p><div class="ob"><button id="ovb">再玩一次</button><button id="ovl" class="sec">選擇關卡</button></div></div></div></div>
  <div class="mini"><button id="openlvl">☰ 選關</button><button id="openset">⚙ 特效設定</button><button id="musbtn">🎵 音樂</button><button id="restart">重新開始</button></div>
</div>
<div id="set" role="dialog" aria-label="特效設定"><div class="setin">
  <div class="sethead"><h2>⚙ 特效設定</h2><span id="setj">JUICE 10/10</span></div>
  <p class="setnote">點一下開關各種手感特效。設定時遊戲會暫停,回到遊戲後就能比較開與關的差別。</p>
  <div id="fxgrid"></div>
  <div class="musrow" id="musrow" role="button" tabindex="0"><span><b>🎵 背景音樂</b><small>復古街機風電子樂,球速升級時節奏會跟著變快</small></span><span class="sw"></span></div>
  <div class="setbtns"><button id="allon">全部開啟</button><button id="alloff">全部關閉</button><button id="closeset" class="main">回到遊戲 ▶</button></div>
</div></div>
<div id="lvl" role="dialog" aria-label="選擇關卡"><div class="setin">
  <div class="sethead"><h2>☰ 選擇關卡</h2><span id="lvsum" style="color:var(--gold);font-weight:800;font-size:.85rem;letter-spacing:.08em"></span></div>
  <p class="setnote">共 50 關,越後面磚塊越硬、球也越快。綠色的是已經過關的關卡,所有關卡都可以直接挑戰。</p>
  <div id="lvgrid"></div>
  <div class="setbtns"><button id="closelvl" class="main">回到遊戲 ▶</button></div>
</div></div>

<script>
const $ = id => document.getElementById(id);
const W = 540, H = 720, COLS = 10, BRICK_H = 20, GAP = 6, MX = 24, TOP = 92, PAD_Y = H - 64, PAD_W = 96, PAD_H = 14, BR = 7;
const FXLIST = [['color', '色彩', 'COLOR'], ['tween', '補間動畫', 'TWEENING'], ['squash', '擠壓伸展', 'SQUASH'], ['flash', '閃白', 'HIT FLASH'], ['sound', '音效', 'SOUND'],
  ['particles', '粒子', 'PARTICLES'], ['hitstop', '打擊停頓', 'HITSTOP'], ['shake', '畫面震動', 'SHAKE'], ['trail', '拖尾', 'TRAIL'], ['popups', '跳字', 'POPUPS']];
const ROWCOL = ['#ff6f61', '#ff9f43', '#ffd166', '#5bd69a', '#4da6ff', '#9b8cff'];
// 磚塊耐久度:1 = 彩虹色(打 1 下)、2 = 銀色(打 2 下)、3 = 酒紅鑲金邊(打 3 下);受傷後會變成低一階的顏色
const LEVELS = [
  ['1111111111', '1111111111', '1111111111', '1111111111', '1111111111', '1111111111'],
  ['2222222222', '1111111111', '1111111111', '1111111111', '1111111111', '1111111111'],
  ['0001111000', '0011221100', '0112222110', '1122332211', '1223333221', '1111111111'],
  ['1212121212', '2121212121', '1212121212', '2121212121', '1212121212', '2121212121'],
  ['3000000003', '2200000022', '1122002211', '1111001111', '1122002211', '2200000022', '3000000003'],
  ['0110000110', '1221001221', '1222112221', '1222222221', '0122222210', '0012222100', '0001221000', '0000110000'],
  ['1010101010', '0101010101', '2020202020', '0202020202', '3030303030', '0303030303', '1111111111'],
  ['2222222222', '2000000002', '2033333302', '2032222302', '2032112302', '2032222302', '2033333302', '2222222222'],
  Array.from({ length: 8 }, (_, r) => Array.from({ length: 10 }, (_, c) => (r + c) % 4 === 0 ? 3 : (r + c) % 3 === 0 ? 2 : 1).join('')),
  ['3333333333', '3333333333', '3333333333', '2222222222', '2222222222', '1111111111', '1111111111', '1111111111']
];
// 第 11~50 關用固定種子自動產生(每次打開都一樣),越後面行數越多、硬磚越多;圖案左右對稱
const LEVEL_COUNT = 50;
function genLevel(n) {
  const r = rng(n * 977 + 31), d = (n - 10) / (LEVEL_COUNT - 11), rows = Math.min(11, 6 + Math.floor(d * 4.5 + r() * 1.5));
  const p3 = .04 + .34 * d, p2 = .14 + .26 * d, hpOf = () => { const x = r(); return x < p3 ? 3 : x < p3 + p2 ? 2 : 1; };
  const kind = n % 8, g = [];
  for (let y = 0; y < rows; y++) { const row = []; for (let x = 0; x < 5; x++) {
    const cx = 4.5 - x, cy = y - (rows - 1) / 2; let on;
    if (kind === 0) on = r() < .62 + .2 * d;                                   // 隨機對稱
    else if (kind === 1) on = Math.abs(cx) / 5 + Math.abs(cy) / (rows / 2) <= 1.08; // 菱形
    else if (kind === 2) on = y % 3 !== 2;                                     // 橫條
    else if (kind === 3) on = (x + y) % 2 === 0 || r() < d * .5;               // 棋盤
    else if (kind === 4) on = 4 - x <= y;                                      // 金字塔
    else if (kind === 5) on = y === 0 || y === rows - 1 || x === 0 || (y % 2 === 0 && x >= 2); // 框框
    else if (kind === 6) on = Math.abs(Math.sin((x + y * .9) * .9)) > .35;     // 波浪
    else on = Math.hypot(cx * 1.1, cy * 1.6) < 4.8 && !(y === Math.floor(rows / 2) && x === 2); // 圓盤
    row.push(on ? hpOf() : 0);
  } g.push(row.concat(row.slice().reverse()).join('')); }
  // 每隔幾關把最上面一排換成硬磚當「屋頂」
  if (n % 5 === 4) g[0] = g[0].replace(/[12]/g, n > 30 ? '3' : '2');
  if (g.join('').replace(/0/g, '').length < 24) g.push('1111111111');
  return g;
}
for (let n = LEVELS.length; n < LEVEL_COUNT; n++) LEVELS.push(genLevel(n));
const ITEMS = { multi: { n: '多球', c: '#4da6ff', w: 3 }, wide: { n: '加長', c: '#5bd69a', w: 3 }, narrow: { n: '縮短', c: '#ff6f61', w: 1.5 }, slow: { n: '減速', c: '#9b8cff', w: 2.5 }, fast: { n: '加速', c: '#ff9f43', w: 1.5 }, life: { n: '+♥', c: '#ff7aa8', w: .6 }, pierce: { n: '穿透', c: '#ffd166', w: 1.4 } };
const ITEMKEYS = Object.keys(ITEMS);
let FX = {}; try { FX = JSON.parse(localStorage.getItem('gamefeel_fx') || '{}'); } catch (e) {}
FXLIST.forEach(([k]) => { if (typeof FX[k] !== 'boolean') FX[k] = true; });
const saveFx = () => { try { localStorage.setItem('gamefeel_fx', JSON.stringify(FX)); } catch (e) {} };
const juice = () => FXLIST.filter(([k]) => FX[k]).length;
function rng(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------- 聲音 ----------
let actx = null;
function ac() { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); return actx; } catch (e) { return null; } }
function tone(f, d, type, v, when, slide, force) {
  if (!FX.sound && !force) return; const c = ac(); if (!c) return;
  try { const t = c.currentTime + (when || 0), o = c.createOscillator(), g = c.createGain(); o.type = type || 'sine'; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + d);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v || .1, t + .008); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + d + .02); } catch (e) {}
}
// 金屬聲:用不成倍數的泛音(像金屬棒/鐘)加上一點敲擊雜音,高頻泛音衰減得比較快
let noiseBuf = null;
function ring(f, d, v, when) {
  if (!FX.sound) return; const c = ac(); if (!c) return;
  try { const t = c.currentTime + (when || 0), o = c.createOscillator(), g = c.createGain(); o.type = 'sine'; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .003); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + d + .02); } catch (e) {}
}
function noise(d, v, when, fc, q) {
  if (!FX.sound) return; const c = ac(); if (!c) return;
  try {
    if (!noiseBuf) { noiseBuf = c.createBuffer(1, Math.floor(c.sampleRate * .5), c.sampleRate); const a = noiseBuf.getChannelData(0); for (let i = 0; i < a.length; i++) a[i] = Math.random() * 2 - 1; }
    const t = c.currentTime + (when || 0), s = c.createBufferSource(), bp = c.createBiquadFilter(), g = c.createGain(); s.buffer = noiseBuf; bp.type = 'bandpass'; bp.frequency.value = fc; bp.Q.value = q;
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d); s.connect(bp); bp.connect(g); g.connect(c.destination); s.start(t); s.stop(t + d + .02);
  } catch (e) {}
}
const METAL_R = [1, 2.756, 5.404, 8.933], METAL_A = [1, .55, .35, .2];
function metal(f, d, v, when) { METAL_R.forEach((r, i) => ring(f * r, d * (1 - i * .18), v * METAL_A[i], when)); ring(f * 1.004, d, v * .5, when); noise(.025, v * 1.2, when, Math.min(9000, f * 4), 1.5); }
const sfx = {
  // 銀色磚(打 2 下):清脆的「叮」;酒紅磚(打 3 下):低沉的「鏘」,越打越破音調越高
  metalHit: (maxhp, hp) => {
    if (maxhp === 2) metal(1180, .32, .06);
    else { const f = 300 * Math.pow(1.19, 3 - hp); metal(f, .6, .075); ring(f / 2, .2, .1); noise(.05, .07, 0, 1600, .9); }
  },
  metalBreak: maxhp => {
    if (maxhp === 2) { metal(1480, .45, .055); metal(1980, .3, .03, .04); noise(.2, .07, 0, 5200, .7); }
    else { metal(420, .9, .07); ring(105, .35, .16); noise(.35, .09, 0, 2600, .6); metal(840, .4, .03, .06); }
  },
  brick: c => { const f = 440 * Math.pow(1.0595, Math.min(c, 24)); tone(f, .1, 'square', .08); tone(f * 2, .06, 'triangle', .05, .01); }, crack: () => tone(160, .07, 'square', .07, 0, 90),
  paddle: () => { tone(180, .1, 'sine', .14, 0, 110); tone(360, .05, 'triangle', .06); }, wall: () => tone(300, .04, 'triangle', .05),
  launch: () => tone(250, .2, 'sawtooth', .06, 0, 900), lose: () => [330, 262, 196].forEach((f, i) => tone(f, .22, 'sawtooth', .09, i * .16)),
  clear: () => [523, 659, 784, 1046].forEach((f, i) => tone(f, .16, 'triangle', .11, i * .09)),
  pu: good => good ? [660, 880, 1175].forEach((f, i) => tone(f, .1, 'triangle', .1, i * .06)) : [300, 220].forEach((f, i) => tone(f, .14, 'sawtooth', .09, i * .1)),
  drop: () => tone(900, .05, 'triangle', .04), toggle: on => tone(on ? 880 : 440, .08, 'square', .06, 0, null, true),
  hard: hp => { tone(150 + hp * 40, .09, 'square', .09); tone(90, .1, 'sine', .1); },
  up: () => [660, 880, 1175].forEach((f, i) => tone(f, .12, 'triangle', .1, i * .06)),
  speedup: () => [520, 700, 940].forEach((f, i) => tone(f, .09, 'sawtooth', .05, i * .05)),
  bad: () => { tone(300, .18, 'sawtooth', .08, 0, 120); }
};

// ---------- 背景音樂:復古街機晶片音樂(E 多利安調,方波主旋律 + 三角波貝斯 + 噪音鼓) ----------
// 和其它遊戲不同:不是魔法奇幻或賽車風,而是 8-bit 街機感;球速每升一級,節拍就快一點,第 4 級起加入琶音、鼓也更密
const MUS = { on: true, bus: null, timer: null, step: 0, next: 0, pulse: null, pulse8: null };
try { MUS.on = localStorage.getItem('gamefeel_music') !== '0'; } catch (e) {}
const mhz = m => 440 * Math.pow(2, (m - 69) / 12);
const M_CH = [[0, [0, 3, 7, 10]], [5, [5, 9, 12, 16]], [0, [0, 3, 7, 10]], [5, [5, 9, 12, 16]], [-4, [-4, 0, 3, 7]], [-2, [-2, 2, 5, 9]], [7, [7, 10, 14, 17]], [-2, [-2, 2, 5, 9]]];
const M_MEL = [
  [7, null, 10, 12, 14, 12, 10, 7], [9, null, 9, 12, 9, 7, 5, null], [7, 10, 12, 14, 15, 14, 12, 10], [12, null, 9, null, 7, 9, 12, 14],
  [15, null, 14, 12, 15, null, 19, null], [17, null, 14, 10, 14, null, 17, 19], [19, 17, 14, 10, 7, 10, 14, 17], [21, null, 19, null, 17, 14, 12, 10]];
const M_BASS = [0, null, 12, 0, null, 0, 12, 7];
function pulseWave(c, duty) { const N = 40, re = new Float32Array(N), im = new Float32Array(N); for (let n = 1; n < N; n++) re[n] = 2 * Math.sin(n * Math.PI * duty) / (n * Math.PI); return c.createPeriodicWave(re, im); }
function mv(wave, f, t, d, v) {
  const c = actx, o = c.createOscillator(), g = c.createGain(); if (typeof wave === 'string') o.type = wave; else o.setPeriodicWave(wave);
  o.frequency.setValueAtTime(f, t); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .005); g.gain.setValueAtTime(v, t + d * .6); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g); g.connect(MUS.bus); o.start(t); o.stop(t + d + .03);
}
function mnoise(t, d, v, fc, type) {

  if (FX.trail) G.balls.forEach(B => B.trail.forEach((p, i) => { const k = (i + 1) / B.trail.length; ctx.fillStyle = FX.color ? `rgba(255,${150 + 80 * k | 0},60,${k * .5})` : `rgba(230,235,245,${k * .4})`; ctx.beginPath(); ctx.arc(p.x, p.y, BR * (.35 + k * .6), 0, 7); ctx.fill(); }));
  // 球拍
  const P = G.pad, ps = FX.squash ? P.sq : 0, pw = P.w * (1 + .22 * ps), ph = PAD_H * (1 - .45 * ps);
  ctx.save(); if (FX.color) { ctx.shadowColor = 'rgba(255,200,70,.7)'; ctx.shadowBlur = 14; } ctx.fillStyle = P.fl > 0 ? '#fff' : FX.color ? (G.eff.narrow > 0 ? '#ff9a8f' : G.eff.wide > 0 ? '#9af0c4' : '#ffe08a') : '#cfd6e6'; rr(P.x - pw / 2, PAD_Y + PAD_H / 2 - ph, pw, ph, ph / 2); ctx.fill(); ctx.restore();
  // 球
  for (const B of G.balls) {
    const sp = Math.hypot(B.vx, B.vy), st = FX.squash ? Math.min(.55, sp / 1100) : 0, bs = FX.squash ? B.sq : 0;
    ctx.save(); ctx.translate(B.x, B.y); if (sp > 1) ctx.rotate(Math.atan2(B.vy, B.vx)); if (FX.color) { ctx.shadowColor = G.eff.pierce > 0 ? 'rgba(255,110,40,.95)' : 'rgba(255,220,120,.9)'; ctx.shadowBlur = 16; }
    ctx.fillStyle = G.eff.pierce > 0 && FX.color ? '#ff9a4a' : FX.color ? '#fff1b8' : '#ffffff'; ctx.beginPath(); ctx.ellipse(0, 0, BR * (1 + st) * (1 - .3 * bs), BR / (1 + st * .7) * (1 + .45 * bs), 0, 0, 7); ctx.fill(); ctx.restore();
  }
  // 粒子
  for (const p of G.parts) { const k = 1 - p.life / p.max; ctx.globalAlpha = Math.max(0, k); ctx.fillStyle = p.c; ctx.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s); } ctx.globalAlpha = 1;
  // 跳字
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const p of G.pops) { const k = p.life / p.max; ctx.globalAlpha = k < .7 ? 1 : 1 - (k - .7) / .3; ctx.font = `800 ${p.size * (1 + .4 * (1 - Math.min(1, k * 4)))}px -apple-system, "Noto Sans TC", sans-serif`; ctx.fillStyle = p.c; ctx.fillText(p.text, p.x, p.y - ease.out(k) * 34); } ctx.globalAlpha = 1;
  ctx.restore();
  // 生命、關卡、啟用中的道具、提示、切換提示
  ctx.font = '700 13px -apple-system, sans-serif'; ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(160,180,240,.8)'; ctx.fillText('LV ' + (G.level + 1) + ' / ' + LEVEL_COUNT, 14, 18); ctx.textAlign = 'right'; ctx.fillStyle = FX.color ? '#ff6f61' : '#aab'; ctx.fillText('♥'.repeat(Math.max(0, G.lives)), W - 14, 18);
  let ey = 40; ctx.textAlign = 'left';
  for (const [k, nm, col] of [['wide', '加長', '#5bd69a'], ['narrow', '縮短', '#ff6f61'], ['slow', '減速', '#9b8cff'], ['fast', '加速', '#ff9f43'], ['pierce', '穿透', '#ffd166']]) if (G.eff[k] > 0) { ctx.fillStyle = FX.color ? col : '#cfd6e6'; ctx.fillText(nm + ' ' + Math.ceil(G.eff[k]) + 's', 14, ey); ey += 16; }
  if (speedUps() > 0) { ctx.fillStyle = FX.color ? '#ff9f43' : '#cfd6e6'; ctx.fillText('速度 Lv' + speedUps() + (speedUps() >= MAX_UPS ? ' MAX' : ''), 14, ey); ey += 16; }
  if (G.balls.length > 1) { ctx.fillStyle = FX.color ? '#4da6ff' : '#cfd6e6'; ctx.fillText('球 ×' + G.balls.length, 14, ey); }
  if (G.state === 'ready') { ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.font = '700 18px -apple-system, "Noto Sans TC", sans-serif'; ctx.fillText('點一下畫面或按空白鍵發球', W / 2, H * .62); }
  if (toast) { const k = toast.t / 1.4, al = k < .15 ? k / .15 : k > .7 ? 1 - (k - .7) / .3 : 1; ctx.globalAlpha = al * .6; ctx.textAlign = 'center'; ctx.fillStyle = '#b98a2a'; ctx.font = '800 46px -apple-system, "Noto Sans TC", sans-serif'; ctx.fillText(toast.title, W / 2, H * .42); ctx.globalAlpha = al * .45; ctx.fillStyle = '#7f92c7'; ctx.font = '700 15px -apple-system, sans-serif'; ctx.fillText(toast.sub, W / 2, H * .42 + 34); ctx.globalAlpha = 1; }
  $('score').textContent = String(Math.round(shownScore)).padStart(5, '0'); $('combo').textContent = '×' + G.combo;
}
// ---------- 介面 ----------
function hud() { const n = juice(); $('jl').textContent = `JUICE ${n}/10`; $('jd').innerHTML = Array.from({ length: 10 }, (_, i) => `<i class="${i < n ? 'on' : ''}"></i>`).join(''); $('setj').textContent = `JUICE ${n}/10`; document.querySelectorAll('.fx').forEach(b => { b.classList.toggle('on', FX[b.dataset.k]); b.querySelector('.sw').textContent = FX[b.dataset.k] ? 'ON' : 'OFF'; }); }
$('fxgrid').innerHTML = FXLIST.map(([k, zh, en]) => `<button class="fx" data-k="${k}"><span><b>${zh}</b><small>${en}</small></span><span class="sw"></span></button>`).join('');
function toggle(k, v) { const item = FXLIST.find(x => x[0] === k); FX[k] = typeof v === 'boolean' ? v : !FX[k]; saveFx(); hud(); sfx.toggle(FX[k]); }
// 設定頁:打開時遊戲暫停,關掉時在畫面上提示目前開了幾個特效
let setOpen = false, lvlOpen = false; const paused = () => setOpen || lvlOpen;
function openSet() { setOpen = true; keys = {}; hud(); $('set').classList.add('open'); }
function closeSet() { if (!setOpen) return; setOpen = false; if (document.activeElement) document.activeElement.blur(); $('set').classList.remove('open'); last = performance.now(); toast = { t: 0, title: 'JUICE ' + juice() + ' / 10', sub: FXLIST.filter(([k]) => FX[k]).map(x => x[1]).join('・') || '全部關閉' }; }
function openLvl() {
  lvlOpen = true; keys = {}; const tiers = ['入門', '暖身', '進階', '困難', '高手'], nDone = Object.keys(cleared).length; let h = '';
  for (let i = 0; i < LEVEL_COUNT; i++) {
    if (i % 10 === 0) h += `<div class="lvtier">${tiers[i / 10]} ・ 第 ${i + 1}–${i + 10} 關</div>`;
    const c = cleared[i + 1]; h += `<button class="lv${c !== undefined ? ' done' : ''}${G && i === G.level ? ' cur' : ''}" data-lv="${i}">${i + 1}<small>${c !== undefined ? '✓ 過關' : '&nbsp;'}</small></button>`;
  }
  $('lvgrid').innerHTML = h; $('lvsum').textContent = `已過關 ${nDone} / ${LEVEL_COUNT}`; $('lvl').classList.add('open');
}
function closeLvl() { if (!lvlOpen) return; lvlOpen = false; if (document.activeElement) document.activeElement.blur(); $('lvl').classList.remove('open'); last = performance.now(); }
$('openlvl').onclick = openLvl; $('closelvl').onclick = closeLvl; $('ovl').onclick = openLvl;
$('lvgrid').addEventListener('click', e => { const b = e.target.closest('.lv'); if (!b) return; ac(); musicStart(); closeLvl(); newGame(+b.dataset.lv); toast = { t: 0, title: '第 ' + (+b.dataset.lv + 1) + ' 關', sub: 'LEVEL ' + (+b.dataset.lv + 1) + ' / ' + LEVEL_COUNT }; });
function musUI() { $('musbtn').textContent = '🎵 音樂:' + (MUS.on ? '開' : '關'); $('musrow').classList.toggle('on', MUS.on); $('musrow').querySelector('.sw').textContent = MUS.on ? 'ON' : 'OFF'; }
function toggleMusic() { setMusic(!MUS.on); musUI(); }
$('musbtn').onclick = toggleMusic; $('musrow').onclick = toggleMusic; musUI();
$('openset').onclick = openSet; $('closeset').onclick = closeSet;
$('fxgrid').addEventListener('click', e => { const b = e.target.closest('.fx'); if (b) toggle(b.dataset.k); });
$('allon').onclick = () => { FXLIST.forEach(([k]) => FX[k] = true); saveFx(); hud(); sfx.toggle(true); };
$('alloff').onclick = () => { FXLIST.forEach(([k]) => FX[k] = false); saveFx(); hud(); sfx.toggle(false); };
$('restart').onclick = () => newGame(G.startLv); $('ovb').onclick = () => newGame(G.startLv);
const setTarget = e => { const r = cv.getBoundingClientRect(); target = (e.clientX - r.left) / r.width * W; };
addEventListener('pointerdown', () => musicStart(), true);
cv.addEventListener('pointerdown', e => { ac(); setTarget(e); launch(); try { cv.setPointerCapture(e.pointerId); } catch (x) {} });
cv.addEventListener('pointermove', e => { if (e.pointerType === 'mouse' || e.buttons || e.pressure > 0 || e.pointerType === 'touch') setTarget(e); });
addEventListener('keydown', e => { musicStart(); if (lvlOpen) { if (e.key === 'Escape') closeLvl(); return; } if (setOpen) { if (e.key === 'Escape') closeSet(); return; } if (e.key === 'Escape') { openSet(); return; } keys[e.key] = true; ac(); if (e.code === 'Space') { e.preventDefault(); launch(); } if (e.key.startsWith('Arrow')) e.preventDefault(); });
addEventListener('keyup', e => { keys[e.key] = false; });
function loop(now) { requestAnimationFrame(loop); const dt = Math.min(1 / 30, (now - last) / 1000 || 0); last = now; if (!paused()) update(dt); draw(); }
fit(); newGame(); hud(); requestAnimationFrame(loop); requestAnimationFrame(fit); if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
