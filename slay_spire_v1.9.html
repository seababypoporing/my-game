.chars{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}

.mech{text-align:left;font-size:12px;line-height:1.55;background:#0006;border-radius:8px;padding:6px 8px;margin-top:4px}

/* modal */
#modal{position:fixed;inset:0;background:#000d;z-index:200;display:none;flex-direction:column;align-items:center;padding:16px 10px 40px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y}

<body>
<div id="app"></div>
<div id="fx"></div>
<div id="modal"></div>
<button id="mclose" onclick="modalX()">✕</button>
<div id="toast"></div>
<script>
'use strict';
// ================= 工具 =================
const $=s=>document.querySelector(s);
const app=$('#app'), FX=$('#fx'), MODAL=$('#modal');
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const SAVE_KEY='abyss_spire_save_v1';
let UID=0;

// ================= 音訊（哥德管風琴 / 戰鼓風格，與其他遊戲不同） =================
const AU={ctx:null,on:true,mode:null,song:null,step:0,next:0,pending:null};
try{AU.on=localStorage.getItem('abyss_music')!=='0'}catch(e){}
function auInit(){
  if(AU.ctx){if(AU.ctx.state==='suspended')AU.ctx.resume();return}
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC)return;
  const c=new AC(); AU.ctx=c;

function matchP(e,p){if(typeof p==='string'&&p.includes('@')){const[t,o]=p.split('@');return(!t||e.t===t)&&e.o===o}if(p==='A'||p==='S'||p==='P')return e.t===p;if(p==='0')return e.z;if(p==='ST'||p==='FN')return CARDS[e.id].kw===(p==='ST'?'st':'fn');if(Array.isArray(p))return p.includes(e.id);return e.id===p}
function seqEntry(card){const o=ownerOf(card);return{id:card.id,t:CARDS[card.id].t,z:costOf(card)===0,o:o?o.ch:G.ch}}
function matchCombos(card){if(!C||!C.seq)return[];const seq=C.seq.concat([seqEntry(card)]);
  return COMBOS.filter(cb=>comboOn(cb)&&!C.comboUsed[cb.id]&&seq.length>=cb.pat.length&&cb.pat.every((p,i)=>matchP(seq[seq.length-cb.pat.length+i],p)))}
let CODEX={};try{CODEX=JSON.parse(localStorage.getItem('abyss_combo_codex')||'{}')}catch(e){}
function unlockCombo(cb){if(CODEX[cb.id])return;CODEX[cb.id]=1;try{localStorage.setItem('abyss_combo_codex',JSON.stringify(CODEX))}catch(e){}setTimeout(()=>toast(`📖 新連招解鎖：<b>${cb.n}</b><br>${cb.seq}：${cb.d}`),900)}
function addStance(n){const c=G.p.st.stance||0;G.p.st.stance=Math.min(3,c+n);floatTxt(G.p,'⚜️架勢 '+G.p.st.stance,'f-buff');sfx('buff')}
function useStance(){const k=G.p.st.stance||0;if(k){delete G.p.st.stance;floatTxt(G.p,`⚜️×${k} 終結！`,'f-buff')}return k}
function comboOn(cb){if(!isParty())return cb.ch==='all'||cb.ch===G.ch;if(cb.ch==='party')return cb.need.every(c=>G.chs.includes(c));return cb.ch==='all'||G.chs.includes(cb.ch)}
function showCodex(){const n=COMBOS.filter(c=>CODEX[c.id]).length;
  modal(`<h2>📖 連招圖鑑（${n}/${COMBOS.length}）</h2><p class="sub" style="text-align:center;margin-top:-6px">同一回合內依序打出卡牌即可觸發，每種連招每回合限一次。</p>${['all','w','a','m','party'].map(ch=>`<h3 style="color:#ffd27a;margin:14px 0 6px">${CHN[ch]}連招</h3>${COMBOS.filter(c=>c.ch===ch).map(c=>CODEX[c.id]?`<div class="cdx"><b>★ ${c.n}</b><br><span class="seqt">${c.seq}</span><br>${c.d}</div>`:`<div class="cdx lock"><b>？？？</b><br><span class="seqt">尚未發現</span></div>`).join('')}`).join('')}<br><button class="btn" onclick="closeModal()">關閉</button>`)}

let G=null,C=null,SCR='title',DR=null;
function hasRelic(id){return G.relics.includes(id)}
function alive(){return C?C.enemies.filter(e=>!e.dead):[]}
function costOf(card){const c=CARDS[card.id].c;return Array.isArray(c)?c[card.up?1:0]:c}
function exh(card){const x=CARDS[card.id].ex;return Array.isArray(x)?x[card.up?1:0]:!!x}
function canUp(c){return !c.up&&CARDS[c.id].t!=='X'}
function cardName(c){return CARDS[c.id].n+(c.up?'+':'')}
function baseE(){return 3+(isParty()?G.size-1:0)+(hasRelic('core')?1:0)+(hasRelic('sage')?1:0)}

let DIFF=0;try{DIFF=+(localStorage.getItem('abyss_diff')||0)||0}catch(e){}
function diffD(){return DIFFS[(G&&G.diff)||0]}
function setDiff(i){DIFF=i;try{localStorage.setItem('abyss_diff',i)}catch(e){}sfx('select');render()}
function diffPicker(){return`<div class="dpick"><b>難度</b><div class="row" style="gap:6px">${DIFFS.map((d,i)=>`<button class="btn ${i===DIFF?'':'gray'}" style="padding:8px 14px" onclick="setDiff(${i})">${d.e} ${d.n}</button>`).join('')}</div><div class="sub" style="font-size:13px">${DIFFS[DIFF].d}</div></div>`}
const PMODE={2:{n:'兩人組',rows:18,hpMul:1.3,dmgMul:1.15,draw:6,extra:[.7,1,1]},3:{n:'三人組',rows:21,hpMul:1.6,dmgMul:1.25,draw:7,extra:[1.5,2,2]}};
const PER_HERO=['burnblood','anchor','bronze','straw','pear','vial','vajra','stone','meat'];
function isParty(){return !!(G&&G.mode==='party')}
function allies(){return isParty()?G.party.filter(h=>!h.down):(G&&G.p?[G.p]:[])}
function lead(){if(isParty())G.p=G.party.find(h=>!h.down)||G.party[0]}
function eachHero(fn,withDown){if(!isParty()){fn(G.p);return}const keep=G.p;G.party.forEach(h=>{if(withDown||!h.down){G.p=h;fn(h)}});G.p=keep;if(G.p.down)lead()}
function lowestAlly(){return allies().slice().sort((a,b)=>a.hp/a.maxHp-b.hp/b.maxHp)[0]}
function heroOf(ch){return G.party.find(h=>h.ch===ch)}
function ownerOf(card){if(!isParty())return G.p;let ch=card.own||CARDS[card.id].ch;let h=ch&&ch!=='n'?heroOf(ch):null;return h||G.party.find(x=>!x.down)||G.party[0]}
function downHero(h){if(h.down)return;h.down=true;h.hp=0;h.block=0;h.st={};floatTxt(h,'倒下了！','f-dmg');sfx('die');shake();setTimeout(()=>toast(`💀 <b>${h.name}</b> 倒下了！他的卡牌暫時無法打出。<br>可在營火休息、用復甦術或鳳凰羽毛救回。`),300)}
function reviveHero(h,pct){if(!h||!h.down)return;h.down=false;h.hp=Math.max(1,Math.floor(h.maxHp*pct));h.block=0;h.st={};floatTxt(h,'復活！','f-heal');sfx('heal')}
function pickHeroTarget(e){const al=allies();if(!al.length)return null;if(!isParty())return G.p;
  const tn=al.find(h=>h.st.taunt);if(tn)return tn;
  if(e.tg&&al.some(h=>h.uid===e.tg))return al.find(h=>h.uid===e.tg);
  const a=e.def.aim;let t;if(a==='low')t=lowestAlly();else if(a==='back')t=al[al.length-1];else if(a==='front')t=al[0];else t=pick(al);
  e.tg=t.uid;return t}

// ================= 戰鬥引擎 =================
function apply(t,k,n,silent){
  if(!t||t.dead||!n)return; if(!t.isP&&(k==='burn'||k==='frz')&&n>0&&G.p.st.amp)n+=G.p.st.amp; t.st[k]=(t.st[k]||0)+n; if(t.st[k]===0)delete t.st[k];
  if(!silent){const s=STS[k]||{i:'',n:k};const bad=s.deb||n<0;floatTxt(t,`${s.i}${s.n}${n>0?'+':''}${n}`,bad?'f-deb':'f-buff');sfx(k==='poison'?'poison':k==='frz'?'ice':k==='burn'?'fire':bad?'debuff':'buff')}
  if(k==='frz'&&!t.isP&&t.st.frz>=frzThr(t))freezeNow(t);
}
function frzThr(e){const b=!!(e.def&&e.def.boss);return(b?5:3)+(e.frzCount||0)*(b?3:2)}
function freezeNow(e){if(!e||e.dead)return;delete e.st.frz;e.frzCount=(e.frzCount||0)+1;e.move={id:'frozen',k:'frozen',label:'被冰封了'};floatTxt(e,'❄️ 冰封！','f-blk');sfx('ice');if(typeof PFX!=='undefined')PFX.freeze(e);else MFX.play(MFX.shards(document.getElementById('cr-'+e.uid)))}
function randAlive(){const a=alive();return a.length?pick(a):null}
function applyAll(k,n){alive().forEach(e=>apply(e,k,n))}
function dmgCalc(src,tgt,base){if(src&&!src.isP){const m=(isParty()?G.dmgMul:1)*diffD().dmg;if(m!==1)base=Math.round(base*m)}let d=base+(src?(src.st.str||0):0);if(src&&src.st.weak)d*=.75;if(tgt.st.vuln)d*=1.5;if(src&&src.isP&&C&&C.mod)d*=C.mod.dmgMul;d=Math.max(0,Math.floor(d));if(tgt.st.intan)d=Math.min(d,1);return d}
function deal(tgt,d,src){
  if(!tgt||tgt.dead)return 0; if(tgt.st.intan)d=Math.min(d,1);
  const b=(src&&src.isP&&C&&C.mod&&C.mod.pierce)?0:Math.min(tgt.block,d); tgt.block-=b; const un=d-b; tgt.hp-=un; tgt.hitAt=performance.now();
  if(un>=15)MFX.play(MFX.impact(document.getElementById('cr-'+tgt.uid),tgt.isP?'#ff5a4a':'#ffe9a0',un>=30?2:1));
  if(un>0){floatTxt(tgt,'-'+un,'f-dmg');sfx(un>=18?'heavy':'hit');if(tgt.isP&&un>=10)shake()}else{floatTxt(tgt,'格擋','f-blk');sfx('block')}
  if(tgt.isP){if(tgt.hp<0)tgt.hp=0;if(src&&!src.isP&&!src.dead&&tgt.st.thorns)deal(src,tgt.st.thorns,null);if(tgt.hp<=0&&isParty())downHero(tgt)}
  else{if(tgt.hp<=0)die(tgt);else if(tgt.def.hurt)tgt.def.hurt(tgt,un)}
  return un;
}
function hit(src,tgt,base){return deal(tgt,dmgCalc(src,tgt,base),src)}
function atk(t,n,times=1){let tot=0;G.p.actAt=performance.now();for(let i=0;i<times;i++){if(!t||t.dead)break;const un=hit(G.p,t,n);tot+=un;if(un>0&&G.p.st.envenom)apply(t,'poison',G.p.st.envenom)}return tot}
function atkAll(n,times=1){let tot=0;G.p.actAt=performance.now();for(let i=0;i<times;i++)for(const e of alive()){const un=hit(G.p,e,n);tot+=un;if(un>0&&G.p.st.envenom)apply(e,'poison',G.p.st.envenom)}return tot}
function blk(n,t){t=t||G.p;let v=n;if(t.isP){v+=t.st.dex||0;if(t.st.frail)v=Math.floor(v*.75)}v=Math.max(0,v);t.block+=v;if(v>0){floatTxt(t,'🛡+'+v,'f-blk');sfx('block2')}}
function loseHp(t,n){if(!n||t.dead)return;t.hp-=n;t.hitAt=performance.now();floatTxt(t,'-'+n,'f-psn');sfx('hit');if(t.isP){if(t.hp<0)t.hp=0;if(t.hp<=0&&isParty())downHero(t)}else{if(t.hp<=0)die(t);else if(t.def.hurt)t.def.hurt(t,n)}}
function heal(t,n){if(!t||t.dead||!n||n<=0)return;const v=Math.min(n,t.maxHp-t.hp);if(v<=0)return;t.hp+=v;floatTxt(t,'+'+v,'f-heal');sfx('heal')}
function die(e){if(typeof PFX!=='undefined'&&!e.dead)PFX.death(e);e.dead=true;e.hp=0;floatTxt(e,'擊敗！','f-buff');sfx('die');if(e.def.death)e.def.death(e)}
function gainE(n){C.energy+=n;floatTxt(G.p,'⚡+'+n,'f-buff');sfx('buff')}
function draw(n){let d=0;for(let i=0;i<n;i++){if(C.hand.length>=10){toast('手牌已滿！');break}if(!C.draw.length){if(!C.discard.length)break;C.draw=shuffle(C.discard);C.discard=[];sfx('shuffle')}C.hand.push(C.draw.pop());d++}if(d)sfx('draw')}
function addCards(id,n,pile){for(let i=0;i<n;i++){const c={id,up:false,uid:++UID};if(id==='shiv'&&isParty()&&G.p)c.own=G.p.ch;if(pile==='hand'&&C.hand.length<10)C.hand.push(c);else if(pile==='draw')C.draw.splice(rnd(0,C.draw.length),0,c);else C.discard.push(c)}}
function splitInto(e,id){const hp=e.hp;e.dead=true;e.splitDone=true;floatTxt(e,'分裂！','f-buff');sfx('die');const at=C.enemies.indexOf(e);
  const a=mkEnemy(id,at,hp),b=mkEnemy(id,at+1,hp);[a,b].forEach(x=>{x.move=x.def.ai(x);x.fresh=true});C.enemies.splice(at+1,0,a,b)}
function mkEnemy(id,i,hp){const d=EN[id];let h=hp||rnd(d.hp[0],d.hp[1]);if(!hp)h=Math.round(h*(isParty()?G.hpMul:1)*diffD().hp);const e={id,def:d,name:d.n,emo:d.e,hp:h,maxHp:h,block:0,st:{},t:0,idx:i,uid:'e'+(++UID)};if(d.init)d.init(e);return e}
function dec(c){['vuln','weak','frail'].forEach(k=>{if(c.st[k]){c.st[k]--;if(!c.st[k])delete c.st[k]}})}

function startCombat(ids,kind){
  if(isParty()){G.party.forEach(h=>{h.block=0;h.st={}});lead();ids=partyFight(ids,kind)}else{G.p.block=0;G.p.st={};}
  C={enemies:[],draw:shuffle(G.deck.map(c=>({id:c.id,up:c.up,uid:++UID}))),hand:[],discard:[],exhaust:[],energy:0,turn:0,kind,busy:true,sel:null,potSel:null,atkCount:0,over:false};
  ids.forEach((id,i)=>C.enemies.push(mkEnemy(id,i)));
  if(hasRelic('sage'))C.enemies.forEach(e=>apply(e,'str',1,true));
  G.relics.forEach(r=>{if(!REL[r].start)return;if(isParty()&&PER_HERO.includes(r))eachHero(()=>REL[r].start());else REL[r].start()});
  C.enemies.forEach(e=>e.move=e.def.ai(e));
  G.screen='combat';playMusic(kind==='boss'?'boss':'combat');render();
  MFX.clear();if(kind==='boss'){const b=C.enemies.find(e=>e.def.boss)||C.enemies[0];MFX.play(MFX.boss(b.name,b.emo,b.def.info||''))}
  else if(kind==='elite')MFX.play(MFX.strip('菁英出現！','#ff7a3a','強 敵 來 襲',{burst:true,dur:1.6}));
  else MFX.play(MFX.strip('戰鬥開始','#c9a25a',null,{dur:1.1,h:.12}));
  setTimeout(startPlayerTurn,kind==='boss'?2500:kind==='elite'?1300:800);
}
async function startPlayerTurn(){
  if(!C||C.over)return; C.turn++;
  let ins=0;const heroes=allies();
  for(const p of heroes){G.p=p;
    if(!p.st.barricade&&C.turn>1)p.block=0;
    if(p.st.intan){p.st.intan--;if(!p.st.intan)delete p.st.intan}
    if(p.st.taunt)delete p.st.taunt;
    if(p.st.poison){loseHp(p,p.st.poison);if(p.st.poison){p.st.poison--;if(!p.st.poison)delete p.st.poison}render();if(checkEnd())return;if(p.down)continue}}
  C.energy=baseE()+(C.turn===1&&hasRelic('lantern')?1:0);C.atkCount=0;C.seq=[];C.comboUsed={};C.shivPoison=false;
  for(const p of allies()){G.p=p;
    if(p.st.demon)apply(p,'str',p.st.demon);
    if(p.st.infblade)addCards('shiv',p.st.infblade,'hand');
    if(p.st.fumes)applyAll('poison',p.st.fumes);
    if(p.st.affinity){applyAll('burn',p.st.affinity);if(C.turn%2===0)applyAll('frz',1)}
    ins+=p.st.insight||0}
  lead();
  draw((isParty()?G.drawN:5)+ins+(hasRelic('wheel')?1:0)+(C.turn===1&&hasRelic('snakering')?2:0));
  C.busy=false; if(C.turn>1){banner('你的回合');sfx('turn')} render();
}
function playable(card){const d=CARDS[card.id];if(d.unp)return false;if(isParty()&&ownerOf(card).down)return false;const c=costOf(card);return c==='X'||c<=C.energy}
async function playCard(idx,target){
  if(!C||C.busy||C.over)return;const card=C.hand[idx];if(!card)return;const def=CARDS[card.id];
  if(def.unp){toast('這張牌無法打出');sfx('err');render();return}
  if(isParty()){const o=ownerOf(card);if(o.down){toast(`${o.name}已經倒下，無法打出他的牌`);sfx('err');render();return}G.p=o}
  const cost=costOf(card),isX=cost==='X';if(!isX&&cost>C.energy){toast('能量不足');sfx('err');render();return}
  if(def.tg==='e'&&(!target||target.dead)){render();return}
  C.busy=true;C.sel=null;C.hand.splice(idx,1);let x=0;if(isX){x=C.energy;C.energy=0}else C.energy-=cost;
  sfx('card');
  const cbs=matchCombos(card);C.mod={dmgMul:1};
  if(cbs.length){comboBanner(cbs.map(c=>'★ '+c.n+'！').join('　'));sfx('combo');cbs.forEach(c=>{C.comboUsed[c.id]=1;unlockCombo(c);if(c.pre)c.pre(target)});await sleep(250);if(!C||!G)return}
  x+=C.mod.extraX||0;
  if(def.t==='S')alive().forEach(e=>{if(e.st.enrage)apply(e,'str',e.st.enrage)});
  const myC=C;const hw=(def.t==='A'&&G.p&&G.p.isP)?heroAnim(G.p,def,target):0;
  const pd=(typeof PFX!=='undefined')?PFX.card(card.id,target):0;const wt=Math.max(hw,pd);if(wt){await sleep(wt);if(!C||!G||C!==myC)return}
  try{await def.f(card.up,target,x)}catch(err){console.error(err)}
  if(!C||!G||C!==myC)return;
  C.seq.push(seqEntry(card));
  cbs.forEach(c=>{if(c.post)c.post(target)});C.mod=null;
  if(def.t==='A'){C.atkCount++;if(C.atkCount%3===0){if(hasRelic('kunai'))apply(G.p,'dex',1);if(hasRelic('shuriken'))apply(G.p,'str',1)}}
  if(def.t!=='P'){if(exh(card))C.exhaust.push(card);else C.discard.push(card)}
  lead();C.busy=false;render();checkEnd();
}
function checkEnd(){if(!C||C.over)return true;if(isParty()?!allies().length:G.p.hp<=0){C.over=true;C.busy=true;MFX.clear();MFX.play(MFX.defeat(isParty()?'全軍覆沒':'你倒下了'));setTimeout(gameOver,2300);return true}
  if(!alive().length){C.over=true;C.busy=true;MFX.clear();const k=C.kind;MFX.play(MFX.victory(k==='boss'?'首領擊破！':k==='elite'?'菁英擊破！':'勝利！',k!=='normal'));setTimeout(winCombat,k==='boss'?2100:k==='elite'?1500:1100);return true}return false}
async function endTurn(){
  if(!C||C.busy||C.over)return;C.busy=true;C.sel=null;C.potSel=null;sfx('end');
  for(const p of allies())if(p.st.metal){p.block+=p.st.metal;floatTxt(p,'🛡+'+p.st.metal,'f-blk')}
  const keep=hasRelic('pyramid'),nh=[];
  for(const c of C.hand){const d=CARDS[c.id];if(d.eth)C.exhaust.push(c);else if(keep)nh.push(c);else C.discard.push(c)}
  C.hand=nh;allies().forEach(dec);render();await sleep(300);banner('敵人回合');await sleep(500);if(!C||C.over)return;
  for(const e of alive()){if(!e.st.barr)e.block=0;if(e.st.poison){loseHp(e,e.st.poison);if(!e.dead){e.st.poison--;if(!e.st.poison)delete e.st.poison}}if(!e.dead&&e.st.burn){const b=e.st.burn;floatTxt(e,'🔥','f-dmg');loseHp(e,b);if(!e.dead){e.st.burn=Math.floor(b/2);if(!e.st.burn)delete e.st.burn}}}
  render();if(checkEnd())return;await sleep(300);if(!C||C.over)return;
  for(const e of [...C.enemies]){if(e.dead||!e.move||e.fresh)continue;e.actAt=performance.now();await enemyAct(e);render();if(checkEnd())return;await sleep(420);if(!C||C.over)return}
  for(const e of alive()){if(e.fresh){delete e.fresh;continue}if(e.st.metal){e.block+=e.st.metal}if(e.st.ritual&&e.t>0)apply(e,'str',e.st.ritual);dec(e);e.t++;e.tg=null;e.move=e.def.ai(e)}
  lead();render();await sleep(250);if(checkEnd())return;await startPlayerTurn();
}
async function enemyAct(e){if(!G||!C)return;const m=e.move;e.last=m.id;floatTxt(e,m.label,'f-lbl');
  if(!isParty()){
    if(m.d){for(let i=0;i<(m.n||1);i++){if(!G||!C||e.dead||G.p.hp<=0)break;hit(e,G.p,m.d);render();await sleep(170)}}
    if(!G||!C||e.dead||G.p.hp<=0)return;if(m.b){e.block+=m.b;floatTxt(e,'🛡+'+m.b,'f-blk');sfx('block2')}
    if(m.fx)await m.fx(e);return}
  const first=pickHeroTarget(e);if(!first)return;
  if(m.d){for(let i=0;i<(m.n||1);i++){if(!G||!C||e.dead)break;const tg=m.aoe?allies():[pickHeroTarget(e)].filter(Boolean);if(!tg.length)break;
      for(const t of tg){G.p=t;hit(e,t,m.d)}render();await sleep(170)}}
  if(!G||!C)return;
  if(!e.dead&&m.b){e.block+=m.b;floatTxt(e,'🛡+'+m.b,'f-blk');sfx('block2')}
  const t=pickHeroTarget(e);if(m.fx&&(t||m.k==='def'||m.k.includes('buff')||m.id==='boom')){G.p=t||G.party[0];await m.fx(e)}
  lead();
}
function partyFight(ids,kind){const P=PMODE[G.size],pool=POOLS[G.act];ids=ids.slice();
  const ex=P.extra[kind==='boss'?2:kind==='elite'?1:0];let n=Math.floor(ex)+(Math.random()<ex%1?1:0);
  if(kind==='normal'&&G.fights<=2)n=Math.min(n,1);
  for(let i=0;i<n&&ids.length<5;i++)ids.push(kind==='boss'?pool.bossX:pick(pool.extra));
  return ids}
function winCombat(){if(!G||!C)return;
  G.relics.forEach(r=>{if(!REL[r].win)return;if(isParty()&&PER_HERO.includes(r))eachHero(()=>REL[r].win());else REL[r].win()});if(isParty())G.party.forEach(h=>{h.st={};h.block=0});else{G.p.st={};G.p.block=0}lead();sfx('win');
  const kind=C.kind;makeReward(kind);C=null;G.screen='reward';playMusic('map');render();
}

function targetMode(){if(!C)return false;if(C.potSel!=null)return true;if(C.sel==null)return false;const c=C.hand[C.sel];return c&&CARDS[c.id].tg==='e'}
function setupHand(){const hand=document.getElementById('hand');if(!hand)return;fitHand(hand);
  hand.onpointerdown=ev=>{const el=ev.target.closest('.card');if(!el||!C||C.busy||C.over)return;ev.preventDefault();DR={i:+el.dataset.i,el,x0:ev.clientX,y0:ev.clientY,moved:false}}}
function fitHand(hand){const n=C.hand.length;if(!n)return;const cw=hand.firstElementChild.offsetWidth;const w=hand.clientWidth-14;const gap=n>1&&n*cw+(n-1)*4>w?-((n*cw-w)/(n-1)):4;hand.querySelectorAll('.card').forEach((c,i)=>{c.style.marginLeft=i?gap+'px':'0'})}
function enemyAt(x,y){const el=document.elementFromPoint(x,y);return el?el.closest('.enemy'):null}
window.addEventListener('pointermove',ev=>{if(!DR)return;const dx=ev.clientX-DR.x0,dy=ev.clientY-DR.y0;
  if(!DR.moved&&Math.hypot(dx,dy)>12){DR.moved=true;DR.el.classList.add('dragging');const c=C.hand[DR.i];if(c&&CARDS[c.id].tg==='e')document.querySelector('.field')?.classList.add('tm');if(c){const o=ownerOf(c);document.querySelectorAll('.cr.player').forEach(x=>x.classList.toggle('actor',!!o&&x.id==='cr-'+o.uid))}}
  if(DR.moved){DR.el.style.transform=`translate(${dx}px,${dy}px) scale(1.1)`;const t=enemyAt(ev.clientX,ev.clientY);document.querySelectorAll('.enemy').forEach(x=>x.classList.toggle('aim',x===t))}});
window.addEventListener('pointerup',ev=>{if(!DR)return;const d=DR;DR=null;if(!C){return}const card=C.hand[d.i];if(!card){render();return}const def=CARDS[card.id];
  if(!d.moved){tapCard(d.i);return}
  const up=d.y0-ev.clientY>70;
  if(def.unp){toast('這張牌無法打出');render();return}
  if(!playable(card)){toast(isParty()&&ownerOf(card).down?`${ownerOf(card).name}已經倒下，無法打出他的牌`:'能量不足');sfx('err');render();return}
  if(def.tg==='e'){const el=enemyAt(ev.clientX,ev.clientY);let t=el?C.enemies[+el.dataset.e]:null;if(!t&&up&&alive().length===1)t=alive()[0];if(t){C.sel=null;playCard(d.i,t)}else{C.sel=null;render()}}
  else{C.sel=null;if(up)playCard(d.i);else render()}});
window.addEventListener('pointercancel',()=>{if(DR){DR=null;render()}});
window.addEventListener('resize',()=>{if(G&&G.screen==='combat'){const h=document.getElementById('hand');if(h)fitHand(h)}});
function tapCard(i){const card=C.hand[i];if(!card)return;const def=CARDS[card.id];C.potSel=null;
  if(C.sel===i){if(def.tg!=='e'){C.sel=null;playCard(i);return}if(alive().length===1){C.sel=null;playCard(i,alive()[0]);return}C.sel=null;render();return}
  if(def.unp){toast('這張牌無法打出');sfx('err');return}
  if(!playable(card)){toast(isParty()&&ownerOf(card).down?`${ownerOf(card).name}已經倒下，無法打出他的牌`:'能量不足');sfx('err');return}
  C.sel=i;sfx('select');render()}
function enemyClick(i){if(!C)return;const e=C.enemies[i];if(!e||e.dead)return;
  if(C.potSel!=null&&!C.busy){usePotion(C.potSel,e);return}
  if(C.sel!=null&&!C.busy){const c=C.hand[C.sel];if(c&&CARDS[c.id].tg==='e'){const s=C.sel;C.sel=null;playCard(s,e);return}}
  const m=e.move;toast(`<b>${e.name}</b>　意圖：${m?m.label:'？'}${e.def.info?'<br>'+e.def.info:''}${stsText(e)}`)}
function playerClick(i){const p=isParty()?G.party[i]:G.p;if(!p)return;toast(`<b>${p.name}</b>　${p.down?'💀 倒下':'❤️ '+p.hp+'/'+p.maxHp}　🛡 ${p.block}${stsText(p)||'<br>沒有任何狀態'}`)}
function stsText(c){const k=Object.keys(c.st);if(!k.length)return'';return'<br>'+k.map(x=>{const s=STS[x]||{i:'',n:x,d:''};return`${s.i}${s.n} ${c.st[x]}：${s.d}`}).join('<br>')}

function givePotion(id){const i=G.potions.indexOf(null);if(i<0)return false;G.potions[i]=id;sfx('potion');return true}
function potClick(i){const id=G.potions[i];if(!id)return;const d=POT[id];const inC=G.screen==='combat'&&C&&!C.over;
  modal(`<div class="pmenu"><div class="bigemo" style="font-size:60px">${d.e}</div><h3>${d.n}</h3><p>${d.d}</p><div class="row">${(inC&&!C.busy)||(!inC&&d.ooc)?`<button class="btn" onclick="closeModal();potUse(${i})">使用</button>`:''}<button class="btn gray" onclick="closeModal();G.potions[${i}]=null;render()">丟棄</button><button class="btn gray" onclick="closeModal()">取消</button></div></div>`)}
function potUse(i){const d=POT[G.potions[i]];if(!d)return;if(isParty()&&d.hero){heroPick(i,d);return}if(d.tg==='e'){if(alive().length===1){usePotion(i,alive()[0]);return}C.potSel=i;C.sel=null;render();toast('請點選藥水的目標');return}usePotion(i,null)}
function usePotion(i,t){const d=POT[G.potions[i]];if(!d)return;G.potions[i]=null;if(C)C.potSel=null;sfx('potion');d.f(t);if(G.p.hp>G.p.maxHp)G.p.hp=G.p.maxHp;lead();render();if(G.screen==='combat')checkEnd()}
function heroPick(i,d){const list=G.party.map((h,k)=>({h,k})).filter(x=>d.hero==='down'?x.h.down:!x.h.down);

function potKeys(){return Object.keys(POT).filter(k=>!POT[k].pk||isParty())}

// ================= 地圖 =================
const NODEI={battle:'⚔️',elite:'😈',rest:'🔥',shop:'💰',event:'❓',treasure:'🧰'};
const NODEN={battle:'戰鬥',elite:'菁英',rest:'營火',shop:'商店',event:'未知',treasure:'寶箱'};
function genMap(){const R=isParty()?PMODE[G.size].rows:15,TR=Math.floor(R/2)+1,rows=[];
  for(let r=0;r<R;r++){const n=r===0?3:r===R-1?rnd(2,3):rnd(2,4);const nodes=[];for(let i=0;i<n;i++)nodes.push({i,x:Math.max(10,Math.min(90,(i+.5)/n*100+(Math.random()*12-6))),type:null,next:[]});rows.push(nodes)}
  for(let r=0;r<R-1;r++){const a=rows[r],b=rows[r+1];
    a.forEach((nd,i)=>{const j=a.length===1?0:Math.round(i*(b.length-1)/(a.length-1));nd.next.push(j);if(Math.random()<.35){const j2=j+(Math.random()<.5?-1:1);if(j2>=0&&j2<b.length&&!nd.next.includes(j2))nd.next.push(j2)}});
    b.forEach((nb,j)=>{if(!a.some(nd=>nd.next.includes(j))){let best=0,bd=99;a.forEach((nd,i)=>{const dd=Math.abs(i/Math.max(1,a.length-1)-j/Math.max(1,b.length-1));if(dd<bd){bd=dd;best=i}});a[best].next.push(j)}})}
  rows.forEach((row,r)=>row.forEach(nd=>{
    if(r===0)nd.type='battle';else if(r===R-1)nd.type='rest';else if(r===TR)nd.type='treasure';
    else{const x=Math.random(),DE=diffD().elite;let t;if(x<.45-DE)t='battle';else if(x<.67-DE)t='event';else if(x<.8)t=r>=4?'elite':'battle';else if(x<.91)t=(r>=4&&r!==R-2)?'rest':'event';else t=r>=2?'shop':'battle';nd.type=t}}));
  fixAdjacent(rows,TR);
  if(!rows.some(row=>row.some(n=>n.type==='shop'))){const r=rnd(5,7);pick(rows[r]).type='shop';fixAdjacent(rows,TR)}
  if(R>15&&rows.filter(row=>row.some(n=>n.type==='shop')).length<2){const r=rnd(TR+2,R-3);pick(rows[r]).type='shop';fixAdjacent(rows,TR)}
  return{rows};
}
// 商店／營火／菁英不會在同一條路線上連續出現
function fixAdjacent(rows,TR=8){const NO=['shop','rest','elite'];
  for(let r=1;r<rows.length;r++)rows[r].forEach((nd,j)=>{
    const near=t=>rows[r-1].some(pa=>pa.next.includes(j)&&pa.type===t)||(r+1<rows.length&&nd.next.some(k=>rows[r+1][k].type===t&&r+1!==rows.length-1));
    if(NO.includes(nd.type)&&near(nd.type)&&r!==rows.length-1&&r!==TR)nd.type=Math.random()<.6?'battle':'event';})
}
function isVis(r,i){return G.path.some(p=>p[0]===r&&p[1]===i)}
function availNodes(){const R=G.map.rows.length;if(!G.path.length)return G.map.rows[0].map((n,i)=>[0,i]);const [r,i]=G.path[G.path.length-1];if(r>=R)return[];if(r===R-1)return[[R,0]];return G.map.rows[r][i].next.map(j=>[r+1,j])}
function mapHTML(){const rows=G.map.rows,R=rows.length,H=(R+1)*84+90,yp=r=>H-56-r*84,av=availNodes(),isAv=(r,i)=>av.some(a=>a[0]===r&&a[1]===i);
  const cur=G.path.length?G.path[G.path.length-1][0]:-1;let lines='',nodes='';
  rows.forEach((row,r)=>row.forEach(nd=>{
    const tgts=r===R-1?[{x:50,r:R,j:0}]:nd.next.map(j=>({x:rows[r+1][j].x,r:r+1,j}));
    tgts.forEach(t=>{let cls='';const pi=G.path.findIndex(p=>p[0]===r&&p[1]===nd.i);if(pi>=0&&G.path[pi+1]&&G.path[pi+1][0]===t.r&&G.path[pi+1][1]===t.j)cls='done';else if(pi===G.path.length-1&&pi>=0)cls='av';
      lines+=`<line x1="${nd.x}%" y1="${yp(r)}" x2="${t.x}%" y2="${yp(t.r)}" class="${cls}"/>`});
    const a=isAv(r,nd.i),v=isVis(r,nd.i);
    nodes+=`<div class="node ${a?'av':''} ${v?'vis':''} ${!a&&!v&&r<=cur?'past':''}" style="left:${nd.x}%;top:${yp(r)}px" ${a?`onclick="goNode(${r},${nd.i})"`:''}>${NODEI[nd.type]}</div>`}));
  const ba=isAv(R,0);nodes+=`<div class="node boss ${ba?'av':''}" style="left:50%;top:${yp(R)}px" ${ba?`onclick="goNode(${R},0)"`:''}>${POOLS[G.act].bossE}</div>`;
  return`${topbar()}<div class="legend">${Object.keys(NODEI).map(k=>`<span>${NODEI[k]}${NODEN[k]}</span>`).join('')}<span>${POOLS[G.act].bossE}首領</span></div><div class="mapwrap" id="mapwrap"><div class="mapinner" style="height:${H}px"><svg width="100%" height="${H}">${lines}</svg>${nodes}</div></div>`}
function scrollMap(){const w=document.getElementById('mapwrap');if(!w)return;const R=G.map.rows.length,H=(R+1)*84+90;const cur=G.path.length?G.path[G.path.length-1][0]:-1;w.scrollTop=Math.max(0,(H-56-(cur+1)*84)-w.clientHeight*.55)}
function goNode(r,i){sfx('click');G.path.push([r,i]);G.floor++;const R=G.map.rows.length;const type=r===R?'boss':G.map.rows[r][i].type;enterNode(type)}
function pickFight(){const pool=G.fights<3?POOLS[G.act].easy:POOLS[G.act].norm;G.fights++;let f;do{f=pick(pool)}while(pool.length>1&&JSON.stringify(f)===G.lastFight);G.lastFight=JSON.stringify(f);return f}
function enterNode(type){
  switch(type){
    case'battle':startCombat(pickFight(),'normal');break;
    case'elite':startCombat(pick(POOLS[G.act].elite),'elite');break;
    case'boss':startCombat(POOLS[G.act].boss,'boss');break;
    case'rest':G.screen='rest';render();break;
    case'shop':genShop();G.screen='shop';render();break;
    case'treasure':G.chest={opened:false};G.screen='treasure';render();break;
    case'event':{const x=Math.random();if(x<.14){toast('❓ 你遭遇了埋伏！');startCombat(pickFight(),'normal')}else if(x<.22){G.chest={opened:false};G.screen='treasure';render()}else startEvent();break}
  }
}
function nodeDone(){C=null;G.screen='map';playMusic('map');render()}

// ================= 獎勵 =================
function rollRarity(kind){if(kind==='boss')return'r';const x=Math.random();const rare=kind==='elite'?.1:kind==='shop'?.09:.04;if(x<rare)return'r';if(x<rare+.37)return'u';return'c'}
function rollCard(kind,ex,ch){ex=ex||[];ch=ch||(isParty()?pick(G.chs):G.ch);for(let k=0;k<60;k++){const r=rollRarity(kind);const ids=Object.keys(CARDS).filter(id=>CARDS[id].ch===ch&&CARDS[id].r===r&&!ex.includes(id)&&(!CARDS[id].pk||isParty()));if(ids.length)return pick(ids)}return ch==='w'?'cleave':ch==='m'?'arcane':'pierce'}
function rollCards(kind){const a=[];const chs=isParty()?shuffle(G.chs.slice()):[G.ch];for(let i=0;i<3;i++)a.push(rollCard(kind,a,chs[i%chs.length]));return a}
function randomRelic(){const pool=Object.keys(REL).filter(k=>REL[k].r==='c'&&!G.relics.includes(k));return pool.length?pick(pool):null}
function gainRelic(id){if(!id)return;G.relics.push(id);MFX.enqueue(MFX.strip(REL[id].e+' '+REL[id].n,'#ffd27a','獲 得 遺 物',{dur:1.6,y:.095}));if(REL[id].pick){if(isParty()&&PER_HERO.includes(id))eachHero(()=>REL[id].pick());else REL[id].pick()}sfx('relic')}
function gainRandomRelic(){const r=randomRelic();if(r)gainRelic(r);return r}
function upRandom(type,n){const idx=shuffle(G.deck.map((c,i)=>i).filter(i=>canUp(G.deck[i])&&(!type||CARDS[G.deck[i].id].t===type))).slice(0,n);idx.forEach(i=>G.deck[i].up=true);return idx.map(i=>cardName(G.deck[i]))}
function makeReward(kind){const items=[{t:'gold',v:kind==='boss'?rnd(95,105):kind==='elite'?rnd(25,35):rnd(10,20)}];
  if(Math.random()<(kind==='normal'?.4:.65))items.push({t:'pot',id:pick(potKeys())});
  if(kind==='elite'){const r=randomRelic();if(r)items.push({t:'relic',id:r})}
  items.push({t:'card',cards:rollCards(kind)});if(isParty()&&kind!=='normal')items.push({t:'card',cards:rollCards(kind)});G.rew={kind,items}}
function rewardHTML(){const it=G.rew.items;return`${topbar()}<div class="center"><div class="bigemo">🏆</div><h2 style="margin:0">戰鬥勝利！</h2><div class="panel">${it.map((x,i)=>{
  let s='';if(x.t==='gold')s=`💰 ${x.v} 金幣`;else if(x.t==='pot')s=`${POT[x.id].e} ${POT[x.id].n}<br><small>${POT[x.id].d}</small>`;else if(x.t==='relic')s=`${REL[x.id].e} ${REL[x.id].n}<br><small>${REL[x.id].d}</small>`;else s='🃏 將一張卡牌加入牌組';
  return`<button class="btn ritem" onclick="claim(${i})">${s}</button>`}).join('')||'<p>已領取全部獎勵</p>'}</div><button class="btn big" onclick="rewardLeave()">繼續 ▶</button></div>`}
function claim(i){const x=G.rew.items[i];if(!x)return;
  if(x.t==='gold'){G.gold+=x.v;sfx('coin');G.rew.items.splice(i,1)}
  else if(x.t==='pot'){if(!givePotion(x.id)){toast('藥水欄已滿（可點上方藥水丟棄）');return}G.rew.items.splice(i,1)}
  else if(x.t==='relic'){gainRelic(x.id);G.rew.items.splice(i,1)}
  else if(x.t==='card'){cardChoice(x.cards,'選擇一張卡牌加入牌組',id=>{if(id){G.deck.push({id,up:false});sfx('card');G.rew.items.splice(G.rew.items.indexOf(x),1)}render()});return}
  render()}
function rewardLeave(){const it=G.rew.items;if(!it.length){rewardDone();return}
  const names=it.map(x=>x.t==='gold'?`💰 ${x.v} 金幣`:x.t==='pot'?`${POT[x.id].e} ${POT[x.id].n}`:x.t==='relic'?`${REL[x.id].e} ${REL[x.id].n}`:'🃏 卡牌獎勵').join('<br>');
  sfx('err');modal(`<div class="pmenu"><div class="bigemo" style="font-size:56px">🎁</div><h3 style="margin:6px 0">還有戰利品沒拿！</h3><p style="line-height:1.8">${names}</p><p style="font-weight:bold">確定要放棄這些戰利品並離開嗎？</p><div class="row"><button class="btn gray" onclick="closeModal();rewardDone()">放棄並離開</button><button class="btn" onclick="closeModal()">回去領取</button></div></div>`)}
function rewardDone(){const k=G.rew.kind;G.rew=null;if(k==='boss'){const pool=shuffle(Object.keys(REL).filter(r=>REL[r].r==='b'&&!G.relics.includes(r))).slice(0,3);G.bossRel=pool;G.screen='bossrel';render()}else nodeDone()}
function bossRelHTML(){return`${topbar()}<div class="center"><div class="bigemo">${POOLS[G.act].bossE}</div><h2 style="margin:0">首領被擊敗了！</h2><p>選擇一件首領遺物</p><div class="panel">${G.bossRel.map(r=>`<button class="btn ritem" onclick="pickBossRel('${r}')">${REL[r].e} ${REL[r].n}<br><small>${REL[r].d}</small></button>`).join('')}</div><button class="btn gray" onclick="pickBossRel(null)">跳過</button></div>`}
function pickBossRel(r){if(r)gainRelic(r);if(G.act===1){G.act=2;G.map=genMap();G.path=[];G.fights=0;G.lastFight=null;if(isParty()){G.party.forEach(h=>{h.down=false;h.hp=h.maxHp});lead()}else G.p.hp=G.p.maxHp;nodeDone();setTimeout(()=>MFX.play(MFX.intro('腐化深淵','第 二 幕','👑','#b48cff')),150)}else{G.screen='victory';clearSave();sfx('win');render();MFX.play(MFX.victory('登頂成功！',true))}}

// ================= 營火 / 寶箱 / 商店 / 事件 =================
function restHTML(){const h=Math.floor(G.p.maxHp*diffD().rest);const dn=isParty()&&G.party.some(x=>x.down);return`${topbar()}<div class="center"><div class="bigemo">🔥</div><h2 style="margin:0">營火</h2><p class="sub">溫暖的火光讓你暫時忘記了恐懼。</p><div class="row">
  <button class="btn big" ${hasRelic('core')?'disabled':''} onclick="restHeal()">😴 休息<br><small>${isParty()?'全隊回復 '+Math.round(diffD().rest*100)+'% 生命'+(dn?'<br>並救起倒下的隊友':''):'回復 '+h+' 生命'}</small></button>
  <button class="btn big" ${G.deck.some(canUp)?'':'disabled'} onclick="restSmith()">⚒️ 鍛造<br><small>升級一張牌</small></button></div></div>`}
function restHeal(){const rr=diffD().rest;if(isParty()){G.party.forEach(h=>{if(h.down)reviveHero(h,rr);else h.hp=Math.min(h.maxHp,h.hp+Math.floor(h.maxHp*rr))});lead()}else{heal(G.p,Math.floor(G.p.maxHp*rr));G.p.hp=Math.min(G.p.hp,G.p.maxHp)}sfx('heal');nodeDone()}
function restSmith(){selectCard('選擇要升級的卡牌（顯示升級後）',c=>canUp(c),i=>{G.deck[i].up=true;sfx('upgrade');toast(`「${cardName(G.deck[i])}」升級了！`);nodeDone()},true,()=>{})}
function treasureHTML(){return`${topbar()}<div class="center"><div class="bigemo">${G.chest.opened?'📭':'🧰'}</div><h2 style="margin:0">寶箱</h2>${G.chest.opened?`<p>${G.chest.msg}</p><button class="btn big" onclick="nodeDone()">繼續 ▶</button>`:`<button class="btn big" onclick="openChest()">打開寶箱</button>`}</div>`}
function openChest(){const g=rnd(25,45);G.gold+=g;const r=gainRandomRelic();G.chest={opened:true,msg:(r?`你獲得了 ${REL[r].e} <b>${REL[r].n}</b>：${REL[r].d}<br>`:'')+`以及 💰 ${g} 金幣！`};sfx('coin');render()}
function genShop(){const cards=[];const ex=[];for(let k=0;k<5;k++){const id=rollCard('shop',ex);ex.push(id);const r=CARDS[id].r;const base=r==='r'?rnd(135,165):r==='u'?rnd(68,82):rnd(45,55);cards.push({id,price:base,sold:false})}
  const s=rnd(0,4);cards[s].price=Math.floor(cards[s].price/2);cards[s].sale=true;
  const rels=shuffle(Object.keys(REL).filter(k=>REL[k].r==='c'&&!G.relics.includes(k))).slice(0,2).map(id=>({id,price:rnd(140,180),sold:false}));
  const pots=[0,1,2].map(()=>({id:pick(potKeys()),price:rnd(48,72),sold:false}));
  G.shop={cards,rels,pots,remove:75+25*G.removes,removed:false}}
function shopHTML(){const S=G.shop,pc=(p,sale)=>`<span class="price ${G.gold<p?'no':sale?'sale':''}">💰${p}${sale?' 特價':''}</span>`;
  return`${topbar()}<div class="center" style="justify-content:flex-start"><h2 style="margin:4px">💰 商店</h2><p class="sub" style="margin:0">「隨便看看，便宜賣啦～」</p>
  <div class="shopgrid">${S.cards.map((c,i)=>`<div class="sitem ${c.sold?'sold':''}" onclick="buy('card',${i})">${cardHTML({id:c.id,up:false})}${pc(c.price,c.sale)}</div>`).join('')}</div>
  <div class="shopgrid">${S.rels.map((r,i)=>`<div class="sitem ${r.sold?'sold':''}" onclick="buy('rel',${i})"><div class="relbox">${REL[r.id].e}<small>${REL[r.id].n}</small></div>${pc(r.price)}</div>`).join('')}
  ${S.pots.map((p,i)=>`<div class="sitem ${p.sold?'sold':''}" onclick="buy('pot',${i})"><div class="relbox">${POT[p.id].e}<small>${POT[p.id].n}</small></div>${pc(p.price)}</div>`).join('')}
  <div class="sitem ${S.removed?'sold':''}" onclick="buy('rm',0)"><div class="relbox">🗑️<small>移除卡牌</small></div>${pc(S.remove)}</div></div>
  <button class="btn big" onclick="nodeDone()">離開商店 ▶</button></div>`}
function buy(type,i){const S=G.shop;
  const item=type==='card'?S.cards[i]:type==='rel'?S.rels[i]:type==='pot'?S.pots[i]:null;
  if(type==='rm'){if(S.removed)return;shopConfirm('🗑️','移除卡牌','從你的牌組中永久移除一張卡牌。購買後會讓你選擇要移除哪一張。',S.remove,()=>selectCard('選擇要移除的卡牌',()=>true,k=>{G.gold-=S.remove;toast(`移除了「${cardName(G.deck[k])}」`);G.deck.splice(k,1);G.removes++;S.removed=true;sfx('coin');render()},false,()=>{}));return}
  if(!item||item.sold)return;
  if(type==='card'){showInfoCard(item.id,item.price,()=>{if(G.gold<item.price){toast('金幣不足');sfx('err');return}G.gold-=item.price;item.sold=true;G.deck.push({id:item.id,up:false});sfx('coin');render()});return}
  const D=type==='rel'?REL[item.id]:POT[item.id];
  shopConfirm(D.e,D.n,(type==='rel'?'【遺物】':'【藥水】')+D.d,item.price,()=>{
    if(type==='rel'){G.gold-=item.price;item.sold=true;gainRelic(item.id)}
    else{if(G.potions.indexOf(null)<0){toast('藥水欄已滿（可點上方藥水丟棄）');sfx('err');return}G.gold-=item.price;item.sold=true;givePotion(item.id)}
    sfx('coin');render()})}
function shopConfirm(icon,name,desc,price,onBuy){const poor=G.gold<price;
  modal(`<div class="pmenu"><div class="bigemo" style="font-size:64px">${icon}</div><h3 style="margin:6px 0">${name}</h3><p style="line-height:1.6">${desc}</p><p>價格：<span class="price ${poor?'no':''}">💰${price}</span>　你有 💰${G.gold}</p><p style="font-weight:bold">${poor?'金幣不足，無法購買。':'確定要購買嗎？'}</p><div class="row"><button class="btn" id="mbuy" ${poor?'disabled':''}>確定購買</button><button class="btn gray" onclick="closeModal()">取消</button></div></div>`);
  $('#mbuy').onclick=()=>{closeModal();if(G.gold<price){toast('金幣不足');sfx('err');return}onBuy()}}
function showInfoCard(id,price,onBuy){modal(`<div style="margin:auto;text-align:center"><div style="--cw:150px;display:inline-block">${cardHTML({id,up:false})}</div><p style="font-size:13px;opacity:.8">升級後：</p><div style="--cw:110px;display:inline-block">${cardHTML({id,up:true})}</div><p style="font-weight:bold">${G.gold<price?'金幣不足，無法購買。':`確定要花 💰${price} 購買嗎？（你有 💰${G.gold}）`}</p><div class="row" style="margin-top:8px"><button class="btn" id="mbuy" ${G.gold<price?'disabled':''}>確定購買</button><button class="btn gray" onclick="closeModal()">取消</button></div></div>`);
  $('#mbuy').onclick=()=>{closeModal();onBuy()}}
function startEvent(){const keys=Object.keys(EVENTS).filter(k=>!(G.seenEv||[]).includes(k));const k=pick(keys.length?keys:Object.keys(EVENTS));G.seenEv=(G.seenEv||[]).concat(k);G.ev={id:k,res:null};G.screen='event';render()}

  return`${topbar()}<div class="center"><div class="bigemo">${E.e}</div><h2 style="margin:0">${E.t}</h2><div class="panel"><p style="line-height:1.7;margin-top:0">${G.ev.res==null?E.txt:G.ev.res}</p>
  ${G.ev.res==null?opts.map((o,i)=>`<button class="btn opt" ${o.dis?'disabled':''} onclick="evOpt(${i})">${o.l}</button>`).join(''):`<button class="btn opt" style="text-align:center" onclick="nodeDone()">繼續 ▶</button>`}</div></div>`}

function titleHTML(){const sv=hasSave();let svInfo='';try{const o=JSON.parse(localStorage.getItem(SAVE_KEY));if(o)svInfo=(o.mode==='party'?`（${PMODE[o.size].n}・`:`（${CHARS[o.ch].n}・`)+(o.diff?DIFFS[o.diff].n+'・':'')+`第${o.act}幕${o.floor}層）`}catch(e){}return`<div class="center"><div class="bigemo" style="font-size:96px">🗼</div><h1 class="title">深淵尖塔</h1><p class="sub">卡牌構築 × Roguelike 爬塔冒險　v1.9</p>

function charselHTML(){return`<div class="center"><h2>選擇你的角色</h2>${diffPicker()}<div class="chars">${Object.keys(CHARS).map(k=>{const c=CHARS[k];return`<div class="charc" onclick="newGame('${k}')"><div class="bigemo">${heroIcon(k)}</div><h3 style="margin:4px;color:${c.col}">${c.n}</h3><div style="font-size:13px;line-height:1.6">${c.desc}</div><p style="font-size:13px;margin:6px 0">❤️ ${c.hp}　${REL[c.relic].e} ${REL[c.relic].n}</p><div class="mech"><b>職業機制</b>${c.mech.map(m=>`<div>${m}</div>`).join('')}</div><button class="btn" style="margin-top:8px;width:100%">選擇${c.n}</button></div>`}).join('')}</div><button class="btn gray" onclick="SCR='title';render()">返回</button></div>`}
let PSEL=[];

const MFX=(function(){

  const x=c.getContext('2d');let list=[],queue=[],W=innerWidth,H=innerHeight,DPR=Math.min(2,devicePixelRatio||1);
  const cl=v=>Math.min(1,Math.max(0,v)),eo=t=>1-Math.pow(1-cl(t),3),eio=t=>{t=cl(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
  const bk=t=>{t=cl(t);const s=1.9;return 1+(s+1)*Math.pow(t-1,3)+s*Math.pow(t-1,2)};
  const el=t=>{t=cl(t);return t===0||t===1?t:Math.pow(2,-10*t)*Math.sin((t*10-.75)*2.094)+1};
  const FONT='"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif';
  function fit(){W=innerWidth;H=innerHeight;DPR=Math.min(2,devicePixelRatio||1);c.width=W*DPR;c.height=H*DPR}
  fit();addEventListener('resize',()=>setTimeout(fit,30));
  function kin(str,cx,cy,size,t0,T,col,o={}){
    x.font=`900 ${size}px ${FONT}`;const chars=[...str],ws=chars.map(ch=>x.measureText(ch).width),tot=ws.reduce((a,b)=>a+b,0);let px=cx-tot/2;
    chars.forEach((ch,i)=>{const lt=(T-t0-i*(o.stag||.06))/(o.dur||.45),k=(o.ease||bk)(lt);
      x.save();x.globalAlpha=cl(lt*3)*(o.alpha===undefined?1:o.alpha);x.translate(px+ws[i]/2,cy+(1-k)*size*(o.drop===undefined?.7:o.drop));
      if(o.rot)x.rotate((1-k)*o.rot*(i%2?1:-1));x.scale(k,k);x.textAlign='center';x.textBaseline='middle';
      if(o.glow){x.shadowColor=o.glow;x.shadowBlur=size*.4}
      if(o.stroke){x.lineWidth=size*.14;x.lineJoin='round';x.strokeStyle=o.stroke;x.strokeText(ch,0,0)}
      x.fillStyle=col;x.fillText(ch,0,0);x.restore();px+=ws[i]});return tot}

<script>
/* ===== v1.6 GSAP 動畫層 =====

(function(){

  c.style.cssText=`position:absolute;left:${r.left+r.width/2-w/2}px;top:${r.top+r.height/2-h/2}px;width:${w}px;height:${h}px;margin:0;transition:none;transform:none;animation:none;z-index:160;pointer-events:none;${extraCss}`;

const _render=render;

    const items=app.querySelectorAll('.center>*');
    if(items.length)g.from(items,{y:18,opacity:0,duration:.35,stagger:.05,ease:'power2.out',clearProps:'transform,opacity'});
  }
  if(!(G&&C&&scr==='combat')){lastC=null;prevHand=new Set();return}

    lastC=C;prevHand=new Set();hpPrev.clear();GH.clear();lastE=null;

  const now=new Set();let k=0;
  handEls().forEach(el=>{const c=C.hand[+el.dataset.i];if(!c)return;const u=String(c.uid);el.dataset.u=u;now.add(u);
    if(!prevHand.has(u)){
      if(!pc)return;const ec=center(el);el.style.transition='none';
      g.fromTo(el,{x:pc.x-ec.x,y:pc.y-ec.y,scale:.25,rotation:-30,opacity:0},{x:0,y:0,scale:1,rotation:0,opacity:1,duration:.42,delay:k++*.07,ease:'back.out(1.3)',clearProps:'transform,opacity,transition'});

    }});

  document.querySelectorAll('#app .cr').forEach(cr=>{const u=cr.id.slice(3);const sp=cr.querySelector('.hpbar span'),fill=cr.querySelector('.hpfill');if(!sp||!fill)return;

const _end=endTurn;
endTurn=function(){
  const clones=(C&&!C.busy&&!C.over)?handEls().map(el=>cloneEl(el)):[];
  const p=_end.apply(this,arguments);
  const dp=document.querySelectorAll('.hudrow .pile')[1];const dc=dp?center(dp):null;
  clones.forEach((c,i)=>{if(!dc||(C&&C.hand.some(x=>String(x.uid)===c.dataset.u))){c.remove();return}const cc=center(c);
    g.to(c,{x:dc.x-cc.x,y:dc.y-cc.y,scale:.12,rotation:35,opacity:.3,duration:.38,delay:i*.04,ease:'power2.in',onComplete:()=>c.remove()})});
  return p;
};

// ---- 敵人倒下 ----
const _die=die;
die=function(e){
  let c=null;if(e&&!e.dead&&!e.isP){const el=document.getElementById('cr-'+e.uid);const av=el&&el.querySelector('.avatar');if(av)c=cloneEl(av,'display:flex;align-items:center;justify-content:center;')}
  const r=_die.apply(this,arguments);
  if(c)g.timeline({onComplete:()=>c.remove()}).to(c,{filter:'brightness(3)',duration:.08}).to(c,{y:'+=30',rotation:-18,scale:'*=.6',opacity:0,filter:'grayscale(1) brightness(.4)',duration:.65,ease:'power2.in'});
  return r;
};

// ---- 傷害數字：彈出再飄走，傷害越高字越大 ----
const _float=floatTxt;
floatTxt=function(cr,txt,cls){
  const before=FX.lastElementChild;const r=_float.apply(this,arguments);const f=FX.lastElementChild;
  if(!f||f===before||!f.classList.contains('float'))return r;
  f.style.animation='none';const num=parseInt(String(txt).replace(/[^\d]/g,''))||0;
  const s=(cls==='f-dmg'||cls==='f-psn')?Math.min(1.9,1+num/35):1;
  g.timeline()
    .fromTo(f,{xPercent:-50,yPercent:-50,x:0,y:0,scale:.3,opacity:0},{scale:s*1.4,opacity:1,duration:.13,ease:'power2.out'})
    .to(f,{scale:s,duration:.12,ease:'power1.inOut'})
    .to(f,{y:-62,x:Math.random()*44-22,opacity:0,duration:.7,ease:'power1.in'},'+=.12');
  return r;
};

// 橫幅與連招演出由 MFX（canvas）負責，這裡不另外包裝
})();
