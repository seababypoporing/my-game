.panel{background:#1a1422dd;border:2px solid #5a4a6a;border-radius:14px;padding:14px;max-width:520px;width:100%}

/* modal */
#modal{position:fixed;inset:0;background:#000d;z-index:200;display:none;flex-direction:column;align-items:center;padding:16px 10px 40px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y}
#mclose{position:fixed;top:max(10px,env(safe-area-inset-top));right:10px;z-index:210;width:44px;height:44px;border-radius:50%;background:#3a2614;border:2px solid #c9a25a;color:#ffe9c2;font-size:22px;display:none;cursor:pointer}

.tc.tA{border-color:#c0503f}.tc.tS{border-color:#3f9a63}.tc.tP{border-color:#d2a33a}

@keyframes cglow{from{box-shadow:0 0 6px #ffd24a,0 4px 10px #000a}to{box-shadow:0 0 20px #ffd24a,0 0 6px #fff8,0 4px 10px #000a}}
.ctag{position:absolute;top:-14px;right:-4px;background:linear-gradient(#ffe27a,#d48a1a);color:#3a1a00;font-size:calc(var(--cw)*.085);font-weight:900;padding:1px 5px;border-radius:8px;white-space:nowrap;z-index:3;box-shadow:0 2px 4px #000a}
.banner.cbn{top:26%;color:#ffe066;font-size:30px;text-shadow:0 0 12px #ff9a2a,0 2px 3px #000;letter-spacing:3px}

<body>
<div id="app"></div>
<div id="fx"></div>
<div id="modal"></div>
<button id="mclose" onclick="modalX()">✕</button>
<div id="toast"></div>
<script>
'use strict';
// ================= 工具 =================
const $=s=>document.querySelector(s);
const app=$('#app'), FX=$('#fx'), MODAL=$('#modal');
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const SAVE_KEY='abyss_spire_save_v1';
let UID=0;

// ================= 音訊（哥德管風琴 / 戰鼓風格，與其他遊戲不同） =================
const AU={ctx:null,on:true,mode:null,song:null,step:0,next:0,pending:null};
try{AU.on=localStorage.getItem('abyss_music')!=='0'}catch(e){}
function auInit(){
  if(AU.ctx){if(AU.ctx.state==='suspended')AU.ctx.resume();return}
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC)return;
  const c=new AC(); AU.ctx=c;
  AU.master=c.createGain(); AU.master.gain.value=.85; AU.master.connect(c.destination);
  AU.musicG=c.createGain(); AU.musicG.gain.value=AU.on?.32:0; AU.musicG.connect(AU.master);
  AU.sfxG=c.createGain(); AU.sfxG.gain.value=.6; AU.sfxG.connect(AU.master);
  const conv=c.createConvolver(); const len=Math.floor(c.sampleRate*2.6); const buf=c.createBuffer(2,len,c.sampleRate);
  for(let ch=0;ch<2;ch++){const d=buf.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6)}
  conv.buffer=buf; AU.rev=c.createGain(); AU.rev.gain.value=.42; AU.rev.connect(conv); conv.connect(AU.musicG);
  AU.mbus=c.createGain(); AU.mbus.connect(AU.musicG); AU.mbus.connect(AU.rev);
  const nb=c.createBuffer(1,c.sampleRate,c.sampleRate); const nd=nb.getChannelData(0); for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1; AU.nbuf=nb;
  setInterval(schedule,25);
  if(AU.pending){const p=AU.pending;AU.pending=null;AU.mode=null;playMusic(p)}
}
const mtof=m=>440*Math.pow(2,(m-69)/12);
function nOsc(type,f,t,dur,vol,o={}){
  const c=AU.ctx,a=o.a||.008,os=c.createOscillator(); os.type=type; os.frequency.setValueAtTime(f,t); if(o.det)os.detune.value=o.det;
  const g=c.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+a); g.gain.exponentialRampToValueAtTime(.0001,t+a+dur);
  let n=os; if(o.filt){const fl=c.createBiquadFilter(); fl.type=o.ft||'lowpass'; fl.frequency.value=o.filt; fl.Q.value=o.q||1; os.connect(fl); n=fl}
  n.connect(g); g.connect(o.dest||AU.mbus); os.start(t); os.stop(t+a+dur+.05);
}
function organ(ms,t,d,v){ms.forEach(m=>{const f=mtof(m);nOsc('sawtooth',f,t,d,v,{a:.35,filt:850,det:-6});nOsc('sawtooth',f,t,d,v,{a:.35,filt:850,det:6});nOsc('sine',f/2,t,d,v*1.2,{a:.35})})}
function harpsi(m,t,v){nOsc('sawtooth',mtof(m),t,.45,v,{a:.002,filt:3200});nOsc('square',mtof(m)*2,t,.12,v*.3,{a:.002,filt:4000})}
function bassN(m,t,d,v){nOsc('sawtooth',mtof(m),t,d,v,{a:.005,filt:330,q:6})}
function flute(m,t,d,v){nOsc('sine',mtof(m),t,d,v,{a:.07});nOsc('triangle',mtof(m)*2,t,d*.8,v*.15,{a:.09})}
function bell(m,t,v){[1,2.76,5.4,8.9].forEach((r,i)=>nOsc('sine',mtof(m)*r,t,3/(i+1),v/(i+1.3),{a:.002}))}
function choir(ms,t,d,v){ms.forEach(m=>{[-9,0,9].forEach(det=>{nOsc('sawtooth',mtof(m),t,d,v,{a:.6,filt:780,ft:'bandpass',q:2.5,det});})})}
function brass(m,t,d,v){nOsc('sawtooth',mtof(m),t,d,v,{a:.06,filt:1300,q:2});nOsc('sawtooth',mtof(m),t,d,v*.6,{a:.06,filt:1300,det:8})}
function kick(t,v){const c=AU.ctx,o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(38,t+.16);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+.35);o.connect(g);g.connect(AU.musicG);o.start(t);o.stop(t+.4)}
function tom(t,f,v){const c=AU.ctx,o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*.55,t+.3);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+.4);o.connect(g);g.connect(AU.mbus);o.start(t);o.stop(t+.45)}
function mnoise(t,d,v,type,f,dest){const c=AU.ctx,s=c.createBufferSource();s.buffer=AU.nbuf;const fl=c.createBiquadFilter();fl.type=type;fl.frequency.value=f;const g=c.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl);fl.connect(g);g.connect(dest||AU.mbus);s.start(t);s.stop(t+d+.05)}

const CHN={all:'通用',w:'鐵衛',a:'影刃',m:'魔女'};
function matchP(e,p){if(p==='A'||p==='S'||p==='P')return e.t===p;if(p==='0')return e.z;if(p==='ST'||p==='FN')return CARDS[e.id].kw===(p==='ST'?'st':'fn');if(Array.isArray(p))return p.includes(e.id);return e.id===p}
function seqEntry(card){return{id:card.id,t:CARDS[card.id].t,z:costOf(card)===0}}
function matchCombos(card){if(!C||!C.seq)return[];const seq=C.seq.concat([seqEntry(card)]);
  return COMBOS.filter(cb=>(cb.ch==='all'||cb.ch===G.ch)&&!C.comboUsed[cb.id]&&seq.length>=cb.pat.length&&cb.pat.every((p,i)=>matchP(seq[seq.length-cb.pat.length+i],p)))}
let CODEX={};try{CODEX=JSON.parse(localStorage.getItem('abyss_combo_codex')||'{}')}catch(e){}
function unlockCombo(cb){if(CODEX[cb.id])return;CODEX[cb.id]=1;try{localStorage.setItem('abyss_combo_codex',JSON.stringify(CODEX))}catch(e){}setTimeout(()=>toast(`📖 新連招解鎖：<b>${cb.n}</b><br>${cb.seq}：${cb.d}`),900)}
function addStance(n){const c=G.p.st.stance||0;G.p.st.stance=Math.min(3,c+n);floatTxt(G.p,'⚜️架勢 '+G.p.st.stance,'f-buff');sfx('buff')}
function useStance(){const k=G.p.st.stance||0;if(k){delete G.p.st.stance;floatTxt(G.p,`⚜️×${k} 終結！`,'f-buff')}return k}

// ================= 全域狀態 =================
let G=null,C=null,SCR='title',DR=null;
function hasRelic(id){return G.relics.includes(id)}
function alive(){return C?C.enemies.filter(e=>!e.dead):[]}
function costOf(card){const c=CARDS[card.id].c;return Array.isArray(c)?c[card.up?1:0]:c}
function exh(card){const x=CARDS[card.id].ex;return Array.isArray(x)?x[card.up?1:0]:!!x}
function canUp(c){return !c.up&&CARDS[c.id].t!=='X'}
function cardName(c){return CARDS[c.id].n+(c.up?'+':'')}
function baseE(){return 3+(hasRelic('core')?1:0)+(hasRelic('sage')?1:0)}

// ================= 戰鬥引擎 =================
function apply(t,k,n,silent){
  if(!t||t.dead||!n)return; if(!t.isP&&(k==='burn'||k==='frz')&&n>0&&G.p.st.amp)n+=G.p.st.amp; t.st[k]=(t.st[k]||0)+n; if(t.st[k]===0)delete t.st[k];
  if(!silent){const s=STS[k]||{i:'',n:k};const bad=s.deb||n<0;floatTxt(t,`${s.i}${s.n}${n>0?'+':''}${n}`,bad?'f-deb':'f-buff');sfx(k==='poison'?'poison':k==='frz'?'ice':k==='burn'?'fire':bad?'debuff':'buff')}
  if(k==='frz'&&!t.isP&&t.st.frz>=(t.def.boss?5:3))freezeNow(t);
}
function freezeNow(e){if(!e||e.dead)return;delete e.st.frz;e.move={id:'frozen',k:'frozen',label:'被冰封了'};floatTxt(e,'❄️ 冰封！','f-blk');sfx('ice')}
function randAlive(){const a=alive();return a.length?pick(a):null}
function applyAll(k,n){alive().forEach(e=>apply(e,k,n))}
function dmgCalc(src,tgt,base){let d=base+(src?(src.st.str||0):0);if(src&&src.st.weak)d*=.75;if(tgt.st.vuln)d*=1.5;if(src&&src.isP&&C&&C.mod)d*=C.mod.dmgMul;d=Math.max(0,Math.floor(d));if(tgt.st.intan)d=Math.min(d,1);return d}
function deal(tgt,d,src){
  if(!tgt||tgt.dead)return 0; if(tgt.st.intan)d=Math.min(d,1);
  const b=(src&&src.isP&&C&&C.mod&&C.mod.pierce)?0:Math.min(tgt.block,d); tgt.block-=b; const un=d-b; tgt.hp-=un; tgt.hitAt=performance.now();
  if(un>0){floatTxt(tgt,'-'+un,'f-dmg');sfx(un>=18?'heavy':'hit');if(tgt.isP&&un>=10)shake()}else{floatTxt(tgt,'格擋','f-blk');sfx('block')}
  if(tgt.isP){if(tgt.hp<0)tgt.hp=0;if(src&&!src.isP&&!src.dead&&tgt.st.thorns)deal(src,tgt.st.thorns,null)}
  else{if(tgt.hp<=0)die(tgt);else if(tgt.def.hurt)tgt.def.hurt(tgt,un)}
  return un;
}
function hit(src,tgt,base){return deal(tgt,dmgCalc(src,tgt,base),src)}
function atk(t,n,times=1){let tot=0;G.p.actAt=performance.now();for(let i=0;i<times;i++){if(!t||t.dead)break;const un=hit(G.p,t,n);tot+=un;if(un>0&&G.p.st.envenom)apply(t,'poison',G.p.st.envenom)}return tot}
function atkAll(n,times=1){let tot=0;G.p.actAt=performance.now();for(let i=0;i<times;i++)for(const e of alive()){const un=hit(G.p,e,n);tot+=un;if(un>0&&G.p.st.envenom)apply(e,'poison',G.p.st.envenom)}return tot}
function blk(n,t){t=t||G.p;let v=n;if(t.isP){v+=t.st.dex||0;if(t.st.frail)v=Math.floor(v*.75)}v=Math.max(0,v);t.block+=v;if(v>0){floatTxt(t,'🛡+'+v,'f-blk');sfx('block2')}}
function loseHp(t,n){if(!n||t.dead)return;t.hp-=n;t.hitAt=performance.now();floatTxt(t,'-'+n,'f-psn');sfx('hit');if(t.isP){if(t.hp<0)t.hp=0}else{if(t.hp<=0)die(t);else if(t.def.hurt)t.def.hurt(t,n)}}
function heal(t,n){if(!t||t.dead||!n||n<=0)return;const v=Math.min(n,t.maxHp-t.hp);if(v<=0)return;t.hp+=v;floatTxt(t,'+'+v,'f-heal');sfx('heal')}
function die(e){e.dead=true;e.hp=0;floatTxt(e,'擊敗！','f-buff');sfx('die');if(e.def.death)e.def.death(e)}
function gainE(n){C.energy+=n;floatTxt(G.p,'⚡+'+n,'f-buff');sfx('buff')}
function draw(n){let d=0;for(let i=0;i<n;i++){if(C.hand.length>=10){toast('手牌已滿！');break}if(!C.draw.length){if(!C.discard.length)break;C.draw=shuffle(C.discard);C.discard=[];sfx('shuffle')}C.hand.push(C.draw.pop());d++}if(d)sfx('draw')}
function addCards(id,n,pile){for(let i=0;i<n;i++){const c={id,up:false,uid:++UID};if(pile==='hand'&&C.hand.length<10)C.hand.push(c);else if(pile==='draw')C.draw.splice(rnd(0,C.draw.length),0,c);else C.discard.push(c)}}
function splitInto(e,id){const hp=e.hp;e.dead=true;e.splitDone=true;floatTxt(e,'分裂！','f-buff');sfx('die');const at=C.enemies.indexOf(e);
  const a=mkEnemy(id,at,hp),b=mkEnemy(id,at+1,hp);[a,b].forEach(x=>{x.move=x.def.ai(x);x.fresh=true});C.enemies.splice(at+1,0,a,b)}
function mkEnemy(id,i,hp){const d=EN[id];const h=hp||rnd(d.hp[0],d.hp[1]);const e={id,def:d,name:d.n,emo:d.e,hp:h,maxHp:h,block:0,st:{},t:0,idx:i,uid:'e'+(++UID)};if(d.init)d.init(e);return e}
function dec(c){['vuln','weak','frail'].forEach(k=>{if(c.st[k]){c.st[k]--;if(!c.st[k])delete c.st[k]}})}

function startCombat(ids,kind){
  G.p.block=0;G.p.st={};
  C={enemies:[],draw:shuffle(G.deck.map(c=>({id:c.id,up:c.up,uid:++UID}))),hand:[],discard:[],exhaust:[],energy:0,turn:0,kind,busy:true,sel:null,potSel:null,atkCount:0,over:false};
  ids.forEach((id,i)=>C.enemies.push(mkEnemy(id,i)));
  if(hasRelic('sage'))C.enemies.forEach(e=>apply(e,'str',1,true));
  G.relics.forEach(r=>REL[r].start&&REL[r].start());
  C.enemies.forEach(e=>e.move=e.def.ai(e));
  G.screen='combat';playMusic(kind==='boss'?'boss':'combat');render();
  banner(kind==='boss'?'首領戰！':kind==='elite'?'菁英戰鬥':'戰鬥開始');
  setTimeout(startPlayerTurn,700);
}
async function startPlayerTurn(){
  if(!C||C.over)return; C.turn++; const p=G.p;
  if(!p.st.barricade&&C.turn>1)p.block=0;
  if(p.st.intan){p.st.intan--;if(!p.st.intan)delete p.st.intan}
  if(p.st.poison){loseHp(p,p.st.poison);p.st.poison--;if(!p.st.poison)delete p.st.poison;render();if(checkEnd())return}
  C.energy=baseE()+(C.turn===1&&hasRelic('lantern')?1:0);C.atkCount=0;C.seq=[];C.comboUsed={};C.shivPoison=false;
  if(p.st.demon)apply(p,'str',p.st.demon);
  if(p.st.infblade)addCards('shiv',p.st.infblade,'hand');
  if(p.st.fumes)applyAll('poison',p.st.fumes);
  if(p.st.affinity){applyAll('burn',p.st.affinity);applyAll('frz',1)}
  draw(5+(G.p.st.insight||0)+(hasRelic('wheel')?1:0)+(C.turn===1&&hasRelic('snakering')?2:0));
  C.busy=false; if(C.turn>1){banner('你的回合');sfx('turn')} render();
}
function playable(card){const d=CARDS[card.id];if(d.unp)return false;const c=costOf(card);return c==='X'||c<=C.energy}
async function playCard(idx,target){
  if(!C||C.busy||C.over)return;const card=C.hand[idx];if(!card)return;const def=CARDS[card.id];
  if(def.unp){toast('這張牌無法打出');sfx('err');render();return}
  const cost=costOf(card),isX=cost==='X';if(!isX&&cost>C.energy){toast('能量不足');sfx('err');render();return}
  if(def.tg==='e'&&(!target||target.dead)){render();return}
  C.busy=true;C.sel=null;C.hand.splice(idx,1);let x=0;if(isX){x=C.energy;C.energy=0}else C.energy-=cost;
  sfx('card');
  const cbs=matchCombos(card);C.mod={dmgMul:1};
  if(cbs.length){comboBanner(cbs.map(c=>'★ '+c.n+'！').join('　'));sfx('combo');cbs.forEach(c=>{C.comboUsed[c.id]=1;unlockCombo(c);if(c.pre)c.pre(target)});await sleep(250);if(!C||!G)return}
  x+=C.mod.extraX||0;
  if(def.t==='S')alive().forEach(e=>{if(e.st.enrage)apply(e,'str',e.st.enrage)});
  try{await def.f(card.up,target,x)}catch(err){console.error(err)}
  if(!C||!G)return;
  C.seq.push(seqEntry(card));
  cbs.forEach(c=>{if(c.post)c.post(target)});C.mod=null;
  if(def.t==='A'){C.atkCount++;if(C.atkCount%3===0){if(hasRelic('kunai'))apply(G.p,'dex',1);if(hasRelic('shuriken'))apply(G.p,'str',1)}}
  if(def.t!=='P'){if(exh(card))C.exhaust.push(card);else C.discard.push(card)}
  C.busy=false;render();checkEnd();
}
function checkEnd(){if(!C||C.over)return true;if(G.p.hp<=0){C.over=true;C.busy=true;setTimeout(gameOver,900);return true}
  if(!alive().length){C.over=true;C.busy=true;setTimeout(winCombat,800);return true}return false}
async function endTurn(){
  if(!C||C.busy||C.over)return;C.busy=true;C.sel=null;C.potSel=null;sfx('end');const p=G.p;
  if(p.st.metal){p.block+=p.st.metal;floatTxt(p,'🛡+'+p.st.metal,'f-blk')}
  const keep=hasRelic('pyramid'),nh=[];
  for(const c of C.hand){const d=CARDS[c.id];if(d.eth)C.exhaust.push(c);else if(keep)nh.push(c);else C.discard.push(c)}
  C.hand=nh;dec(p);render();await sleep(300);banner('敵人回合');await sleep(500);if(!C||C.over)return;
  for(const e of alive()){if(!e.st.barr)e.block=0;if(e.st.poison){loseHp(e,e.st.poison);if(!e.dead){e.st.poison--;if(!e.st.poison)delete e.st.poison}}if(!e.dead&&e.st.burn){const b=e.st.burn;floatTxt(e,'🔥','f-dmg');loseHp(e,b);if(!e.dead){e.st.burn=Math.floor(b/2);if(!e.st.burn)delete e.st.burn}}}
  render();if(checkEnd())return;await sleep(300);if(!C||C.over)return;
  for(const e of [...C.enemies]){if(e.dead||!e.move||e.fresh)continue;e.actAt=performance.now();await enemyAct(e);render();if(checkEnd())return;await sleep(420);if(!C||C.over)return}
  for(const e of alive()){if(e.fresh){delete e.fresh;continue}if(e.st.metal){e.block+=e.st.metal}if(e.st.ritual&&e.t>0)apply(e,'str',e.st.ritual);dec(e);e.t++;e.move=e.def.ai(e)}
  render();await sleep(250);if(checkEnd())return;await startPlayerTurn();
}
async function enemyAct(e){if(!G||!C)return;const m=e.move;e.last=m.id;floatTxt(e,m.label,'f-lbl');
  if(m.d){for(let i=0;i<(m.n||1);i++){if(!G||!C||e.dead||G.p.hp<=0)break;hit(e,G.p,m.d);render();await sleep(170)}}
  if(!G||!C||e.dead||G.p.hp<=0)return;if(m.b){e.block+=m.b;floatTxt(e,'🛡+'+m.b,'f-blk');sfx('block2')}
  if(m.fx)await m.fx(e);
}
function winCombat(){if(!G||!C)return;
  G.relics.forEach(r=>REL[r].win&&REL[r].win());G.p.st={};G.p.block=0;sfx('win');
  const kind=C.kind;makeReward(kind);C=null;G.screen='reward';playMusic('map');render();
}

function targetMode(){if(!C)return false;if(C.potSel!=null)return true;if(C.sel==null)return false;const c=C.hand[C.sel];return c&&CARDS[c.id].tg==='e'}
function setupHand(){const hand=document.getElementById('hand');if(!hand)return;fitHand(hand);
  hand.onpointerdown=ev=>{const el=ev.target.closest('.card');if(!el||!C||C.busy||C.over)return;ev.preventDefault();DR={i:+el.dataset.i,el,x0:ev.clientX,y0:ev.clientY,moved:false}}}
function fitHand(hand){const n=C.hand.length;if(!n)return;const cw=hand.firstElementChild.offsetWidth;const w=hand.clientWidth-14;const gap=n>1&&n*cw+(n-1)*4>w?-((n*cw-w)/(n-1)):4;hand.querySelectorAll('.card').forEach((c,i)=>{c.style.marginLeft=i?gap+'px':'0'})}
function enemyAt(x,y){const el=document.elementFromPoint(x,y);return el?el.closest('.enemy'):null}
window.addEventListener('pointermove',ev=>{if(!DR)return;const dx=ev.clientX-DR.x0,dy=ev.clientY-DR.y0;
  if(!DR.moved&&Math.hypot(dx,dy)>12){DR.moved=true;DR.el.classList.add('dragging');const c=C.hand[DR.i];if(c&&CARDS[c.id].tg==='e')document.querySelector('.field')?.classList.add('tm')}
  if(DR.moved){DR.el.style.transform=`translate(${dx}px,${dy}px) scale(1.1)`;const t=enemyAt(ev.clientX,ev.clientY);document.querySelectorAll('.enemy').forEach(x=>x.classList.toggle('aim',x===t))}});
window.addEventListener('pointerup',ev=>{if(!DR)return;const d=DR;DR=null;if(!C){return}const card=C.hand[d.i];if(!card){render();return}const def=CARDS[card.id];
  if(!d.moved){tapCard(d.i);return}
  const up=d.y0-ev.clientY>70;
  if(def.unp){toast('這張牌無法打出');render();return}
  if(!playable(card)){toast('能量不足');sfx('err');render();return}
  if(def.tg==='e'){const el=enemyAt(ev.clientX,ev.clientY);let t=el?C.enemies[+el.dataset.e]:null;if(!t&&up&&alive().length===1)t=alive()[0];if(t){C.sel=null;playCard(d.i,t)}else{C.sel=null;render()}}
  else{C.sel=null;if(up)playCard(d.i);else render()}});
window.addEventListener('pointercancel',()=>{if(DR){DR=null;render()}});
window.addEventListener('resize',()=>{if(G&&G.screen==='combat'){const h=document.getElementById('hand');if(h)fitHand(h)}});
function tapCard(i){const card=C.hand[i];if(!card)return;const def=CARDS[card.id];C.potSel=null;
  if(C.sel===i){if(def.tg!=='e'){C.sel=null;playCard(i);return}if(alive().length===1){C.sel=null;playCard(i,alive()[0]);return}C.sel=null;render();return}
  if(def.unp){toast('這張牌無法打出');sfx('err');return}
  if(!playable(card)){toast('能量不足');sfx('err');return}
  C.sel=i;sfx('select');render()}
function enemyClick(i){if(!C)return;const e=C.enemies[i];if(!e||e.dead)return;
  if(C.potSel!=null&&!C.busy){usePotion(C.potSel,e);return}
  if(C.sel!=null&&!C.busy){const c=C.hand[C.sel];if(c&&CARDS[c.id].tg==='e'){const s=C.sel;C.sel=null;playCard(s,e);return}}
  const m=e.move;toast(`<b>${e.name}</b>　意圖：${m?m.label:'？'}${e.def.info?'<br>'+e.def.info:''}${stsText(e)}`)}
function playerClick(){toast(`<b>${G.p.name}</b>　❤️ ${G.p.hp}/${G.p.maxHp}　🛡 ${G.p.block}${stsText(G.p)||'<br>沒有任何狀態'}`)}
function stsText(c){const k=Object.keys(c.st);if(!k.length)return'';return'<br>'+k.map(x=>{const s=STS[x]||{i:'',n:x,d:''};return`${s.i}${s.n} ${c.st[x]}：${s.d}`}).join('<br>')}

function givePotion(id){const i=G.potions.indexOf(null);if(i<0)return false;G.potions[i]=id;sfx('potion');return true}
function potClick(i){const id=G.potions[i];if(!id)return;const d=POT[id];const inC=G.screen==='combat'&&C&&!C.over;
  modal(`<div class="pmenu"><div class="bigemo" style="font-size:60px">${d.e}</div><h3>${d.n}</h3><p>${d.d}</p><div class="row">${(inC&&!C.busy)||(!inC&&d.ooc)?`<button class="btn" onclick="closeModal();potUse(${i})">使用</button>`:''}<button class="btn gray" onclick="closeModal();G.potions[${i}]=null;render()">丟棄</button><button class="btn gray" onclick="closeModal()">取消</button></div></div>`)}

function usePotion(i,t){const d=POT[G.potions[i]];if(!d)return;G.potions[i]=null;if(C)C.potSel=null;sfx('potion');d.f(t);if(G.p.hp>G.p.maxHp)G.p.hp=G.p.maxHp;render();if(G.screen==='combat')checkEnd()}

// ================= 地圖 =================
const NODEI={battle:'⚔️',elite:'😈',rest:'🔥',shop:'💰',event:'❓',treasure:'🧰'};
const NODEN={battle:'戰鬥',elite:'菁英',rest:'營火',shop:'商店',event:'未知',treasure:'寶箱'};
function genMap(){const R=15,rows=[];
  for(let r=0;r<R;r++){const n=r===0?3:r===R-1?rnd(2,3):rnd(2,4);const nodes=[];for(let i=0;i<n;i++)nodes.push({i,x:Math.max(10,Math.min(90,(i+.5)/n*100+(Math.random()*12-6))),type:null,next:[]});rows.push(nodes)}
  for(let r=0;r<R-1;r++){const a=rows[r],b=rows[r+1];
    a.forEach((nd,i)=>{const j=a.length===1?0:Math.round(i*(b.length-1)/(a.length-1));nd.next.push(j);if(Math.random()<.35){const j2=j+(Math.random()<.5?-1:1);if(j2>=0&&j2<b.length&&!nd.next.includes(j2))nd.next.push(j2)}});
    b.forEach((nb,j)=>{if(!a.some(nd=>nd.next.includes(j))){let best=0,bd=99;a.forEach((nd,i)=>{const dd=Math.abs(i/Math.max(1,a.length-1)-j/Math.max(1,b.length-1));if(dd<bd){bd=dd;best=i}});a[best].next.push(j)}})}
  rows.forEach((row,r)=>row.forEach(nd=>{
    if(r===0)nd.type='battle';else if(r===R-1)nd.type='rest';else if(r===8)nd.type='treasure';
    else{const x=Math.random();let t;if(x<.45)t='battle';else if(x<.67)t='event';else if(x<.8)t=r>=4?'elite':'battle';else if(x<.91)t=(r>=4&&r!==R-2)?'rest':'event';else t=r>=2?'shop':'battle';nd.type=t}}));
  fixAdjacent(rows);
  if(!rows.some(row=>row.some(n=>n.type==='shop'))){const r=rnd(5,7);pick(rows[r]).type='shop';fixAdjacent(rows)}
  return{rows};
}
// 商店／營火／菁英不會在同一條路線上連續出現
function fixAdjacent(rows){const NO=['shop','rest','elite'];
  for(let r=1;r<rows.length;r++)rows[r].forEach((nd,j)=>{
    const near=t=>rows[r-1].some(pa=>pa.next.includes(j)&&pa.type===t)||(r+1<rows.length&&nd.next.some(k=>rows[r+1][k].type===t&&r+1!==rows.length-1));
    if(NO.includes(nd.type)&&near(nd.type)&&r!==rows.length-1&&r!==8)nd.type=Math.random()<.6?'battle':'event';})
}
function isVis(r,i){return G.path.some(p=>p[0]===r&&p[1]===i)}
function availNodes(){const R=G.map.rows.length;if(!G.path.length)return G.map.rows[0].map((n,i)=>[0,i]);const [r,i]=G.path[G.path.length-1];if(r>=R)return[];if(r===R-1)return[[R,0]];return G.map.rows[r][i].next.map(j=>[r+1,j])}
function mapHTML(){const rows=G.map.rows,R=rows.length,H=(R+1)*84+90,yp=r=>H-56-r*84,av=availNodes(),isAv=(r,i)=>av.some(a=>a[0]===r&&a[1]===i);
  const cur=G.path.length?G.path[G.path.length-1][0]:-1;let lines='',nodes='';
  rows.forEach((row,r)=>row.forEach(nd=>{
    const tgts=r===R-1?[{x:50,r:R,j:0}]:nd.next.map(j=>({x:rows[r+1][j].x,r:r+1,j}));
    tgts.forEach(t=>{let cls='';const pi=G.path.findIndex(p=>p[0]===r&&p[1]===nd.i);if(pi>=0&&G.path[pi+1]&&G.path[pi+1][0]===t.r&&G.path[pi+1][1]===t.j)cls='done';else if(pi===G.path.length-1&&pi>=0)cls='av';
      lines+=`<line x1="${nd.x}%" y1="${yp(r)}" x2="${t.x}%" y2="${yp(t.r)}" class="${cls}"/>`});
    const a=isAv(r,nd.i),v=isVis(r,nd.i);
    nodes+=`<div class="node ${a?'av':''} ${v?'vis':''} ${!a&&!v&&r<=cur?'past':''}" style="left:${nd.x}%;top:${yp(r)}px" ${a?`onclick="goNode(${r},${nd.i})"`:''}>${NODEI[nd.type]}</div>`}));
  const ba=isAv(R,0);nodes+=`<div class="node boss ${ba?'av':''}" style="left:50%;top:${yp(R)}px" ${ba?`onclick="goNode(${R},0)"`:''}>${POOLS[G.act].bossE}</div>`;
  return`${topbar()}<div class="legend">${Object.keys(NODEI).map(k=>`<span>${NODEI[k]}${NODEN[k]}</span>`).join('')}<span>${POOLS[G.act].bossE}首領</span></div><div class="mapwrap" id="mapwrap"><div class="mapinner" style="height:${H}px"><svg width="100%" height="${H}">${lines}</svg>${nodes}</div></div>`}
function scrollMap(){const w=document.getElementById('mapwrap');if(!w)return;const R=G.map.rows.length,H=(R+1)*84+90;const cur=G.path.length?G.path[G.path.length-1][0]:-1;w.scrollTop=Math.max(0,(H-56-(cur+1)*84)-w.clientHeight*.55)}
function goNode(r,i){sfx('click');G.path.push([r,i]);G.floor++;const R=G.map.rows.length;const type=r===R?'boss':G.map.rows[r][i].type;enterNode(type)}
function pickFight(){const pool=G.fights<3?POOLS[G.act].easy:POOLS[G.act].norm;G.fights++;let f;do{f=pick(pool)}while(pool.length>1&&JSON.stringify(f)===G.lastFight);G.lastFight=JSON.stringify(f);return f}
function enterNode(type){
  switch(type){
    case'battle':startCombat(pickFight(),'normal');break;
    case'elite':startCombat(pick(POOLS[G.act].elite),'elite');break;
    case'boss':startCombat(POOLS[G.act].boss,'boss');break;
    case'rest':G.screen='rest';render();break;
    case'shop':genShop();G.screen='shop';render();break;
    case'treasure':G.chest={opened:false};G.screen='treasure';render();break;
    case'event':{const x=Math.random();if(x<.14){toast('❓ 你遭遇了埋伏！');startCombat(pickFight(),'normal')}else if(x<.22){G.chest={opened:false};G.screen='treasure';render()}else startEvent();break}
  }
}
function nodeDone(){C=null;G.screen='map';playMusic('map');render()}

// ================= 獎勵 =================
function rollRarity(kind){if(kind==='boss')return'r';const x=Math.random();const rare=kind==='elite'?.1:kind==='shop'?.09:.04;if(x<rare)return'r';if(x<rare+.37)return'u';return'c'}
function rollCard(kind,ex){ex=ex||[];for(let k=0;k<60;k++){const r=rollRarity(kind);const ids=Object.keys(CARDS).filter(id=>CARDS[id].ch===G.ch&&CARDS[id].r===r&&!ex.includes(id));if(ids.length)return pick(ids)}return G.ch==='w'?'cleave':G.ch==='m'?'arcane':'pierce'}
function rollCards(kind){const a=[];for(let i=0;i<3;i++)a.push(rollCard(kind,a));return a}
function randomRelic(){const pool=Object.keys(REL).filter(k=>REL[k].r==='c'&&!G.relics.includes(k));return pool.length?pick(pool):null}
function gainRelic(id){if(!id)return;G.relics.push(id);if(REL[id].pick)REL[id].pick();sfx('relic')}
function gainRandomRelic(){const r=randomRelic();if(r)gainRelic(r);return r}
function upRandom(type,n){const idx=shuffle(G.deck.map((c,i)=>i).filter(i=>canUp(G.deck[i])&&(!type||CARDS[G.deck[i].id].t===type))).slice(0,n);idx.forEach(i=>G.deck[i].up=true);return idx.map(i=>cardName(G.deck[i]))}
function makeReward(kind){const items=[{t:'gold',v:kind==='boss'?rnd(95,105):kind==='elite'?rnd(25,35):rnd(10,20)}];
  if(Math.random()<(kind==='normal'?.4:.65))items.push({t:'pot',id:pick(Object.keys(POT))});
  if(kind==='elite'){const r=randomRelic();if(r)items.push({t:'relic',id:r})}
  items.push({t:'card',cards:rollCards(kind)});G.rew={kind,items}}
function rewardHTML(){const it=G.rew.items;return`${topbar()}<div class="center"><div class="bigemo">🏆</div><h2 style="margin:0">戰鬥勝利！</h2><div class="panel">${it.map((x,i)=>{
  let s='';if(x.t==='gold')s=`💰 ${x.v} 金幣`;else if(x.t==='pot')s=`${POT[x.id].e} ${POT[x.id].n}<br><small>${POT[x.id].d}</small>`;else if(x.t==='relic')s=`${REL[x.id].e} ${REL[x.id].n}<br><small>${REL[x.id].d}</small>`;else s='🃏 將一張卡牌加入牌組';
  return`<button class="btn ritem" onclick="claim(${i})">${s}</button>`}).join('')||'<p>已領取全部獎勵</p>'}</div><button class="btn big" onclick="rewardLeave()">繼續 ▶</button></div>`}
function claim(i){const x=G.rew.items[i];if(!x)return;
  if(x.t==='gold'){G.gold+=x.v;sfx('coin');G.rew.items.splice(i,1)}
  else if(x.t==='pot'){if(!givePotion(x.id)){toast('藥水欄已滿（可點上方藥水丟棄）');return}G.rew.items.splice(i,1)}
  else if(x.t==='relic'){gainRelic(x.id);G.rew.items.splice(i,1)}
  else if(x.t==='card'){cardChoice(x.cards,'選擇一張卡牌加入牌組',id=>{if(id){G.deck.push({id,up:false});sfx('card');G.rew.items.splice(G.rew.items.indexOf(x),1)}render()});return}
  render()}
function rewardLeave(){const it=G.rew.items;if(!it.length){rewardDone();return}
  const names=it.map(x=>x.t==='gold'?`💰 ${x.v} 金幣`:x.t==='pot'?`${POT[x.id].e} ${POT[x.id].n}`:x.t==='relic'?`${REL[x.id].e} ${REL[x.id].n}`:'🃏 卡牌獎勵').join('<br>');
  sfx('err');modal(`<div class="pmenu"><div class="bigemo" style="font-size:56px">🎁</div><h3 style="margin:6px 0">還有戰利品沒拿！</h3><p style="line-height:1.8">${names}</p><p style="font-weight:bold">確定要放棄這些戰利品並離開嗎？</p><div class="row"><button class="btn gray" onclick="closeModal();rewardDone()">放棄並離開</button><button class="btn" onclick="closeModal()">回去領取</button></div></div>`)}
function rewardDone(){const k=G.rew.kind;G.rew=null;if(k==='boss'){const pool=shuffle(Object.keys(REL).filter(r=>REL[r].r==='b'&&!G.relics.includes(r))).slice(0,3);G.bossRel=pool;G.screen='bossrel';render()}else nodeDone()}
function bossRelHTML(){return`${topbar()}<div class="center"><div class="bigemo">${POOLS[G.act].bossE}</div><h2 style="margin:0">首領被擊敗了！</h2><p>選擇一件首領遺物</p><div class="panel">${G.bossRel.map(r=>`<button class="btn ritem" onclick="pickBossRel('${r}')">${REL[r].e} ${REL[r].n}<br><small>${REL[r].d}</small></button>`).join('')}</div><button class="btn gray" onclick="pickBossRel(null)">跳過</button></div>`}
function pickBossRel(r){if(r)gainRelic(r);if(G.act===1){G.act=2;G.map=genMap();G.path=[];G.fights=0;G.lastFight=null;G.p.hp=G.p.maxHp;nodeDone();setTimeout(()=>banner('第二幕：腐化深淵'),200)}else{G.screen='victory';clearSave();sfx('win');render()}}

// ================= 營火 / 寶箱 / 商店 / 事件 =================
function restHTML(){const h=Math.floor(G.p.maxHp*.3);return`${topbar()}<div class="center"><div class="bigemo">🔥</div><h2 style="margin:0">營火</h2><p class="sub">溫暖的火光讓你暫時忘記了恐懼。</p><div class="row">
  <button class="btn big" ${hasRelic('core')?'disabled':''} onclick="restHeal()">😴 休息<br><small>回復 ${h} 生命</small></button>
  <button class="btn big" ${G.deck.some(canUp)?'':'disabled'} onclick="restSmith()">⚒️ 鍛造<br><small>升級一張牌</small></button></div></div>`}
function restHeal(){heal(G.p,Math.floor(G.p.maxHp*.3));G.p.hp=Math.min(G.p.hp,G.p.maxHp);sfx('heal');nodeDone()}
function restSmith(){selectCard('選擇要升級的卡牌（顯示升級後）',c=>canUp(c),i=>{G.deck[i].up=true;sfx('upgrade');toast(`「${cardName(G.deck[i])}」升級了！`);nodeDone()},true,()=>{})}
function treasureHTML(){return`${topbar()}<div class="center"><div class="bigemo">${G.chest.opened?'📭':'🧰'}</div><h2 style="margin:0">寶箱</h2>${G.chest.opened?`<p>${G.chest.msg}</p><button class="btn big" onclick="nodeDone()">繼續 ▶</button>`:`<button class="btn big" onclick="openChest()">打開寶箱</button>`}</div>`}
function openChest(){const g=rnd(25,45);G.gold+=g;const r=gainRandomRelic();G.chest={opened:true,msg:(r?`你獲得了 ${REL[r].e} <b>${REL[r].n}</b>：${REL[r].d}<br>`:'')+`以及 💰 ${g} 金幣！`};sfx('coin');render()}
function genShop(){const cards=[];const ex=[];for(let k=0;k<5;k++){const id=rollCard('shop',ex);ex.push(id);const r=CARDS[id].r;const base=r==='r'?rnd(135,165):r==='u'?rnd(68,82):rnd(45,55);cards.push({id,price:base,sold:false})}
  const s=rnd(0,4);cards[s].price=Math.floor(cards[s].price/2);cards[s].sale=true;
  const rels=shuffle(Object.keys(REL).filter(k=>REL[k].r==='c'&&!G.relics.includes(k))).slice(0,2).map(id=>({id,price:rnd(140,180),sold:false}));
  const pots=[0,1,2].map(()=>({id:pick(Object.keys(POT)),price:rnd(48,72),sold:false}));
  G.shop={cards,rels,pots,remove:75+25*G.removes,removed:false}}
function shopHTML(){const S=G.shop,pc=(p,sale)=>`<span class="price ${G.gold<p?'no':sale?'sale':''}">💰${p}${sale?' 特價':''}</span>`;
  return`${topbar()}<div class="center" style="justify-content:flex-start"><h2 style="margin:4px">💰 商店</h2><p class="sub" style="margin:0">「隨便看看，便宜賣啦～」</p>
  <div class="shopgrid">${S.cards.map((c,i)=>`<div class="sitem ${c.sold?'sold':''}" onclick="buy('card',${i})">${cardHTML({id:c.id,up:false})}${pc(c.price,c.sale)}</div>`).join('')}</div>
  <div class="shopgrid">${S.rels.map((r,i)=>`<div class="sitem ${r.sold?'sold':''}" onclick="buy('rel',${i})"><div class="relbox">${REL[r.id].e}<small>${REL[r.id].n}</small></div>${pc(r.price)}</div>`).join('')}
  ${S.pots.map((p,i)=>`<div class="sitem ${p.sold?'sold':''}" onclick="buy('pot',${i})"><div class="relbox">${POT[p.id].e}<small>${POT[p.id].n}</small></div>${pc(p.price)}</div>`).join('')}
  <div class="sitem ${S.removed?'sold':''}" onclick="buy('rm',0)"><div class="relbox">🗑️<small>移除卡牌</small></div>${pc(S.remove)}</div></div>
  <button class="btn big" onclick="nodeDone()">離開商店 ▶</button></div>`}
function buy(type,i){const S=G.shop;
  const item=type==='card'?S.cards[i]:type==='rel'?S.rels[i]:type==='pot'?S.pots[i]:null;
  if(type==='rm'){if(S.removed)return;shopConfirm('🗑️','移除卡牌','從你的牌組中永久移除一張卡牌。購買後會讓你選擇要移除哪一張。',S.remove,()=>selectCard('選擇要移除的卡牌',()=>true,k=>{G.gold-=S.remove;toast(`移除了「${cardName(G.deck[k])}」`);G.deck.splice(k,1);G.removes++;S.removed=true;sfx('coin');render()},false,()=>{}));return}
  if(!item||item.sold)return;
  if(type==='card'){showInfoCard(item.id,item.price,()=>{if(G.gold<item.price){toast('金幣不足');sfx('err');return}G.gold-=item.price;item.sold=true;G.deck.push({id:item.id,up:false});sfx('coin');render()});return}
  const D=type==='rel'?REL[item.id]:POT[item.id];
  shopConfirm(D.e,D.n,(type==='rel'?'【遺物】':'【藥水】')+D.d,item.price,()=>{
    if(type==='rel'){G.gold-=item.price;item.sold=true;gainRelic(item.id)}
    else{if(G.potions.indexOf(null)<0){toast('藥水欄已滿（可點上方藥水丟棄）');sfx('err');return}G.gold-=item.price;item.sold=true;givePotion(item.id)}
    sfx('coin');render()})}
function shopConfirm(icon,name,desc,price,onBuy){const poor=G.gold<price;
  modal(`<div class="pmenu"><div class="bigemo" style="font-size:64px">${icon}</div><h3 style="margin:6px 0">${name}</h3><p style="line-height:1.6">${desc}</p><p>價格：<span class="price ${poor?'no':''}">💰${price}</span>　你有 💰${G.gold}</p><p style="font-weight:bold">${poor?'金幣不足，無法購買。':'確定要購買嗎？'}</p><div class="row"><button class="btn" id="mbuy" ${poor?'disabled':''}>確定購買</button><button class="btn gray" onclick="closeModal()">取消</button></div></div>`);
  $('#mbuy').onclick=()=>{closeModal();if(G.gold<price){toast('金幣不足');sfx('err');return}onBuy()}}
function showInfoCard(id,price,onBuy){modal(`<div style="margin:auto;text-align:center"><div style="--cw:150px;display:inline-block">${cardHTML({id,up:false})}</div><p style="font-size:13px;opacity:.8">升級後：</p><div style="--cw:110px;display:inline-block">${cardHTML({id,up:true})}</div><p style="font-weight:bold">${G.gold<price?'金幣不足，無法購買。':`確定要花 💰${price} 購買嗎？（你有 💰${G.gold}）`}</p><div class="row" style="margin-top:8px"><button class="btn" id="mbuy" ${G.gold<price?'disabled':''}>確定購買</button><button class="btn gray" onclick="closeModal()">取消</button></div></div>`);
  $('#mbuy').onclick=()=>{closeModal();onBuy()}}
function startEvent(){const keys=Object.keys(EVENTS).filter(k=>!(G.seenEv||[]).includes(k));const k=pick(keys.length?keys:Object.keys(EVENTS));G.seenEv=(G.seenEv||[]).concat(k);G.ev={id:k,res:null};G.screen='event';render()}
function eventHTML(){const E=EVENTS[G.ev.id];const opts=G.ev.res==null?E.opts():[];
  return`${topbar()}<div class="center"><div class="bigemo">${E.e}</div><h2 style="margin:0">${E.t}</h2><div class="panel"><p style="line-height:1.7;margin-top:0">${G.ev.res==null?E.txt:G.ev.res}</p>
  ${G.ev.res==null?opts.map((o,i)=>`<button class="btn opt" ${o.dis?'disabled':''} onclick="evOpt(${i})">${o.l}</button>`).join(''):`<button class="btn opt" style="text-align:center" onclick="nodeDone()">繼續 ▶</button>`}</div></div>`}
function evOpt(i){const o=EVENTS[G.ev.id].opts()[i];if(!o||o.dis)return;sfx('click');o.f(txt=>{G.ev.res=txt;render()})}

// ================= 開場 / 結束 =================
function titleHTML(){const sv=hasSave();return`<div class="center"><div class="bigemo" style="font-size:96px">🗼</div><h1 class="title">深淵尖塔</h1><p class="sub">卡牌構築 × Roguelike 爬塔冒險　v1.2</p>
  <button class="btn big" onclick="SCR='charsel';render()">⚔️ 新的冒險</button>${sv?`<button class="btn big" onclick="loadGame()">📜 繼續冒險</button>`:''}<button class="btn" onclick="showCodex()">📖 連招圖鑑</button>
  <div class="helpbox">🃏 點一下卡牌選取，再點敵人打出；或直接把卡牌<b>拖曳</b>到敵人身上。<br>不需要目標的卡牌：再點一次或往上拖曳即可打出。<br>點敵人可查看意圖與狀態。<br>✨ 同一回合依序打出特定卡牌會觸發<b>連招</b>，發金光的卡牌代表打出就能完成連招！穿越兩幕、擊敗首領即可登頂！</div></div>`}
function charselHTML(){return`<div class="center"><h2>選擇你的角色</h2><div class="chars">${Object.keys(CHARS).map(k=>{const c=CHARS[k];return`<div class="charc" onclick="newGame('${k}')"><div class="bigemo">${heroIcon(k)}</div><h3 style="margin:4px;color:${c.col}">${c.n}</h3><div style="font-size:13px;line-height:1.6">${c.desc}</div><p style="font-size:13px;margin:6px 0">❤️ ${c.hp}　${REL[c.relic].e} ${REL[c.relic].n}</p><div class="mech"><b>職業機制</b>${c.mech.map(m=>`<div>${m}</div>`).join('')}</div><button class="btn" style="margin-top:8px;width:100%">選擇${c.n}</button></div>`}).join('')}</div><button class="btn gray" onclick="SCR='title';render()">返回</button></div>`}
function newGame(ch){const c=CHARS[ch];G={ch,p:{hp:c.hp,maxHp:c.hp,block:0,st:{},isP:true,uid:'p',name:c.n,emo:c.emo},gold:99,deck:c.deck.map(id=>({id,up:false})),relics:[],potions:[null,null,null],act:1,floor:0,map:genMap(),path:[],fights:0,removes:0,screen:'bless',seenEv:[]};
  G.relics.push(c.relic);playMusic('map');render()}
function blessHTML(){return`<div class="center"><div class="bigemo">🕯️</div><h2 style="margin:0">古老之靈</h2><p class="sub">「勇敢的${G.p.name}啊……在你攀登尖塔之前，接受我的祝福吧。」</p>
  <button class="btn opt bless" onclick="bless(0)">❤️ 最大生命 +8</button><button class="btn opt bless" onclick="bless(1)">🎁 獲得一件隨機遺物</button>
  <button class="btn opt bless" onclick="bless(2)">⚒️ 升級一張牌</button><button class="btn opt bless" onclick="bless(3)">🗑️ 移除一張牌</button><button class="btn opt bless" onclick="bless(4)">💰 獲得 100 金幣</button><button class="btn gray" onclick="G=null;SCR='charsel';render()">← 重新選擇角色</button></div>`}
function bless(k){const done=()=>{G.screen='map';render()};
  if(k===0){G.p.maxHp+=8;G.p.hp+=8;sfx('heal');done()}
  else if(k===1){const r=gainRandomRelic();toast(`${REL[r].e} ${REL[r].n}：${REL[r].d}`);done()}
  else if(k===2)selectCard('選擇要升級的卡牌（顯示升級後）',c=>canUp(c),i=>{G.deck[i].up=true;sfx('upgrade');done()},true,()=>{});
  else if(k===3)selectCard('選擇要移除的卡牌',()=>true,i=>{G.deck.splice(i,1);sfx('click');done()},false,()=>{});
  else{G.gold+=100;sfx('coin');done()}}
function gameOver(){if(!G)return;clearSave();sfx('lose');playMusic('title');G.screen='over';C=null;render()}
function overHTML(){return`<div class="center"><div class="bigemo">💀</div><h1 class="title" style="font-size:52px">你倒下了</h1><p>${G.p.name} 止步於第 ${G.act} 幕・第 ${G.floor} 層</p><p class="sub">牌組 ${G.deck.length} 張・遺物 ${G.relics.length} 件</p><button class="btn big" onclick="G=null;SCR='title';render()">回到標題</button></div>`}
function victoryHTML(){return`<div class="center"><div class="bigemo">🏆</div><h1 class="title" style="font-size:52px">登頂成功！</h1><p>${heroIcon(G.ch)} ${G.p.name} 擊敗了腐化之冠，征服了深淵尖塔！</p><p class="sub">剩餘生命 ${G.p.hp}/${G.p.maxHp}・牌組 ${G.deck.length} 張・遺物 ${G.relics.map(r=>REL[r].e).join('')}</p><button class="btn big" onclick="G=null;SCR='title';render()">回到標題</button></div>`}
function hasSave(){try{return!!localStorage.getItem(SAVE_KEY)}catch(e){return false}}
function saveGame(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(G))}catch(e){}}
function clearSave(){try{localStorage.removeItem(SAVE_KEY)}catch(e){}}
function loadGame(){try{G=JSON.parse(localStorage.getItem(SAVE_KEY));G.p.emo=CHARS[G.ch].emo;G.screen='map';C=null;playMusic('map');render()}catch(e){toast('讀取存檔失敗');clearSave();render()}}

// ================= 畫面元件 =================
function H(){const inC=!!(C&&!C.over&&G.screen==='combat');const p=G?G.p:{st:{},block:0};
  const fmt=(v,n)=>v>n?`<b class="up">${v}</b>`:v<n?`<b class="dn">${v}</b>`:`${v}`;
  return{inC,blk:inC?p.block:0,acc:inC?(p.st.accuracy||0):0,stc:inC?(p.st.stance||0):0,
    d:n=>{if(!inC)return n;let v=n+(p.st.str||0);if(p.st.weak)v=Math.floor(v*.75);return fmt(Math.max(0,v),n)},
    b:n=>{if(!inC)return n;let v=n+(p.st.dex||0);if(p.st.frail)v=Math.floor(v*.75);return fmt(Math.max(0,v),n)}}}
function cardHTML(card,extra='',idx='',ctag=''){const d=CARDS[card.id],h=H();let desc=d.d(card.up,h);if(exh(card))desc+=' <k>消耗</k>。';
  return`<div class="card t${d.t} r${d.r} ${card.up?'upg':''} ${extra}" data-i="${idx}">${d.unp?'':`<div class="cost">${costOf(card)}</div>`}${ctag?`<div class="ctag">✨${ctag}</div>`:''}<div class="cname">${cardName(card)}</div><div class="cart">${d.art}</div><div class="ctype">${TYPEN[d.t]}</div><div class="cdesc"><div>${desc}</div></div></div>`}
function topbar(){const p=G.p;return`<div class="topbar"><span>${heroIcon(G.ch)} <b>${p.name}</b></span><span>❤️ ${p.hp}/${p.maxHp}</span><span>💰 ${G.gold}</span><span>${G.potions.map((pt,i)=>`<span class="pot" onclick="potClick(${i})">${pt?POT[pt].e:''}</span>`).join('')}</span><span style="font-size:12px;opacity:.8">第${G.act}幕·${G.floor}層</span><span class="sp"></span><button class="ib" onclick="showCodex()">📖</button><button class="ib" onclick="showDeck()">🂠 ${G.deck.length}</button><button class="ib" onclick="gameMenu()">⚙️</button><button class="ib" onclick="toggleMusic()">${AU.on?'🔊':'🔇'}</button></div><div class="relics">${G.relics.map(r=>`<span class="rel" onclick="relInfo('${r}')">${REL[r].e}</span>`).join('')}</div>`}
function gameMenu(){modal(`<div class="pmenu"><div class="bigemo" style="font-size:52px">⚙️</div><h3>選單</h3><div style="display:flex;flex-direction:column;gap:10px;min-width:220px">
  <button class="btn" onclick="closeModal()">▶ 繼續遊戲</button>
  <button class="btn" onclick="closeModal();toggleMusic()">${AU.on?'🔇 關閉音樂':'🔊 開啟音樂'}</button>
  <button class="btn gray" onclick="confirmRestart()">🔄 放棄並重新開始</button>
  <button class="btn gray" onclick="toTitle()">🏠 回到標題（保留存檔）</button></div></div>`)}
function confirmRestart(){modal(`<div class="pmenu"><div class="bigemo" style="font-size:52px">⚠️</div><h3>確定要重新開始嗎？</h3><p>目前的冒險進度（第 ${G.act} 幕・第 ${G.floor} 層）會全部消失，無法復原。</p><div class="row"><button class="btn gray" onclick="doRestart()">確定重來</button><button class="btn" onclick="closeModal()">取消</button></div></div>`)}
function doRestart(){closeModal();clearSave();if(C)C.over=true;C=null;DR=null;G=null;SCR='charsel';FX.innerHTML='';render()}
function toTitle(){closeModal();if(G.screen==='combat'){toast('戰鬥中回到標題，下次會從進入這場戰鬥前的地圖繼續。')}if(C)C.over=true;C=null;DR=null;G=null;SCR='title';FX.innerHTML='';render()}
function relInfo(r){toast(`${REL[r].e} <b>${REL[r].n}</b>：${REL[r].d}`)}
const ICON={frozen:'❄️',def:'🛡️',buff:'⬆️',debuff:'🌀',sleep:'💤',split:'✨',unknown:'❓'};
function intentHTML(e){const m=e.move;if(!m)return'<div class="intent"></div>';let s='';for(const k of m.k.split('+')){if(k==='atk'){const d=dmgCalc(e,G.p,m.d);s+=`<span class="dm">🗡️${d}${m.n>1?'×'+m.n:''}</span>`}else s+=`<span>${ICON[k]||''}</span>`}return`<div class="intent">${s}</div>`}
function crHTML(c,isE,idx){const now=performance.now();const cls=[isE?'enemy':'player',c.hitAt&&now-c.hitAt<300?'hit':'',c.actAt&&now-c.actAt<150?(isE?'lungeL':'lungeR'):''].join(' ');
  const pct=Math.max(0,c.hp/c.maxHp*100);const sts=Object.keys(c.st).map(k=>{const s=STS[k]||{i:k};return`<span>${s.i}${c.st[k]}</span>`}).join('');
  return`<div class="cr ${cls}" id="cr-${c.uid}" ${isE?`data-e="${idx}" onclick="enemyClick(${idx})"`:'onclick="playerClick()"'}>${isE?intentHTML(c):'<div class="intent"></div>'}<div class="avatar">${isE?c.emo:heroIcon(G.ch)}</div><div class="cname2">${c.name}</div><div class="hpbar ${c.block?'hasblk':''}">${c.block?`<div class="bbadge">🛡${c.block}</div>`:''}<div class="hpfill" style="width:${pct}%"></div><span>${c.hp}/${c.maxHp}</span></div><div class="sts">${sts}</div></div>`}
function hintTxt(){if(!C)return'';if(C.busy)return C.over?'':'……';if(C.potSel!=null)return'🎯 點選藥水目標';if(C.sel!=null){const c=C.hand[C.sel];const cb=c?matchCombos(c):[];const tip=cb.length?'✨'+cb.map(x=>x.n).join('、')+'　':'';if(c&&CARDS[c.id].tg==='e')return tip+'🎯 點選一名敵人';return tip+'👆 再點一次打出'}return''}
function combatHTML(){return`${topbar()}<div class="field ${targetMode()?'tm':''}"><div class="pside">${crHTML(G.p,false)}</div><div class="eside">${C.enemies.map((e,i)=>e.dead?'':crHTML(e,true,i)).join('')}</div></div>
  <div class="hud"><div class="hudrow"><div class="energy ${C.energy?'':'zero'}">${C.energy}<small>/${baseE()}</small></div><button class="pile" onclick="showPile('draw')">🂠 ${C.draw.length}</button><button class="pile" onclick="showPile('discard')">🗑 ${C.discard.length}</button>${C.exhaust.length?`<button class="pile" onclick="showPile('exhaust')">🔥 ${C.exhaust.length}</button>`:''}<div class="trail">${(C.seq||[]).slice(-3).map(e=>`<span class="tc t${e.t}">${CARDS[e.id].art}</span>`).join('<i>›</i>')}</div><div class="hint">${hintTxt()}</div><button class="btn endbtn" ${C.busy?'disabled':''} onclick="endTurn()">結束回合</button></div>
  <div class="hand" id="hand">${C.hand.map((c,i)=>{const cb=playable(c)&&!C.busy?matchCombos(c):[];return cardHTML(c,`${i===C.sel?'sel':''} ${playable(c)?'can':''} ${cb.length?'combo':''}`,i,cb.length?cb[0].n:'')}).join('')}</div></div>`}

// ================= 彈窗 =================
let MX=null;
function modal(html,onX){MODAL.innerHTML=html;MODAL.scrollTop=0;MODAL.classList.add('on');MX=onX||closeModal;$('#mclose').classList.add('on')}
function closeModal(){MODAL.classList.remove('on');MODAL.innerHTML='';$('#mclose').classList.remove('on')}
function modalX(){const f=MX;MX=null;if(f===closeModal||!f)closeModal();else f()}
function showDeck(){const order={A:0,S:1,P:2,X:3};const list=G.deck.slice().sort((a,b)=>order[CARDS[a.id].t]-order[CARDS[b.id].t]||CARDS[a.id].n.localeCompare(CARDS[b.id].n));
  modal(`<h2>你的牌組（${G.deck.length} 張）</h2><div class="grid">${list.map(c=>cardHTML(c)).join('')}</div><button class="btn" onclick="closeModal()">關閉</button>`)}
function showPile(n){const names={draw:'抽牌堆（順序隨機）',discard:'棄牌堆',exhaust:'消耗堆'};let list=C[n].slice();if(n==='draw')list.sort((a,b)=>CARDS[a.id].n.localeCompare(CARDS[b.id].n));
  modal(`<h2>${names[n]}（${list.length}）</h2><div class="grid">${list.map(c=>cardHTML(c)).join('')||'<p>空的</p>'}</div><button class="btn" onclick="closeModal()">關閉</button>`)}
let SELCB=null;
function selectCard(title,filter,cb,preview,cancel){const items=G.deck.map((c,i)=>({c,i})).filter(x=>filter(x.c));SELCB={cb,cancel};
  modal(`<h2>${title}</h2><div class="grid">${items.map(x=>`<div onclick="selPick(${x.i})">${cardHTML(preview?{id:x.c.id,up:true}:x.c)}</div>`).join('')||'<p>沒有可選的卡牌</p>'}</div><button class="btn gray" onclick="selCancel()">取消</button>`,selCancel)}
function selPick(i){const s=SELCB;SELCB=null;closeModal();s.cb(i)}
function selCancel(){const s=SELCB;SELCB=null;closeModal();if(s&&s.cancel)s.cancel()}
let CHCB=null;
function cardChoice(ids,title,cb){CHCB={cb,ids};modal(`<h2>${title}</h2><div class="grid">${ids.map((id,i)=>`<div onclick="chPick(${i})">${cardHTML({id,up:false})}</div>`).join('')}</div><button class="btn gray" onclick="chPick(-1)">跳過</button>`,()=>chPick(-1))}
function chPick(i){const s=CHCB;CHCB=null;closeModal();s.cb(i>=0?s.ids[i]:null)}

// ================= 特效 =================
function floatTxt(cr,txt,cls){const el=document.getElementById('cr-'+cr.uid);if(!el)return;const r=el.getBoundingClientRect();const f=document.createElement('div');f.className='float '+(cls||'');f.textContent=txt;
  f.style.left=(r.left+r.width/2+(Math.random()*36-18))+'px';f.style.top=(r.top+r.height*.35+(Math.random()*24-12))+'px';FX.appendChild(f);setTimeout(()=>f.remove(),1100)}
function comboBanner(t){const b=document.createElement('div');b.className='banner cbn';b.textContent=t;FX.appendChild(b);setTimeout(()=>b.remove(),1300)}
function banner(t){const b=document.createElement('div');b.className='banner';b.textContent=t;FX.appendChild(b);setTimeout(()=>b.remove(),1300)}
function shake(){app.classList.remove('shake');void app.offsetWidth;app.classList.add('shake')}
let toastT=null;function toast(html){const t=$('#toast');t.innerHTML=html;t.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>t.style.display='none',2600)}
$('#toast').onclick=()=>$('#toast').style.display='none';

// ================= 主渲染 =================
function render(){
  if(!G){app.innerHTML=SCR==='charsel'?charselHTML():titleHTML();playMusic('title');return}
  const s=G.screen;let h='';
  switch(s){case'bless':h=blessHTML();break;case'map':h=mapHTML();break;case'combat':h=combatHTML();break;case'reward':h=rewardHTML();break;
    case'rest':h=restHTML();break;case'shop':h=shopHTML();break;case'event':h=eventHTML();break;case'treasure':h=treasureHTML();break;
    case'bossrel':h=bossRelHTML();break;case'over':h=overHTML();break;case'victory':h=victoryHTML();break}
  app.innerHTML=h;
  if(s==='combat')setupHand();
  if(s==='map'){scrollMap();saveGame()}
}
render();
</script>
