<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>釣魚圖鑑大冒險 v1.1</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#0b1530;font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;color:#fff;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:8px;gap:6px;pointer-events:none;z-index:2}
#hud .grp{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
#hud .grp.r{justify-content:flex-end}
.pill{background:rgba(8,22,45,.62);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:700;color:#fff;pointer-events:auto;white-space:nowrap}
button{font-family:inherit;cursor:pointer}
.btn:hover{background:rgba(30,70,120,.8)}
.btn:active{transform:scale(.95)}
#bottom{position:fixed;bottom:0;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 8px 12px;pointer-events:none;z-index:2}
#hint{font-size:15px;font-weight:700;text-shadow:0 2px 4px #000a;background:rgba(0,0,0,.28);padding:4px 14px;border-radius:999px}
#baitBar{display:flex;gap:6px;pointer-events:auto}
.bait{background:rgba(8,22,45,.62);border:2px solid rgba(255,255,255,.2);border-radius:12px;padding:4px 10px;color:#fff;font-size:13px;font-weight:700}
.bait.sel{border-color:#ffd54a;background:rgba(90,70,10,.7)}
#toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.72);padding:10px 18px;border-radius:12px;font-weight:700;font-size:15px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:5;text-align:center;max-width:90vw}
#toast.show{opacity:1}
.mbg{position:fixed;inset:0;background:rgba(0,8,22,.72);display:none;align-items:center;justify-content:center;z-index:10}
.mbg.show{display:flex}
.modal{background:linear-gradient(#18406a,#0e2540);border:2px solid #6fb7e8;border-radius:18px;width:min(820px,95vw);max-height:92vh;overflow:auto;padding:16px;position:relative;box-shadow:0 10px 40px #000a;touch-action:pan-y}
.modal h2{font-size:22px;margin-bottom:8px}
.close{position:absolute;top:10px;right:12px;background:#c0392b;border:none;color:#fff;width:34px;height:34px;border-radius:50%;font-size:18px;font-weight:900}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.tab{background:rgba(255,255,255,.08);border:2px solid transparent;border-radius:10px;padding:5px 10px;color:#fff;font-size:13px;font-weight:700}
.tab.on{border-color:#ffd54a;background:rgba(255,213,74,.15)}
.tab.done{box-shadow:0 0 0 2px #4cd964 inset}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.card{background:rgba(255,255,255,.06);border-radius:12px;padding:6px 4px;text-align:center;border:2px solid transparent;cursor:pointer;position:relative}
.card.sel{border-color:#ffd54a}
.card canvas{width:100%;height:auto;display:block}
.card .nm{font-size:12px;font-weight:700;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .no{position:absolute;top:3px;left:6px;font-size:10px;opacity:.6}
.card .cnt{position:absolute;top:3px;right:6px;font-size:10px;opacity:.75}
.detail{display:flex;gap:12px;align-items:center;background:rgba(0,0,0,.25);border-radius:14px;padding:10px;margin-bottom:10px;flex-wrap:wrap}
.detail canvas{width:240px;max-width:100%;height:auto;background:radial-gradient(#2c6a9a,#0d2b48);border-radius:12px}
.detail .info{flex:1;min-width:200px;font-size:14px;line-height:1.65}
.detail .info b{font-size:19px}
.rar1{color:#c6d0d6}.rar2{color:#56b0ff}.rar3{color:#c77dff}.rar4{color:#ffc93c}
.bar{height:10px;background:rgba(255,255,255,.12);border-radius:5px;overflow:hidden;margin:4px 0 8px}
.bar>div{height:100%;background:linear-gradient(90deg,#4cd964,#ffd54a)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(255,255,255,.06);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.rodcv{width:120px;height:36px;flex:none;border-radius:8px}
@media (max-width:600px){.rodrow{flex-wrap:wrap}.rodcv{width:100%;height:auto;aspect-ratio:300/90}}
.row .t{font-size:15px;font-weight:700}
.row .s{font-size:12px;opacity:.8}
.act{background:linear-gradient(#ffcf4a,#f0a020);color:#3a2400;border:none;border-radius:10px;padding:8px 14px;font-weight:900;font-size:14px;white-space:nowrap}
.act:disabled{filter:grayscale(1);opacity:.5}
.act.g{background:linear-gradient(#5fe08a,#2fae5a);color:#06301a}
.result{text-align:center}
.result canvas{width:min(400px,86vw);height:auto;background:radial-gradient(#2c6a9a,#0d2b48);border-radius:14px;margin:6px 0}
.result .badge{display:inline-block;background:#ff4f6a;color:#fff;border-radius:999px;padding:3px 12px;font-weight:900;margin:2px;animation:pop .5s}
.result .badge.rec{background:#2fae5a}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
#start{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(#1f5f8f,#071a33);text-align:center;gap:14px;padding:20px}
#start h1{font-size:clamp(32px,8vw,60px);text-shadow:0 4px 0 #0a2a4a,0 0 30px #4fc3ff}
#start p{opacity:.85;line-height:1.7}
#start canvas{position:static;width:min(420px,90vw);height:auto}
.flycoin{position:fixed;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6b0,#ffd23a 45%,#c98a10);border:1.5px solid #8a5a08;z-index:13;pointer-events:none}
.coinplus{position:fixed;z-index:13;pointer-events:none;font-weight:900;font-size:18px;color:#ffe066;text-shadow:0 2px 0 #6a4200,0 0 8px rgba(0,0,0,.6);white-space:nowrap}
.big{font-size:22px;padding:12px 34px;border-radius:16px}
@media (max-width:600px){.pill{font-size:12px;padding:5px 9px}#hint{font-size:13px}}
</style>

function fishBody(hh,nose,tb,fl){
  const X=k=>tb+k*(nose-tb),p=new Path2D(),bh=fl.bighead?1.18:1,bl=fl.blunt?1:0;
  p.moveTo(nose,bl?-hh*.1:0);
  p.bezierCurveTo(X(.98),-hh*(.7+bl*.5)*bh,X(.62),-hh*1.1*bh,X(.32),-hh*.92);
  p.bezierCurveTo(X(.15),-hh*.72,X(.05),-hh*.38,X(0),-hh*.22);
  p.lineTo(X(0),hh*.22);
  p.bezierCurveTo(X(.05),hh*.38,X(.15),hh*.72,X(.32),hh*.92);
  p.bezierCurveTo(X(.62),hh*1.1,X(.96),hh*.8,nose,bl?hh*.15:0);
  p.closePath();return p;
}
function tri(c,pts,col){c.beginPath();c.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)c.lineTo(pts[i],pts[i+1]);c.closePath();c.fillStyle=col;c.fill()}
function drawFish(c,f,x,y,L,o={}){
  const dir=o.dir||1,t=o.t||0,sil=o.sil,fl=f.flags,hh=f.h/2;

let actx=null,master,musicG,sfxG,noiseBuf,musicOn=true,nextT=0,step=0,melIdx=4;

  noiseBuf=actx.createBuffer(1,actx.sampleRate*2,actx.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;

  const wg=actx.createGain();wg.gain.value=.05;const lfo=actx.createOscillator();lfo.frequency.value=.11;const lg=actx.createGain();lg.gain.value=.04;lfo.connect(lg);lg.connect(wg.gain);

function sched(){
  if(!actx)return;

  const deep=G.area===6,spb=deep?60/62/2:60/96/2,key=AREA_KEY[G.area]||0;
  while(nextT<actx.currentTime+.25){
    const bar=Math.floor(step/8)%4,k=step%8,t=nextT;
    if(!deep){
      const ch=PROG[bar].map(m=>m+key),night=period()==='night';
      if([0,2,3,5,6].includes(k))uke(mtof(ch[[0,1,2,3,1,2,3,0][k]]+12),t,night?.035:.05);
      if(k===0||k===3||k===6)bass(mtof(ch[k===3?2:0]-12),t,.13);
      shaker(t,k%2?.03:.014);
      if(Math.random()<(night?.18:.3)){melIdx=clamp(melIdx+Math.floor(Math.random()*5)-2,0,PENT.length-1);marimba(mtof(PENT[melIdx]+key+12),t,.07)}
    }else{
      const ch=PROG_D[bar];

      if(k===0||k===4)bass(mtof(ch[0]-12),t,.08);

}

const MFX=(function(){
  const c=document.createElement('canvas');c.id='fx';c.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:12';document.body.appendChild(c);

  addEventListener('resize',()=>setTimeout(fit,30));
  function kin(str,cx,cy,size,t0,T,col,o={}){
    x.font=`900 ${size}px "PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif`;
    const chars=[...str],ws=chars.map(ch=>x.measureText(ch).width),tot=ws.reduce((a,b)=>a+b,0);let px=cx-tot/2;
    chars.forEach((ch,i)=>{const lt=(T-t0-i*(o.stag||.06))/(o.dur||.45);const k=(o.ease||bk)(lt);
      x.save();x.globalAlpha=cl(lt*3)*(o.alpha===undefined?1:o.alpha);x.translate(px+ws[i]/2,cy+(1-k)*size*(o.drop||.7));
      if(o.rot)x.rotate((1-k)*o.rot*(i%2?1:-1));x.scale(k,k);x.textAlign='center';x.textBaseline='middle';
      if(o.stroke){x.lineWidth=size*.14;x.lineJoin='round';x.strokeStyle=o.stroke;x.strokeText(ch,0,0)}
      x.fillStyle=col;x.fillText(ch,0,0);x.restore();px+=ws[i]});
    return tot;
  }

  function beam(x,y,o){return at('beam',x,y,o)}
  function stopBeam(f){if(f)f.stop()}
  function weather(names){Object.keys(weathers).forEach(k=>{if(!names.includes(k)){weathers[k].stop();weathers[k]._dying=true}});
    names.forEach(k=>{if(!weathers[k]||weathers[k]._dying){weathers[k]=L.createFx(L.fx[k],{x:160,y:L.fx[k].meta.origin[1],seed:Math.random()*999|0})}});

      c.fillStyle=p.col;c.beginPath();c.arc(tx,top-2*sc,2.4*sc*(1-u*.5),0,7);c.fill();c.fillStyle=p.col2}
    // 白色泡沫
    c.fillStyle='rgba(255,255,255,.8)';c.beginPath();c.ellipse(p.x,p.y,R*1.1,R*.28,0,0,7);c.fill();
    c.restore()}
}


/* ================= 金幣入帳演出（金幣飛進金幣欄＋旁邊跳出 +數字） ================= */
function coinPop(amount,fx,fy){
  const pill=$('#coinP'),r=pill.getBoundingClientRect(),tx=r.left+16,ty=r.top+r.height/2,n=Math.min(8,3+Math.round(Math.log10(amount+1)*1.5));
  for(let i=0;i<n;i++){const c=document.createElement('div');c.className='flycoin';c.style.left=(fx+(Math.random()-.5)*60)+'px';c.style.top=(fy+(Math.random()-.5)*30)+'px';document.body.appendChild(c);
    const dx=tx-parseFloat(c.style.left),dy=ty-parseFloat(c.style.top),d=i*70;
    c.animate([{transform:'translate(-50%,-50%) scale(.4)',opacity:0},{transform:'translate(-50%,-80%) scale(1.1)',opacity:1,offset:.2},{transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(.7)`,opacity:1}],{duration:650,delay:d,easing:'cubic-bezier(.5,0,.75,.4)',fill:'forwards'});
    setTimeout(()=>{c.remove();SFX.tick&&SFX.tick();pill.animate([{transform:'scale(1.18)'},{transform:'scale(1)'}],{duration:220})},650+d)}
  const t=document.createElement('div');t.className='coinplus';t.textContent='+'+amount.toLocaleString();t.style.left=(r.left+r.width/2)+'px';t.style.top=(r.bottom+2)+'px';document.body.appendChild(t);
  t.animate([{transform:'translate(-50%,-6px) scale(.6)',opacity:0},{transform:'translate(-50%,0) scale(1.15)',opacity:1,offset:.15},{transform:'translate(-50%,0) scale(1)',opacity:1,offset:.7},{transform:'translate(-50%,-14px) scale(1)',opacity:0}],{duration:1800,delay:450,fill:'forwards'});
  setTimeout(()=>t.remove(),2400);
}

/* ================= 向量雨（和場景同風格） ================= */
const rainDrops=[...Array(140)].map(()=>({x:Math.random(),y:Math.random(),z:.4+Math.random()*.6}));let rainK=0;
function drawRain(c,dt,floor){
  rainK=clamp(rainK+(isRaining()?dt:-dt)*.6,0,1);if(rainK<=0)return;
  c.save();c.fillStyle=`rgba(40,52,72,${.22*rainK})`;c.fillRect(0,0,W,H);
  c.lineCap='round';const n=Math.round(rainDrops.length*rainK),sl=.22;
  for(let i=0;i<n;i++){const d=rainDrops[i];d.y+=dt*(1.1+d.z*.9);d.x-=dt*sl*(1.1+d.z*.9)*H/W;
    if(d.y>1){d.y=Math.random()*-.2;d.x=Math.random()*1.2;const sx=d.x*W,sy=floor+(H-floor)*Math.random()*(G.fp?1:.35);if(sy>floor&&Math.random()<.5)ripples.push({x:sx,y:sy,r:1,a:.45})}
    if(d.x<-.1)d.x+=1.2;
    const x=d.x*W,y=d.y*H,len=(10+d.z*16)*S;if(!G.fp&&y>floor+(H-floor)*.35)continue;
    c.strokeStyle=`rgba(210,225,245,${(.25+d.z*.4)*rainK})`;c.lineWidth=.8+d.z*.9;c.beginPath();c.moveTo(x,y);c.lineTo(x+len*sl,y-len);c.stroke()}
  c.restore();
}


/* ================= 水面質感：遠近漸層、倒影、日月光帶、波光、螢火蟲 ================= */
function celestial(wy){const h=G.time/60;
  if(h>5&&h<19.2){const k=(h-5)/14.2;return{x:W*(.1+.8*k),el:Math.sin(k*Math.PI),col:h<7||h>17?'255,170,100':'255,250,220',moon:false}}
  const hh2=h<5?h+24:h,k=(hh2-19)/10;return{x:W*(.1+.8*k),el:Math.sin(k*Math.PI),col:'225,235,255',moon:true}}
function waterDress(c,wy,sky,fp,dt){
  const t=now,depth=H-wy,deep=G.area===6;
  // 1) 地平線附近混入天空顏色（越遠越亮）
  const sb=hexRgb(sky.bot),g=c.createLinearGradient(0,wy,0,wy+depth*(fp?.5:.3));
  g.addColorStop(0,`rgba(${sb[0]},${sb[1]},${sb[2]},${deep?.15:fp?.62:.45})`);g.addColorStop(1,`rgba(${sb[0]},${sb[1]},${sb[2]},0)`);c.fillStyle=g;c.fillRect(0,wy,W,depth*(fp?.5:.3));
  // 2) 岸景倒影：把水面上方的畫面一條條上下翻轉貼下來，隨波晃動
  if(!deep){const sq=fp?.55:.8,stripH=2,N=Math.min(90,Math.floor(Math.min(wy*.9,(fp?depth*.35:70*S))/stripH));
    c.save();for(let i=0;i<N;i++){const dy=wy+i*stripH,sy=(wy-(i+1)*stripH/sq),ox=Math.sin(t*1.8+i*.45)*(.6+i*.06)*S;
      if(sy<0)break;c.globalAlpha=.42*(1-i/N)*(1-sky.dark*.4);c.drawImage(cv,0,Math.max(0,sy*DPR),cv.width,Math.max(1,stripH/sq*DPR),ox,dy,W,stripH+.5)}
    c.restore();}
  // 3) 太陽／月亮的光帶
  const cel=celestial(wy);if(cel.el>0&&!(deep)){const len=depth*(fp?.95:.28),n=fp?46:18,str=cel.moon?(.55*sky.dark):(cel.el<.35?.8:.45);
    c.save();for(let j=0;j<n;j++){const u=j/n,y=wy+3+Math.pow(u,fp?1.6:1.2)*len,w=(6+u*(fp?70:26))*S*(.6+.4*Math.sin(t*3+j*1.7)),a=str*(1-u*.75)*(.45+.55*Math.abs(Math.sin(t*2.2+j*2.3)));
      c.fillStyle=`rgba(${cel.col},${a})`;const xo=Math.sin(t*1.5+j)*4*S;c.fillRect(cel.x-w/2+xo,y,w,Math.max(1.2,(1+u*3)*S*.8))}
    c.restore()}
  // 4) 遠處細碎波光
  c.save();for(let i=0;i<40;i++){const fx=((i*0.6180339)%1),fq=((i*0.3819)%1),u=Math.pow(fq,2),x=fx*W+Math.sin(t*.4+i)*20,y=wy+2+u*depth*(fp?.45:.2);
    const a=Math.max(0,Math.sin(t*2.5+i*3.1))*(1-u)*(sky.dark>.6?.25:.6);if(a<.05)continue;c.fillStyle=`rgba(255,255,255,${a})`;c.fillRect(x,y,(2+u*6)*S,1)}
  c.restore();
}
const flies=[...Array(28)].map(()=>({x:Math.random(),y:Math.random(),ph:Math.random()*9,sp:.3+Math.random()*.6}));
function drawFireflies(c,wy,fp){
  const p=period(),a=G.area;if(!(p==='night'&&(a===0||a===1)&&!isRaining()))return;
  c.save();c.globalCompositeOperation='lighter';
  flies.forEach(f=>{f.ph+=.016;const x=((f.x+Math.sin(f.ph*f.sp)*.03+1)%1)*W,y=fp?fpHz()-30*S+f.y*(H-fpHz())*.55+Math.sin(f.ph*f.sp*1.3)*10*S:wy-110*S+f.y*150*S+Math.sin(f.ph*f.sp*1.3)*10*S;
    const lit=Math.max(0,Math.sin(f.ph*1.7+f.x*20));if(lit<.05)return;const sc=fp?fpScale(fpQ(Math.max(fpHz(),y))):1,r=(10+lit*8)*S*sc;
    const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(230,255,140,${.9*lit})`);g.addColorStop(.25,`rgba(190,255,90,${.35*lit})`);g.addColorStop(1,'rgba(160,255,80,0)');c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,7);c.fill()});
  c.restore();
}

/* ================= 畫面震動 ================= */
let shake=0;function addShake(v){shake=Math.max(shake,v)}

/* ================= GSAP 介面動畫層 ================= */
const GA=(function(){
  const g=window.gsap,RM=matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!g||RM)return{ok:false,modal(){},list(){},coins(){},toast(){},pop(){}};
  let shownCoins=null;
  return{ok:true,
    modal(sel){g.fromTo('#modal',{scale:.86,opacity:0,y:30},{scale:1,opacity:1,y:0,duration:.38,ease:'back.out(1.6)'});if(sel)g.from(sel,{y:18,opacity:0,duration:.35,stagger:.05,delay:.1,ease:'power2.out',clearProps:'all'})},
    list(sel,o={}){g.from(sel,Object.assign({opacity:0,y:14,scale:.92,duration:.3,stagger:.02,ease:'back.out(1.4)',clearProps:'all'},o))},
    coins(v){const el=$('#coinP');if(shownCoins===null){shownCoins=v;el.textContent='💰 '+v.toLocaleString();return}
      if(v===shownCoins)return;const o={n:shownCoins};shownCoins=v;g.killTweensOf(o);
      g.to(o,{n:v,duration:Math.min(1.2,.4+Math.abs(v-o.n)/4000),ease:'power2.out',onUpdate:()=>{el.textContent='💰 '+Math.round(o.n).toLocaleString()}});
      g.fromTo(el,{scale:1.25},{scale:1,duration:.5,ease:'elastic.out(1,.4)'})},
    toast(){g.fromTo('#toast',{y:-16,scale:.9},{y:0,scale:1,duration:.35,ease:'back.out(2)'})},
    pop(sel){g.fromTo(sel,{scale:1.3},{scale:1,duration:.45,ease:'elastic.out(1,.4)'})}
  };
})();

/* ================= 主迴圈 ================= */
let last=performance.now(),saveT=0,timeT=0;
function loop(ts){
  const dt=Math.min(.05,(ts-last)/1000);last=ts;now+=dt;
  if(!modalOpen){G.time=(G.time+dt*6)%1440}
  if(st==='charging'){power+=powDir*dt*1.1;if(power>1){power=1;powDir=-1}if(power<0){power=0;powDir=1}}
  if(st==='waiting'&&now>=biteAt){st='bite';biteEnd=now+(1-hooked.rar*.08);SFX.bite();bigSplash(bob.tx,bob.ty,1);addShake(6*S);ripples.push({x:bob.tx,y:bob.ty,r:4,a:1});addSplash(bob.tx,bob.ty,8);if(navigator.vibrate)try{navigator.vibrate(80)}catch(e){}}
  if(st==='bite'&&now>biteEnd){st='idle';toast('魚跑掉了…浮標沉下去要馬上點擊！');hooked=null}
  if(st==='reeling'&&mg&&!modalOpen)updateMg(dt);
  ctx.clearRect(0,0,W,H);ctx.save();if(shake>.3){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=Math.pow(.004,dt)}else shake=0;if(G.fp)drawFP(dt);else drawScene(dt);ctx.restore();updateWeather(dt);PFX.tick(dt);
  animCvs.forEach(a=>{const x=a.cv.getContext('2d');x.clearRect(0,0,a.cv.width,a.cv.height);drawFishFit(x,a.f,a.cv.width,a.cv.height,{t:now,sil:a.sil,glowBlur:26})});
  rodCvs.forEach(o=>{const x=o.cv.getContext('2d');x.clearRect(0,0,300,90);x.fillStyle='rgba(0,20,40,.35)';rr(x,0,0,300,90,14);x.fill();drawRod(x,22,70,150,40,282,20,o.i,2.4,now)});
  updateHint();timeT-=dt;if(timeT<=0){updateTime();timeT=.25}
  saveT+=dt;if(saveT>10){saveT=0;save()}
  requestAnimationFrame(loop);
}
// 開始畫面
(function(){const c=$('#startCv'),x=c.getContext('2d');const picks=[FISH[13],FISH[42],FISH[57],FISH[73],FISH[104]];let t=0;
  function anim(){if($('#start').style.display==='none')return;t+=.016;x.clearRect(0,0,c.width,c.height);picks.forEach((f,i)=>{const cx=90+i*165,cy=130+Math.sin(t*2+i)*16;x.save();x.translate(cx-80,cy-65);drawFishFit(x,f,160,130,{t:t+i});x.restore()});requestAnimationFrame(anim)}anim();})();
$('#startB').onclick=()=>{initAudio();$('#start').style.display='none';SFX.click();if(window._waveLP)window._waveLP.frequency.value=G.area===6?180:420;
  MFX.play(MFX.intro('釣魚圖鑑大冒險',AREAS[G.area].name+' · 圖鑑 '+caughtCount()+'/105','🎣'));
  if(!G.total)setTimeout(()=>toast('按住畫面蓄力，放開拋竿！浮標沉下去時快點擊 🎣',4000),2600)};
renderBait();updateHud();updateTime();requestAnimationFrame(loop);
