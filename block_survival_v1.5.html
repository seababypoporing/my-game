<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">

<title>方塊求生：日夜之戰</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#0c0e14;font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif;color:#f3f0e6;touch-action:none}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
body.free canvas#gl{cursor:none}
.px{image-rendering:pixelated;image-rendering:crisp-edges}
.panel{background:rgba(22,24,32,.82);border:3px solid #07080b;border-radius:6px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.13),inset -3px -3px 0 rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.45)}
.btn{font:inherit;font-weight:900;color:#fff;cursor:pointer;border:3px solid #07080b;border-radius:6px;padding:12px 26px;font-size:20px;text-shadow:2px 2px 0 rgba(0,0,0,.55);
 background:linear-gradient(#6fbf46,#3f8a2a);box-shadow:inset 0 0 0 2px rgba(255,255,255,.28),inset -3px -4px 0 rgba(0,0,0,.3),0 5px 0 #07080b;transition:transform .08s}
.btn:hover{filter:brightness(1.12)}.btn:active{transform:translateY(3px);box-shadow:inset 0 0 0 2px rgba(255,255,255,.28),inset -3px -4px 0 rgba(0,0,0,.3),0 2px 0 #07080b}
.btn.alt{background:linear-gradient(#8a8f9c,#5b606c)}.btn.org{background:linear-gradient(#f0a43a,#c8661d)}
.btn.sm{padding:7px 14px;font-size:15px}
.t-shadow{text-shadow:2px 2px 0 #000,0 0 8px rgba(0,0,0,.6)}
#hud{position:fixed;inset:0;pointer-events:none;display:none}
#cross{position:absolute;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%)}
#cross:before,#cross:after{content:"";position:absolute;background:rgba(255,255,255,.9);box-shadow:0 0 0 1px rgba(0,0,0,.6)}
#cross:before{left:10px;top:2px;width:2px;height:18px}#cross:after{left:2px;top:10px;width:18px;height:2px}
#bowbar{position:absolute;left:50%;top:calc(50% + 22px);width:60px;height:6px;transform:translateX(-50%);background:rgba(0,0,0,.5);border:1px solid #000;display:none}
#bowbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f6d860,#f07b2a)}
#bottom{position:absolute;left:50%;bottom:calc(10px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px}
#stats{display:flex;gap:14px;align-items:flex-end;width:100%;justify-content:space-between}
#hearts,#armor{display:flex;gap:1px}
#hearts img,#armor img{width:22px;height:22px}
#ammo{font-weight:900;font-size:16px;padding:2px 10px}
#hotbar{display:flex;gap:3px;padding:4px}
.slot{position:relative;width:50px;height:50px;background:rgba(0,0,0,.45);border:2px solid #3a3d47;border-radius:4px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.06);pointer-events:auto}
.slot.sel{border-color:#ffe27a;box-shadow:0 0 0 2px #07080b,inset 0 0 0 2px rgba(255,226,122,.4),0 0 12px rgba(255,214,90,.6);transform:translateY(-3px)}
.slot img{position:absolute;left:7px;top:7px;width:32px;height:32px}
.slot b{position:absolute;right:3px;bottom:1px;font-size:13px;font-weight:900;text-shadow:1px 1px 0 #000,-1px -1px 0 #000}
.slot s{position:absolute;left:3px;top:0;font-size:11px;color:#bbb;text-decoration:none;text-shadow:1px 1px 0 #000}
#sname{font-weight:900;font-size:15px;height:20px}
#clock{position:absolute;left:50%;top:calc(10px + env(safe-area-inset-top));transform:translateX(-50%);padding:6px 14px;display:flex;align-items:center;gap:10px;font-weight:900}
#clock img{width:26px;height:26px}
#clock .bar{width:120px;height:8px;background:#000;border:1px solid #444;position:relative;overflow:hidden}
#clock .bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#f6d860,#f0973a)}
#res{position:absolute;right:calc(10px + env(safe-area-inset-right));top:calc(74px + env(safe-area-inset-top));padding:6px 8px;display:grid;grid-template-columns:repeat(2,auto);gap:3px 10px;font-weight:900;font-size:14px}
#res div{display:flex;align-items:center;gap:4px}#res img{width:20px;height:20px}
#kills{position:absolute;left:calc(10px + env(safe-area-inset-left));top:calc(10px + env(safe-area-inset-top));padding:6px 12px;font-weight:900;font-size:14px;line-height:1.5}
#msg{position:absolute;left:50%;top:26%;transform:translateX(-50%);text-align:center;font-weight:900;font-size:40px;white-space:nowrap;pointer-events:none}
#msg span{display:inline-block;opacity:0;transform:translateY(20px) scale(.6)}
#msg small{display:block;font-size:18px;margin-top:6px;opacity:0}
#tip{position:absolute;left:50%;bottom:150px;transform:translateX(-50%);font-weight:800;font-size:15px;padding:5px 12px;opacity:0;transition:opacity .3s;white-space:nowrap}
#saveInd{position:fixed;right:14px;top:calc(180px + env(safe-area-inset-top));font-weight:900;font-size:13px;padding:4px 10px;opacity:0;transition:opacity .4s;pointer-events:none;z-index:6}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 45%,rgba(200,0,0,.65) 100%);opacity:0}
#water{position:fixed;inset:0;pointer-events:none;background:rgba(30,80,170,.35);display:none}
#nums{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#nums div{position:absolute;font-weight:900;font-size:22px;transform:translate(-50%,-50%);text-shadow:2px 2px 0 #000;white-space:nowrap}
.ovl{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:20}
#title{display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 42%,rgba(5,8,16,.62) 0%,rgba(5,8,16,.25) 45%,rgba(0,0,0,0) 75%)}
#logo{font-size:min(15vw,96px);font-weight:900;letter-spacing:.06em;line-height:1;text-align:center;color:#fff;
 text-shadow:0 4px 0 #3c7a24,0 8px 0 #2a5419,0 12px 0 #07080b,0 0 30px rgba(120,220,90,.45)}
#logo em{font-style:normal;color:#ffd86a;text-shadow:0 4px 0 #b06a1a,0 8px 0 #6e3d0c,0 12px 0 #07080b,0 0 30px rgba(255,190,80,.5)}
#sub{margin:22px 0 6px;font-size:min(5vw,22px);font-weight:900}
#caption{height:34px;margin-bottom:18px;font-size:min(4.4vw,19px);font-weight:900;color:#ffe9a8}
#tbtns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
#help{margin-top:18px;font-size:13px;line-height:1.7;padding:10px 16px;max-width:560px;text-align:center;color:#ddd}
#craft .box,#pause .box,#dead .box{padding:18px 20px;min-width:300px;max-width:94vw;max-height:88vh;overflow:auto}
h2{font-size:26px;font-weight:900;margin-bottom:10px;text-align:center}
.rec{display:flex;align-items:center;gap:10px;padding:7px 8px;border-bottom:2px solid rgba(255,255,255,.06)}
.rec .nm{flex:1;font-weight:900;font-size:15px}
.rec .need{display:flex;gap:6px;font-size:13px;font-weight:800;color:#ccc}
.rec .need span{display:flex;align-items:center;gap:2px}.rec .need img{width:18px;height:18px}
.rec .need .no{color:#ff7b6b}
.rec button{min-width:64px}

.inv{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0 12px}
.inv span{display:flex;align-items:center;gap:3px;font-weight:900;font-size:13px;background:rgba(0,0,0,.35);padding:3px 6px;border-radius:4px}
.inv img{width:18px;height:18px}
.row{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
#touch{position:fixed;inset:0;display:none;z-index:5;pointer-events:none}
#joy{position:absolute;left:calc(20px + env(safe-area-inset-left));bottom:calc(120px + env(safe-area-inset-bottom));width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.08);border:3px solid rgba(255,255,255,.22);pointer-events:auto}
#joy i{position:absolute;left:40px;top:40px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.35);border:3px solid rgba(0,0,0,.4)}
.tb{position:absolute;pointer-events:auto;width:66px;height:66px;border-radius:12px;background:rgba(20,22,30,.6);border:3px solid rgba(255,255,255,.25);color:#fff;font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center;text-shadow:1px 1px 0 #000}
.tb.on{background:rgba(255,214,90,.45)}
#tAtk{right:calc(24px + env(safe-area-inset-right));bottom:calc(150px + env(safe-area-inset-bottom));width:84px;height:84px;border-radius:50%;font-size:17px;background:rgba(200,60,40,.5)}
#tJump{right:calc(120px + env(safe-area-inset-right));bottom:calc(120px + env(safe-area-inset-bottom))}
#tPlace{right:calc(30px + env(safe-area-inset-right));bottom:calc(250px + env(safe-area-inset-bottom))}
#tEat{right:calc(120px + env(safe-area-inset-right));bottom:calc(200px + env(safe-area-inset-bottom));width:54px;height:54px;font-size:13px}
#tStealth{right:calc(200px + env(safe-area-inset-right));bottom:calc(160px + env(safe-area-inset-bottom));width:58px;height:58px;font-size:14px;background:rgba(120,160,255,.35)}
#bossbar{position:absolute;left:50%;top:calc(64px + env(safe-area-inset-top));transform:translateX(-50%);width:min(440px,80vw);padding:5px 10px 8px;display:none;text-align:center;font-weight:900;font-size:15px}
#bossbar .bar{height:12px;background:#1a0a0a;border:2px solid #000;margin-top:4px;position:relative;overflow:hidden;border-radius:3px}#bossbar .bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#ff3a3a,#ff9a3a);transition:width .15s}
#powers{display:flex;gap:4px;font-size:12px;font-weight:900;margin-bottom:2px;flex-wrap:wrap}#powers span{background:rgba(0,0,0,.5);border:1px solid #000;border-radius:4px;padding:1px 5px}
#stealthFx{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 40%,rgba(90,120,255,.45) 100%);opacity:0;transition:opacity .4s;z-index:3}
#tCraft{left:calc(14px + env(safe-area-inset-left));top:calc(86px + env(safe-area-inset-top));width:58px;height:46px;font-size:14px}
#tPause{left:calc(80px + env(safe-area-inset-left));top:calc(86px + env(safe-area-inset-top));width:58px;height:46px;font-size:14px}
#sndbar{position:fixed;right:calc(12px + env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top));z-index:25;display:flex;gap:8px}
.rbtn{position:relative;width:52px;height:52px;border-radius:50%;font-size:24px;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;border:3px solid #07080b;background:linear-gradient(#8a8f9c,#5b606c);box-shadow:inset 0 0 0 2px rgba(255,255,255,.28),0 4px 0 #07080b}
.rbtn.off{opacity:.5}.rbtn.off:after{content:'';position:absolute;left:8px;right:8px;top:50%;height:4px;background:#ff5a4a;transform:rotate(-40deg);border-radius:2px;box-shadow:0 0 0 1px #000}
#tbtns2{justify-content:center}
@media (min-width:800px){#tbtns2{justify-content:flex-start!important}#title{align-items:flex-start;padding-left:7vw;background:linear-gradient(90deg,rgba(5,8,16,.72) 0%,rgba(5,8,16,.4) 40%,rgba(0,0,0,0) 68%)}#logo{text-align:left}#help{text-align:left;max-width:470px}#tbtns{justify-content:flex-start}}
@media (max-width:640px){.slot{width:38px;height:38px}.slot img{left:4px;top:4px;width:26px;height:26px}#hearts img,#armor img{width:16px;height:16px}#res{font-size:12px}#res img{width:16px;height:16px}#msg{font-size:28px}#kills{display:none}#clock .bar{width:70px}#clock{font-size:13px;gap:6px;padding:4px 8px;white-space:nowrap;left:calc(10px + env(safe-area-inset-left));transform:none}#clkTxt{display:none}#clock img{width:20px;height:20px}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="water"></div><div id="stealthFx"></div><div id="portalFx" style="position:fixed;inset:0;pointer-events:none;opacity:0;z-index:4"></div>
<div id="vig"></div><div id="saveInd" class="panel t-shadow">💾 已存檔</div>
<div id="nums"></div>
<div id="hud">
 <div id="cross"></div><div id="bowbar"><i></i></div>
 <div id="bossbar" class="panel t-shadow"><span id="bossName"></span><div class="bar"><i id="bossHp"></i></div></div><div id="clock" class="panel t-shadow"><img id="clkIcon" class="px"><span id="clkDay">第 1 天</span><div class="bar"><i id="clkBar"></i></div><span id="clkTxt"></span></div>
 <div id="kills" class="panel t-shadow"></div>
 <div id="res" class="panel t-shadow"></div>
 <div id="msg" class="t-shadow"></div>
 <div id="tip" class="panel t-shadow"></div>
 <div id="bottom">
  <div id="sname" class="t-shadow"></div>
  <div id="stats"><div><div id="powers"></div><div id="armor"></div><div id="hearts"></div></div><div id="ammo" class="panel t-shadow"></div></div>
  <div id="hotbar" class="panel"></div>
 </div>
</div>
<div id="touch">
 <div id="joy"><i></i></div>
 <div class="tb" id="tAtk">攻擊</div><div class="tb" id="tJump">跳</div><div class="tb" id="tPlace">放置</div>
 <div class="tb" id="tEat">吃</div><div class="tb" id="tStealth" style="display:none">隱身</div><div class="tb" id="tCraft">合成</div><div class="tb" id="tPause">暫停</div>
</div>
<div id="title" class="ovl">
 <div id="logo">方塊<em>求生</em></div>
 <div id="sub" class="t-shadow">白天採集・夜晚守住你的家</div>
 <div id="caption" class="t-shadow"></div>
 <div id="tbtns"><button class="btn" id="bCont" style="display:none">▶ 繼續遊戲</button><button class="btn" id="bStart">開始冒險</button></div><div id="tbtns2" style="display:flex;gap:10px;margin-top:10px;flex-wrap:wrap"><button class="btn sm alt" id="bImport">📥 匯入紀錄</button><button class="btn sm alt" id="bExport2" style="display:none">📤 匯出紀錄</button></div><div id="saveInfo" class="t-shadow" style="margin-top:10px;font-size:14px;font-weight:800;color:#cfe8b8"></div>
 <div id="help" class="panel">電腦：WASD 移動・滑鼠看・Space 跳・Shift 跑・左鍵 挖掘／攻擊（按住拉弓）・右鍵 放置方塊<br>1–9 或滾輪 換道具（再按一次方塊格可切換種類）・C 合成・F 吃蘋果・Esc 暫停<br>手機：左邊搖桿移動、右邊滑動看、按鈕操作</div>
</div>
<div id="craft" class="ovl"><div class="box panel"><h2>⚒ 合成台</h2><div class="inv" id="cInv"></div><div id="cList"></div><div class="row"><button class="btn sm alt" id="bCraftClose">關閉 (C)</button></div></div></div>
<div id="io" class="ovl" style="z-index:30;background:rgba(5,7,12,.7)"><div class="box panel" style="padding:18px 20px;width:min(560px,94vw);text-align:center"><h2 id="ioTitle"></h2><div id="ioDesc" style="font-size:14px;line-height:1.7;font-weight:700;margin-bottom:10px"></div>
<textarea id="ioText" spellcheck="false" style="width:100%;height:140px;font:12px/1.4 monospace;background:#0c0e14;color:#cfe8b8;border:2px solid #3a3d47;border-radius:6px;padding:8px;user-select:text;-webkit-user-select:text"></textarea>
<input type="file" id="ioFile" accept=".json,.txt,application/json,text/plain" style="display:none">
<div class="row" id="ioBtns"></div></div></div>

<div id="sndbar"><button class="rbtn" id="bMus" title="音樂">🎵</button><button class="rbtn" id="bSfx" title="音效">🔊</button></div>
<script>
'use strict';
// =================== 基本工具 ===================
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hash2(x,z,s){let h=Math.imul(x|0,374761393)^Math.imul(z|0,668265263)^Math.imul(s|0,1442695041);h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return(h>>>0)/4294967296;}
function vnoise(x,z,s){const xi=Math.floor(x),zi=Math.floor(z),xf=x-xi,zf=z-zi,u=xf*xf*(3-2*xf),v=zf*zf*(3-2*zf);
 const a=hash2(xi,zi,s),b=hash2(xi+1,zi,s),c=hash2(xi,zi+1,s),d=hash2(xi+1,zi+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
function fbm(x,z,s,o){let t=0,a=1,f=1,n=0;for(let i=0;i<o;i++){t+=vnoise(x*f,z*f,s+i*17)*a;n+=a;a*=.5;f*=2;}return t/n;}
// 可無縫平鋪的貼圖雜訊
function tn(x,y,s,c){const fx=x/16*c,fy=y/16*c,xi=Math.floor(fx),yi=Math.floor(fy),xf=fx-xi,yf=fy-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
 const h=(a,b)=>hash2(((a%c)+c)%c,((b%c)+c)%c,s);const A=h(xi,yi),B=h(xi+1,yi),C=h(xi,yi+1),D=h(xi+1,yi+1);return A+(B-A)*u+(C-A)*v+(A-B-C+D)*u*v;}

// =================== 程序貼圖（像素風格） ===================
const atlas=document.createElement('canvas');atlas.width=256;atlas.height=128;const AX=atlas.getContext('2d');
let tr=mulberry32(9127);
const c255=v=>v<0?0:v>255?255:v|0;
function paint(t,f){const ox=(t%16)*16,oy=(t>>4)*16,im=AX.createImageData(16,16);
 for(let y=0;y<16;y++)for(let x=0;x<16;x++){const c=f(x,y),i=(y*16+x)*4;im.data[i]=c255(c[0]);im.data[i+1]=c255(c[1]);im.data[i+2]=c255(c[2]);im.data[i+3]=c.length>3?c[3]:255;}
 AX.putImageData(im,ox,oy);}
const jit=(c,v)=>{const k=(tr()*2-1)*v;return[c[0]+k,c[1]+k,c[2]+k];};
const shadeC=(c,k)=>[c[0]*k,c[1]*k,c[2]*k];
