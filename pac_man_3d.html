<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>3D 小精靈 Pac-Man</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root { color-scheme: dark; --bg:#05060f; --fg:#f4f1de; --yellow:#ffd60a; --muted:#8d93b5; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font-family:-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; overflow:hidden; }
  #wrap { position:fixed; top:0; left:0; right:0; bottom:0; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  canvas { display:block; width:100%; height:100%; }
  #hud { position:absolute; top:calc(env(safe-area-inset-top,0px) + 10px); left:14px; right:14px; display:flex; justify-content:space-between; font-weight:700; font-size:1.05rem; pointer-events:none; text-shadow:0 2px 6px #000; }
  #hud span b { color:var(--yellow); }
  #overlay { position:absolute; top:0; left:0; right:0; bottom:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; background:rgba(5,6,15,.72); padding:24px; cursor:pointer; }
  #overlay h1 { font-size:clamp(2rem,8vw,3.4rem); margin:0 0 10px; color:var(--yellow); letter-spacing:.04em; }
  #overlay p { margin:4px 0; color:var(--muted); line-height:1.6; }
  #overlay .go { margin-top:18px; padding:12px 26px; border-radius:999px; background:var(--yellow); color:#111; font-weight:800; }
  #pad { position:absolute; bottom:calc(env(safe-area-inset-bottom,0px) + 14px); left:0; right:0; display:none; justify-content:space-between; padding:0 18px; pointer-events:none; }
  @media (pointer:coarse) { #pad { display:flex; } }
  #pad .grp { display:grid; grid-template-columns:repeat(3,56px); grid-template-rows:repeat(2,56px); gap:6px; pointer-events:auto; }
  #pad button { border:1px solid #3a4070; background:rgba(20,24,52,.75); color:var(--fg); border-radius:12px; font-size:1.3rem; touch-action:manipulation; }
  #pad .jump { width:96px; height:96px; align-self:end; border-radius:50%; background:rgba(255,214,10,.85); color:#111; font-weight:800; pointer-events:auto; }
  #banner { position:absolute; top:16%; left:0; right:0; text-align:center; font-size:clamp(1.4rem,6vw,2.4rem); font-weight:800; color:#ffd60a; text-shadow:0 3px 14px #000; pointer-events:none; opacity:0; }
  #banner.show { animation:bn 2.6s ease-out; }
  @keyframes bn { 0% { opacity:0; transform:translateY(14px); } 15%,70% { opacity:1; transform:none; } 100% { opacity:0; } }
  #toast { position:absolute; top:28%; left:0; right:0; text-align:center; font-size:1.7rem; font-weight:800; color:#ffd60a; text-shadow:0 2px 10px #000; pointer-events:none; opacity:0; }
  #toast.show { animation:tt 1.1s ease-out; }
  @keyframes tt { 0% { opacity:0; transform:translateY(12px) scale(.8); } 20% { opacity:1; transform:none; } 80% { opacity:1; } 100% { opacity:0; transform:translateY(-14px); } }
  .shop { margin-top:12px; display:flex; flex-direction:column; gap:8px; align-items:stretch; min-width:260px; max-width:360px; }
  .shop .sl { color:#ffd60a; font-weight:700; line-height:1.5; }
  .shop button { background:#1c2142; color:#f4f1de; border:1px solid #3a4070; border-radius:12px; padding:12px 14px; font-size:1rem; cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:12px; font-family:inherit; }
  .shop button:hover { border-color:#ffd60a; }
  .shop button i { font-style:normal; color:#ffd60a; font-weight:700; white-space:nowrap; }
  .shop .sm { color:#8d93b5; font-size:.82rem; min-height:1.3em; }
  .ovl #pad { display:none !important; }
  #pad .rb { display:flex; flex-direction:column; align-items:flex-end; gap:10px; pointer-events:none; }
  #pad .god { width:58px; height:58px; border-radius:50%; background:rgba(60,120,255,.85); color:#fff; font-size:1.4rem; border:none; pointer-events:auto; }
  #left { position:absolute; top:calc(env(safe-area-inset-top,0px) + 40px); right:14px; text-align:right; font-weight:700; font-size:.95rem; line-height:1.45; text-shadow:0 2px 6px #000; pointer-events:none; }
  #left b { color:#ffd60a; font-variant-numeric:tabular-nums; }
  html, body { touch-action:none; overscroll-behavior:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
  #mute { position:absolute; top:calc(env(safe-area-inset-top,0px) + 40px); left:12px; width:42px; height:42px; border-radius:50%; border:1px solid #3a4070; background:rgba(20,24,52,.7); color:#f4f1de; font-size:1.1rem; }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud"><span>分數 <b id="score">0</b></span><span>第 <b id="lv">1</b> 關<b id="fl"></b></span><span>🪙 <b id="coins">0</b> ⚡<b id="gods">0</b></span><span>生命 <b id="lives">❤❤❤</b></span></div>
  <div id="banner"></div>
  <div id="toast"></div>
  <div id="left"></div>
  <button id="mute" aria-label="音效">🔊</button>
  <div id="overlay">
    <h1 id="ot">3D 小精靈</h1>
    <p id="om">方向鍵 / WASD 移動 ・ <b>空白鍵</b> 跳起來閃過鬼</p>
    <p>吃光所有豆子就過關,共 5 個不同場景,第 N 關有 N 層樓,走到金色圓圈的樓梯就能上下樓;吃大力丸後吃鬼可得 🪙10 元,過關後到商店買愛心或無敵道具(按 <b>E</b> 使用無敵)</p>
    <p>📱 手機/平板:在畫面上<b>滑動</b>移動、<b>輕點</b>跳躍,也可用左下方向鍵、右下「跳!」和 ⚡ 鈕</p>
    <div class="go" id="og">點擊或按任意鍵開始</div>
  </div>
  <div id="pad">
    <div class="grp"><span></span><button data-d="u">▲</button><span></span><button data-d="l">◀</button><button data-d="d">▼</button><button data-d="r">▶</button></div>
    <div class="rb"><button class="god" id="gbtn">⚡</button><button class="jump" id="jbtn">跳!</button></div>
  </div>
</div>
<script>
const MAP0 = [
"111111111111111","120000010000021","101110101011101","100000000000001","101011101110101",
"100010000010001","111010111010111","100000030000001","111010111010111","100010000010001",
"101011101110101","100000000000001","101110101011101","120000010000021","111111111111111"];
const W = 15, H = 15, OFF = 7;
let FL = [MAP0]; // 目前這一關每一層樓的地圖
const open = (x, z, f = 0) => x >= 0 && z >= 0 && x < W && z < H && FL[f][z][x] !== '1';
const DIRS = [[1,0],[-1,0],[0,1],[0,-1]];
const wx = x => x - OFF, wz = z => z - OFF;
let MAP = MAP0;
function rng(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function genMaze(seed) { // 隨機迷宮:先挖出一條相通的路,再打通幾道牆做出可以繞圈逃跑的路線
  const r = rng(seed), g = Array.from({ length: 15 }, () => Array(15).fill('1')), stack = [[1, 1]]; g[1][1] = '0';
  while (stack.length) {
    const [x, z] = stack[stack.length - 1];
    const nb = [[2, 0], [-2, 0], [0, 2], [0, -2]].filter(([dx, dz]) => { const a = x + dx, b = z + dz; return a > 0 && b > 0 && a < 14 && b < 14 && g[b][a] === '1'; });
    if (!nb.length) { stack.pop(); continue; }
    const [dx, dz] = nb[Math.floor(r() * nb.length)];
    g[z + dz / 2][x + dx / 2] = '0'; g[z + dz][x + dx] = '0'; stack.push([x + dx, z + dz]);
  }
  const walls = [];
  for (let z = 1; z < 14; z++) for (let x = 1; x < 14; x++) if (g[z][x] === '1' &&
    ((x % 2 === 0 && z % 2 === 1 && g[z][x - 1] !== '1' && g[z][x + 1] !== '1') || (x % 2 === 1 && z % 2 === 0 && g[z - 1][x] !== '1' && g[z + 1][x] !== '1'))) walls.push([x, z]);
  for (let i = walls.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [walls[i], walls[j]] = [walls[j], walls[i]]; }
  walls.slice(0, 13).forEach(([x, z]) => g[z][x] = '0');
  [[1, 1], [13, 1], [1, 13], [13, 13]].forEach(([x, z]) => g[z][x] = '2');
  g[7][7] = '3';
  return g.map(row => row.join(''));
}
const GEN_H = [[3, 3], [11, 3], [3, 11], [11, 11]];
const THEMES = [
  { name: '霓虹迷宮', bg: 0x05060f, wall: 0x2a47ff, wallE: 0x0a1470, floor: 0x0b0e22, amb: 0x8890c0, deco: 'pillar', dc: 0x35e0e0 },
  { name: '熔岩洞窟', bg: 0x150604, wall: 0xd9441f, wallE: 0x5a1400, floor: 0x1f0b08, amb: 0xc08060, deco: 'cone', dc: 0xff7a1a },
  { name: '冰雪世界', bg: 0x0b1d2c, wall: 0x7fd6ff, wallE: 0x1a5a7a, floor: 0x12354a, amb: 0xa8d8f0, deco: 'oct', dc: 0xd8f4ff },
  { name: '魔幻森林', bg: 0x04100a, wall: 0x2fa84f, wallE: 0x0d4a1c, floor: 0x09190e, amb: 0x80c090, deco: 'tree', dc: 0x1f8f3f },
  { name: '星際太空', bg: 0x07030f, wall: 0xa04dff, wallE: 0x35106a, floor: 0x0d0618, amb: 0xa090e0, deco: 'star', dc: 0xfff2b0 }
];
const FH = 3.2; // 每層樓的高度
function genLevel(nf, seed, th, ng) { // 第 N 關有 N 層樓;樓梯優先放在四個角落,3 層以上再隨機多加一座
  const r = rng(seed * 7 + 3), floors = [], stairs = [];
  for (let f = 0; f < nf; f++) { const m = genMaze(seed + f * 17).map(row => row.split('')); if (f > 0) m[7][7] = '0'; floors.push(m); }
  const corners = [[1, 1], [13, 1], [1, 13], [13, 13]];
  for (let i = corners.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [corners[i], corners[j]] = [corners[j], corners[i]]; }
  for (let f = 0; f < nf - 1; f++) stairs.push({ f, x: corners[f % 4][0], z: corners[f % 4][1] });
  if (nf >= 3) {
    const f = Math.floor(r() * (nf - 1)); let x, z, tries = 0;
    do { x = 1 + 2 * Math.floor(r() * 7); z = 1 + 2 * Math.floor(r() * 7); tries++; }
    while (tries < 60 && ((x === 7 && z === 7) || corners.concat(GEN_H).some(c => c[0] === x && c[1] === z)));
    stairs.push({ f, x, z });
  }
  stairs.forEach(s => { floors[s.f][s.z][s.x] = '4'; floors[s.f + 1][s.z][s.x] = '4'; }); // 4 = 樓梯格(不放豆子)
  return { floors, stairs, gh: GEN_H.slice(0, ng).map((h, i) => [h[0], h[1], i % nf]), th };
}
const LEVELS = [
  { floors: [MAP0], stairs: [], gh: [[7, 3, 0], [1, 11, 0], [13, 11, 0]], th: 0 },
  genLevel(2, 11, 1, 3), genLevel(3, 23, 2, 4), genLevel(4, 37, 3, 4), genLevel(5, 51, 4, 4)
];

// ---- three.js setup ----
const wrap = document.getElementById('wrap');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, (window.matchMedia && matchMedia('(pointer:coarse)').matches) ? 1.5 : 2));
wrap.insertBefore(renderer.domElement, wrap.firstChild);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05060f);
scene.fog = new THREE.Fog(0x05060f, 10, 26);
const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 60);
function resize() { const w = wrap.clientWidth, h = wrap.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

const ambient = new THREE.AmbientLight(0x8890c0, 0.9); scene.add(ambient);
const plight = new THREE.PointLight(0xfff2b0, 1.2, 14); scene.add(plight);

const floor = new THREE.Mesh(new THREE.PlaneGeometry(W, H), new THREE.MeshStandardMaterial({ color: 0x0b0e22, roughness: 0.9 }));
floor.rotation.x = -Math.PI / 2; scene.add(floor);
const wallMat = new THREE.MeshStandardMaterial({ color: 0x2a47ff, emissive: 0x0a1470, roughness: 0.4 });
const wallGeo = new THREE.BoxGeometry(1, 1, 1);
const worldGroup = new THREE.Group(); scene.add(worldGroup);
let floorGroups = [], STAIRS = [];
const _m4 = new THREE.Matrix4();
const wallMats = [wallMat, wallMat.clone(), wallMat.clone(), wallMat.clone(), wallMat.clone()];
const stairMat = new THREE.MeshStandardMaterial({ color: 0xffc94d, emissive: 0x8a5a00 });
const ringMat = new THREE.MeshBasicMaterial({ color: 0xffd60a, side: THREE.DoubleSide });
function buildWorld() {
  worldGroup.clear(); floorGroups = [];
  for (let f = 0; f < FL.length; f++) {
    const g = new THREE.Group(); g.position.y = f * FH;
    if (f > 0) { // 上層樓板:樓梯口留洞,可以看到底下的階梯
      const sh = new THREE.Shape(); sh.moveTo(-W / 2, -H / 2); sh.lineTo(W / 2, -H / 2); sh.lineTo(W / 2, H / 2); sh.lineTo(-W / 2, H / 2); sh.lineTo(-W / 2, -H / 2);
      STAIRS.filter(s => s.f === f - 1).forEach(s => {
        const cx = wx(s.x), cy = -wz(s.z), p = new THREE.Path();
        p.moveTo(cx - .5, cy - .5); p.lineTo(cx - .5, cy + .5); p.lineTo(cx + .5, cy + .5); p.lineTo(cx + .5, cy - .5); p.lineTo(cx - .5, cy - .5); sh.holes.push(p);
      });
      const fm = new THREE.Mesh(new THREE.ShapeGeometry(sh), floor.material); fm.rotation.x = -Math.PI / 2; g.add(fm);
    }
    const wpos = []; for (let z = 0; z < H; z++) for (let x = 0; x < W; x++) if (FL[f][z][x] === '1') wpos.push([x, z]);
    const wm = new THREE.InstancedMesh(wallGeo, wallMats[f], Math.max(1, wpos.length)); wm.frustumCulled = false; wm.count = wpos.length;
    wpos.forEach(([x, z], i) => { _m4.makeScale(0.96, 1, 0.96); _m4.setPosition(wx(x), 0.5, wz(z)); wm.setMatrixAt(i, _m4); });
    wm.instanceMatrix.needsUpdate = true; g.add(wm);
    STAIRS.forEach(s => {
      if (s.f === f) { // 往上的階梯
        const sg = new THREE.Group(); sg.position.set(wx(s.x), 0, wz(s.z));
        for (let i = 0; i < 8; i++) { const b = new THREE.Mesh(new THREE.BoxGeometry(.9, .1, .125), stairMat); b.position.set(0, (i + 1) * FH / 8, .5 - (i + .5) / 8); sg.add(b); }
        g.add(sg);
      }
      if (s.f === f || s.f + 1 === f) { const rg = new THREE.Mesh(new THREE.RingGeometry(.32, .46, 24), ringMat); rg.rotation.x = -Math.PI / 2; rg.position.set(wx(s.x), 0.03, wz(s.z)); g.add(rg); }
    });
    worldGroup.add(g); floorGroups.push(g);
  }
}
const decoGroup = new THREE.Group(); scene.add(decoGroup);
function buildDeco(t) { // 迷宮外圍的場景裝飾
  decoGroup.clear(); const lit = new THREE.MeshStandardMaterial({ color: t.dc, emissive: t.dc, emissiveIntensity: .45, roughness: .5 });
  for (let i = 0; i < 48; i++) {
    let x, z; do { x = (Math.random() - .5) * 36; z = (Math.random() - .5) * 36; } while (Math.abs(x) < 8.8 && Math.abs(z) < 8.8);
    let m;
    if (t.deco === 'pillar') { const h = 1 + Math.random() * 4; m = new THREE.Mesh(new THREE.BoxGeometry(.4, h, .4), lit); m.position.y = h / 2; }
    else if (t.deco === 'cone') { const h = 2 + Math.random() * 2; m = new THREE.Mesh(new THREE.ConeGeometry(.7, h, 8), lit); m.position.y = h / 2; }
    else if (t.deco === 'oct') { m = new THREE.Mesh(new THREE.OctahedronGeometry(.5 + Math.random() * .6), lit); m.position.y = .6 + Math.random() * 2.5; m.rotation.set(Math.random() * 3, Math.random() * 3, 0); }
    else if (t.deco === 'tree') { m = new THREE.Group(); const k = new THREE.Mesh(new THREE.CylinderGeometry(.15, .15, .8, 8), new THREE.MeshStandardMaterial({ color: 0x6b4423 })); k.position.y = .4; const c = new THREE.Mesh(new THREE.ConeGeometry(.75, 1.8, 8), lit); c.position.y = 1.6; m.add(k, c); }
    else { m = new THREE.Mesh(new THREE.SphereGeometry(.08 + Math.random() * .12, 8, 8), new THREE.MeshBasicMaterial({ color: t.dc })); m.position.y = 1 + Math.random() * 6; }
    m.position.x = x; m.position.z = z; decoGroup.add(m);
  }
}
function applyTheme(i) {
  const t = THEMES[i];
  scene.background.setHex(t.bg); scene.fog.color.setHex(t.bg); floor.material.color.setHex(t.floor); ambient.color.setHex(t.amb);
  wallMats.forEach((m, f) => { m.color.setHex(t.wall); m.color.offsetHSL(0, 0, f * 0.04); m.emissive.setHex(t.wallE); }); buildDeco(t);
}

// pellets
const pelletGroup = new THREE.Group(); scene.add(pelletGroup);
const pMat = new THREE.MeshStandardMaterial({ color: 0xffe9a8, emissive: 0x9a7b20 });
const bMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xff9f1c });
let pellets = new Map(), floorLeft = [], pelletMeshes = [], bigList = [];
const pGeo = new THREE.SphereGeometry(0.1, 8, 6), bGeo = new THREE.SphereGeometry(0.26, 12, 10);
function setInst(mesh, i, x, y, z, sc) { _m4.makeScale(sc, sc, sc); _m4.setPosition(x, y, z); mesh.setMatrixAt(i, _m4); mesh.instanceMatrix.needsUpdate = true; }
function hidePellet(e) { setInst(e.mesh, e.i, 0, -50, 0, 0.0001); e.dead = true; }
function buildPellets() {
  pelletGroup.clear(); pellets.clear(); pelletMeshes = []; bigList = []; floorLeft = FL.map(() => 0);
  for (let f = 0; f < FL.length; f++) {
    const sm = [], bg = [];
    for (let z = 0; z < H; z++) for (let x = 0; x < W; x++) { const c = FL[f][z][x]; if (c === '1' || c === '3' || c === '4') continue; (c === '2' ? bg : sm).push([x, z]); }
    const small = new THREE.InstancedMesh(pGeo, pMat, Math.max(1, sm.length)), big = new THREE.InstancedMesh(bGeo, bMat, Math.max(1, bg.length));
    small.frustumCulled = big.frustumCulled = false; small.userData.f = big.userData.f = f; small.count = sm.length; big.count = bg.length;
    sm.forEach(([x, z], i) => { setInst(small, i, wx(x), f * FH + 0.4, wz(z), 1); pellets.set(f + ',' + x + ',' + z, { mesh: small, i, big: false, x, z, f }); floorLeft[f]++; });
    bg.forEach(([x, z], i) => { setInst(big, i, wx(x), f * FH + 0.4, wz(z), 1); const e = { mesh: big, i, big: true, x, z, f }; pellets.set(f + ',' + x + ',' + z, e); bigList.push(e); floorLeft[f]++; });
    pelletGroup.add(small); pelletGroup.add(big); pelletMeshes.push(small, big);
  }
}

// pac-man
const pacMesh = new THREE.Mesh(new THREE.SphereGeometry(0.38, 24, 18), new THREE.MeshStandardMaterial({ color: 0xffd60a, emissive: 0x6b5400 }));
scene.add(pacMesh);
const shadow = new THREE.Mesh(new THREE.CircleGeometry(0.35, 20), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.5 }));
shadow.rotation.x = -Math.PI / 2; shadow.position.y = 0.02; scene.add(shadow);

// ghosts
const GCOL = [0xff3b3b, 0xff8fd1, 0x35e0e0, 0xffa83a];
function makeGhost(color) {
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.25 });
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.36, 0.36, 0.4, 16), mat); body.position.y = 0.3;
  const top = new THREE.Mesh(new THREE.SphereGeometry(0.36, 16, 12, 0, Math.PI * 2, 0, Math.PI / 2), mat); top.position.y = 0.5;
  const eyeM = new THREE.MeshBasicMaterial({ color: 0xffffff });
  for (const s of [-1, 1]) { const e = new THREE.Mesh(new THREE.SphereGeometry(0.08, 8, 8), eyeM); e.position.set(s * 0.14, 0.58, 0.28); g.add(e); }
  g.add(body, top); g.userData.mat = mat; g.userData.color = color; scene.add(g); return g;
}
const ghostMeshes = GCOL.map(makeGhost);

// ---- game state ----
let GHOME = LEVELS[0].gh;
function mover(x, z, f) { f = f || 0; return { x, z, tx: x, tz: z, t: 1, dx: 0, dz: 0, f, ey: f * FH, cl: 0, lock: '' }; }
const mpos = m => ({ x: m.x + (m.tx - m.x) * m.t, z: m.z + (m.tz - m.z) * m.t });
function step(m, dist, choose) {
  while (dist > 0) {
    if (m.t >= 1) {
      m.x = m.tx; m.z = m.tz;
      const d = choose(m); if (!d) { m.t = 1; return; }

  camera.position.copy(camPos); camera.lookAt(camLook);
  renderer.render(scene, camera);
}
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (state === 'play') update(dt);
  render(dt); requestAnimationFrame(loop);
}
newGame(); requestAnimationFrame(loop);
</script>
