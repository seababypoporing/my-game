<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我的遊戲間</title>
<style>
:root{--bg:#f1f3fa;--card:#ffffff;--ink:#1b2140;--sub:#5a6385;--line:#d9deee;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#0f1430;--card:#19204a;--ink:#f2f0ea;--sub:#a4aed6;--line:#2c3566}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);background-color:var(--bg);
  background-image:radial-gradient(var(--line) 1.2px,transparent 1.2px);background-size:24px 24px;
  font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;line-height:1.6;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.wrap{max-width:980px;margin:0 auto;padding:48px 20px 56px}
header{text-align:center;margin-bottom:40px}
.dots{display:inline-flex;gap:8px;margin-bottom:14px}
.dots i{width:14px;height:14px;border-radius:4px;display:block}
h1{margin:0;font-size:clamp(34px,7vw,58px);font-weight:800;letter-spacing:.04em}
header p{margin:8px 0 0;color:var(--sub);font-size:17px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}

/* ===== 遊戲卡片 ===== */
.card{--c:#ffd23f;position:relative;display:flex;flex-direction:column;gap:6px;padding:24px 22px 20px;
  background:var(--card);color:inherit;text-decoration:none;border:2px solid var(--line);border-radius:20px;overflow:hidden;
  transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:var(--c)}
.card:hover,.card:focus-visible{transform:translateY(-5px);border-color:var(--c);box-shadow:0 10px 0 -2px var(--c)}
.card:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.ico{width:72px;height:72px;border-radius:18px;display:grid;place-items:center;font-size:40px;margin-bottom:8px;
  background:var(--c);background:color-mix(in srgb,var(--c) 28%,transparent)}
.card h2{margin:0;font-size:24px}
.tag{align-self:flex-start;font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;
  background:var(--c);background:color-mix(in srgb,var(--c) 30%,transparent);color:var(--ink)}
.card p{margin:4px 0 14px;color:var(--sub);font-size:15px;flex:1}
.go{font-weight:700;font-size:16px}
.go span{display:inline-block;transition:transform .18s ease}
.card:hover .go span,.card:focus-visible .go span{transform:translateX(6px)}
footer{text-align:center;margin-top:40px;color:var(--sub);font-size:14px}
@media (prefers-reduced-motion:reduce){.card,.go span{transition:none}.card:hover,.card:focus-visible{transform:none}.card:hover .go span{transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="dots" aria-hidden="true"><i style="background:#ffd23f"></i><i style="background:#ff8fab"></i><i style="background:#4cd38a"></i></div>
    <h1>我的遊戲間</h1>
    <p>挑一個遊戲，馬上開始玩</p>
  </header>

  <main class="grid">
    <!--
      新增遊戲：複製下面任一個 <a class="card"> 區塊，
      改掉 href（檔名）、顏色 --c、圖示、標題與說明即可。
      檔名要和 GitHub 上的檔案完全一致（注意大小寫）。
    -->

    <a class="card" style="--c:#ffd23f" href="pac_man_3d.html">
      <span class="ico" aria-hidden="true">👻</span>
      <h2>3D 小精靈</h2>
      <span class="tag">街機</span>
      <p>經典小精靈的 3D 版本，吃光豆子，小心別被鬼魂抓到。</p>
      <span class="go">開始遊玩 <span aria-hidden="true">→</span></span>
    </a>

    <a class="card" style="--c:#ff8fab" href="cat_sudoku_v1.1.html">
      <span class="ico" aria-hidden="true">🐱</span>
      <h2>貓咪數獨</h2>
      <span class="tag">益智</span>
      <p>貓咪主題的數獨，動動腦，把格子都填滿。</p>
      <span class="go">開始遊玩 <span aria-hidden="true">→</span></span>
    </a>

    <a class="card" style="--c:#4cd38a" href="kid_go_down_v0.3.html">
      <span class="ico" aria-hidden="true">🧒</span>
      <h2>小朋友下樓梯</h2>
      <span class="tag">動作 · v0.3</span>
      <p>一路往下走，躲開尖刺、記得補血，看你能下到幾層。</p>
      <span class="go">開始遊玩 <span aria-hidden="true">→</span></span>
    </a>
    <a class="card" style="--c:#4aa3ff" href="Snakes_Ladders.html">
      <span class="ico" aria-hidden="true">🐍</span>
      <h2>蛇棋</h2>
      <span class="tag">桌遊</span>
      <p>擲骰子往終點前進，遇到梯子往上爬，遇到蛇就滑下去。</p>
      <span class="go">開始遊玩 <span aria-hidden="true">→</span></span>
    </a>

    <a class="card" style="--c:#ff9f5a" href="poker_number_2_v0.3.html">
      <span class="ico" aria-hidden="true">🃏</span>
      <h2>大老二</h2>
      <span class="tag">紙牌 · v0.3</span>
      <p>和電腦對戰的撲克牌遊戲，可選 2 到 4 人，累積勝場或分數決勝負。</p>
      <span class="go">開始遊玩 <span aria-hidden="true">→</span></span>
    </a>
  </main>

  <footer>更多遊戲陸續加入中</footer>
</div>
</body>
</html>
