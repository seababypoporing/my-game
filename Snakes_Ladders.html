<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>蛇棋 Snakes &amp; Ladders</title>
<style>
  :root { --bg:#f4efe3; --card:#fffdf7; --fg:#26231d; --muted:#7b7466; --rule:#d9cfb8; --accent:#e0742f; --accent-fg:#fff; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#171512; --card:#221f1a; --fg:#f0eadc; --muted:#a39b8a; --rule:#3a352c; --accent:#f08a45; --accent-fg:#1b1208; } }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:var(--bg); color:var(--fg); font-family:-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; }
  body { padding:calc(env(safe-area-inset-top,0px) + 14px) 12px calc(env(safe-area-inset-bottom,0px) + 24px); display:flex; justify-content:center; touch-action:manipulation; }
  main { width:100%; max-width:600px; }
  h1 { margin:0 0 4px; font-size:1.5rem; }
  .sub { margin:0 0 14px; color:var(--muted); font-size:.88rem; line-height:1.55; }
  .card { background:var(--card); border:1px solid var(--rule); border-radius:16px; padding:20px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  .pick button, .btn { border:1px solid var(--rule); background:var(--card); color:var(--fg); border-radius:12px; padding:12px 16px; font-size:1rem; cursor:pointer; font-family:inherit; }
  .pick button { flex:1; font-weight:700; font-size:1.1rem; }
  .pick button.on { background:var(--accent); color:var(--accent-fg); border-color:var(--accent); }
  .btn.p { background:var(--accent); color:var(--accent-fg); border-color:var(--accent); font-weight:800; }
  .btn:disabled { opacity:.45; cursor:default; }
  label.opt { display:flex; align-items:center; gap:8px; margin:14px 0; font-size:.92rem; cursor:pointer; }
  label.opt input { width:18px; height:18px; accent-color:var(--accent); }
  .rules { margin:14px 0 0; padding-left:1.2em; color:var(--muted); font-size:.85rem; line-height:1.7; }
  #game { display:none; }
  #hud { display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap; }
  .chip { flex:1; min-width:70px; padding:7px 8px; border:2px solid var(--rule); border-radius:12px; background:var(--card); font-size:.82rem; text-align:center; line-height:1.3; }
  .chip.on { border-color:var(--c); box-shadow:0 0 0 2px var(--c); }
  .chip b { display:inline-block; width:18px; height:18px; line-height:18px; border-radius:50%; color:#fff; font-size:.72rem; background:var(--c); margin-right:4px; }
  #board { --bs:340px; --n:10; position:relative; width:var(--bs); height:var(--bs); margin:0 auto; display:grid; grid-template-columns:repeat(10,minmax(0,1fr)); grid-template-rows:repeat(10,minmax(0,1fr)); border:3px solid #5b4a30; border-radius:10px; overflow:hidden; user-select:none; -webkit-user-select:none; }
  .cell { position:relative; min-width:0; min-height:0; overflow:hidden; font-size:calc(var(--bs) / 10 * .26); color:#4b412f; padding:2px 3px; font-weight:600; line-height:1; }
  .cell.a { background:#f7e9c8; } .cell.b { background:#efd9a4; }
  .cell.head { background:#f6b8ae; } .cell.tail { background:#c4e7b3; } .cell.lb { background:#e5c19a; } .cell.lt { background:#f3e2b0; }
  .cell.end { background:#ffd166; }
  .cell i { position:absolute; right:2px; bottom:1px; font-style:normal; font-size:1.5em; opacity:.85; }
  #deco { position:absolute; left:0; top:0; width:100%; height:100%; pointer-events:none; }
  .pawn { position:absolute; width:5.6%; height:5.6%; border-radius:50%; border:2px solid #fff; background:var(--c); color:#fff; font-weight:800; font-size:calc(var(--bs) * .032); display:flex; align-items:center; justify-content:center; transform:translate(-50%,-50%); transition:left .18s ease-out, top .18s ease-out; z-index:3; box-shadow:0 2px 5px rgba(0,0,0,.45); }
  .pawn.slow { transition:left .8s ease-in-out, top .8s ease-in-out; }
  #ctrl { display:flex; align-items:center; gap:14px; justify-content:center; margin:14px 0 6px; }
  #die { width:76px; height:76px; border-radius:16px; border:2px solid var(--rule); background:var(--card); font-size:3.4rem; line-height:1; display:flex; align-items:center; justify-content:center; color:var(--fg); cursor:pointer; padding:0; }
  #die.roll { animation:shake .12s infinite; }
  @keyframes shake { 50% { transform:rotate(8deg) scale(1.05); } }
  #roll { font-size:1.15rem; padding:14px 22px; }
  #msg { min-height:2.8em; text-align:center; font-size:.95rem; line-height:1.5; margin:4px 0 10px; }
  .tools { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; } .tools .btn { padding:9px 12px; font-size:.85rem; }
  #ov { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,.6); display:none; align-items:center; justify-content:center; padding:20px; z-index:9; }
  #ov .box { background:var(--card); border:1px solid var(--rule); border-radius:18px; padding:26px 22px; text-align:center; max-width:340px; width:100%; }
  #ov h2 { margin:0 0 8px; font-size:1.6rem; } #ov p { margin:4px 0 18px; color:var(--muted); line-height:1.6; }
  button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
</style>
</head>
<body>
<main>
  <h1>🐍 蛇棋 🪜</h1>
  <p class="sub">比賽看誰先走到第 100 格!遇到樓梯往上爬,踩到蛇頭就滑下去。</p>

  <section id="setup" class="card">
    <div style="font-weight:700;margin-bottom:8px">幾個人玩?</div>
    <div class="row pick" id="pick"><button data-n="1">1 人</button><button data-n="2" class="on">2 人</button><button data-n="3">3 人</button><button data-n="4">4 人</button></div>
    <label class="opt"><input type="checkbox" id="exact" checked> 終點需剛好擲中(超過 100 會往回走)</label>
    <button class="btn p" id="start" style="width:100%;font-size:1.1rem">開始遊戲</button>
    <ol class="rules">
      <li>棋盤共 100 格,從 1 開始,<b>一列往右、下一列往左</b>來回走到 100。</li>
      <li>輪流擲骰子(1~6),依點數前進。</li>
      <li>停在<b>樓梯底部</b>會爬到樓梯頂端;走到樓梯頂端不會往下走。</li>
      <li>停在<b>蛇頭</b>會滑到蛇尾;走到蛇尾什麼事也沒有。</li>
      <li>第 <b>99 格</b>一定有蛇頭,踩到會<b>直接滑回第 1 格</b>;第 <b>88 格</b>一定有樓梯,可以<b>直達第 100 格直接獲勝</b>!其他的樓梯和蛇每一局都是隨機產生的。</li>
    </ol>
  </section>

  <section id="game">
    <div id="hud"></div>
    <div id="board"></div>
    <div id="ctrl"><button id="die" aria-label="骰子">⚀</button><button class="btn p" id="roll">擲骰子</button></div>
    <div id="msg"></div>
    <div class="tools"><button class="btn" id="newmap">🎲 新地圖</button><button class="btn" id="again">↻ 重玩這張</button><button class="btn" id="snd">🔊</button><button class="btn" id="back">⚙ 回設定</button></div>
  </section>
</main>
<div id="ov"><div class="box"><h2 id="ovt"></h2><p id="ovp"></p><div class="row"><button class="btn" id="ov1" style="flex:1">重玩這張</button><button class="btn p" id="ov2" style="flex:1">新地圖</button></div></div></div>

<script>
const $ = id => document.getElementById(id);
const COLORS = ['#e53935', '#1e88e5', '#43a047', '#f9a825'], FACES = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];
const SNAKE_COL = ['#2e9e4f', '#8e44ad', '#d35400', '#16a0a0', '#c0392b', '#7d8c1f', '#2c6fb7', '#b0408a'];
let cfg = { n: 2, exact: true }, board, pos = [], rolls = [], turn = 0, busy = false, over = false, sndOn = true;

// ---------- 地圖產生 ----------
const rowOf = n => Math.floor((n - 1) / 10), ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
function genBoard() {
  for (let attempt = 0; attempt < 300; attempt++) {
    const used = new Set([1, 100]), snakes = [], ladders = [];
    const free = n => !used.has(n), add = (arr, a, b) => { arr.push([a, b]); used.add(a); used.add(b); };
    add(snakes, 99, 1); add(ladders, 88, 100); // 第 99 格蛇頭直接滑回第 1 格;第 88 格樓梯直達 100(直接過關)
    const mk = (arr, up, count) => {
      for (let i = 0; i < count; i++) {
        let done = false;
        for (let k = 0; k < 100 && !done; k++) {
          const a = up ? ri(2, 88) : ri(14, 98), b = up ? a + ri(8, 50) : a - ri(8, 50);
          if (b < 2 || b > 98 || !free(a) || !free(b) || rowOf(a) === rowOf(b)) continue;
          add(arr, a, b); done = true;
        }
        if (!done) return false;
      }
      return true;
    };
    if (mk(snakes, false, 7) && mk(ladders, true, 7)) {
      const snakeAt = {}, ladderAt = {}; snakes.forEach(([h, tl]) => snakeAt[h] = tl); ladders.forEach(([b, tp]) => ladderAt[b] = tp);
      return { snakes, ladders, snakeAt, ladderAt };
    }
  }
}
function stepsPath(p, d, exact) { // 這一步依序經過的格子(終點需剛好時,超過 100 會往回走)
  const path = []; let dir = 1;
  for (let i = 0; i < d; i++) {
    if (!exact && p >= 100) break;
    p += dir; path.push(p);
    if (exact && p === 100 && i < d - 1) dir = -1;
  }
  return path;
}

// ---------- 座標 ----------
function cellXY(n) { const r = rowOf(n), c = r % 2 === 0 ? (n - 1) % 10 : 9 - (n - 1) % 10; return [c * 10 + 5, (9 - r) * 10 + 5]; }
const OFFS = [[-1.6, -1.6], [1.6, -1.6], [-1.6, 1.6], [1.6, 1.6]];

// ---------- 畫棋盤 ----------
function drawBoard() {
  const b = $('board'); b.innerHTML = '';
  for (let r = 9; r >= 0; r--) for (let c = 0; c < 10; c++) {
    const n = r * 10 + (r % 2 === 0 ? c + 1 : 10 - c), d = document.createElement('div');
    let cls = 'cell ' + ((r + c) % 2 ? 'a' : 'b'), icon = '';
    if (board.snakeAt[n]) { cls += ' head'; icon = '🐍'; } else if (board.snakes.some(s => s[1] === n)) cls += ' tail';
    else if (board.ladderAt[n]) { cls += ' lb'; icon = '🪜'; } else if (board.ladders.some(l => l[1] === n)) cls += ' lt';
    if (n === 100) { cls += ' end'; icon = '🏁'; }
    d.className = cls; d.innerHTML = n + (icon ? '<i>' + icon + '</i>' : ''); b.appendChild(d);
  }
  const NS = 'http://www.w3.org/2000/svg', svg = document.createElementNS(NS, 'svg'); svg.setAttribute('viewBox', '0 0 100 100'); svg.id = 'deco';
  const el = (tag, at) => { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); svg.appendChild(e); return e; };
  board.ladders.forEach(([lo, hi]) => { // 樓梯:兩根邊柱 + 橫槓
    const [x1, y1] = cellXY(lo), [x2, y2] = cellXY(hi), L = Math.hypot(x2 - x1, y2 - y1), ux = (x2 - x1) / L, uy = (y2 - y1) / L, nx = -uy * 1.5, ny = ux * 1.5;
    for (let k = 1; k < L / 3.6; k++) { const t = k * 3.6; el('line', { x1: x1 + ux * t + nx, y1: y1 + uy * t + ny, x2: x1 + ux * t - nx, y2: y1 + uy * t - ny, stroke: '#8a5a2b', 'stroke-width': 1, 'stroke-linecap': 'round' }); }
    [1, -1].forEach(s => el('line', { x1: x1 + nx * s, y1: y1 + ny * s, x2: x2 + nx * s, y2: y2 + ny * s, stroke: '#a8703a', 'stroke-width': 1.3, 'stroke-linecap': 'round' }));
  });
  board.snakes.forEach(([h, tl], i) => { // 蛇:彎彎曲曲的身體,蛇頭有眼睛
    const [x1, y1] = cellXY(h), [x2, y2] = cellXY(tl), L = Math.hypot(x2 - x1, y2 - y1), ux = (x2 - x1) / L, uy = (y2 - y1) / L, nx = -uy, ny = ux, waves = Math.max(1, Math.round(L / 15)), amp = Math.min(3.4, L * 0.09);
    let d = ''; for (let k = 0; k <= 40; k++) { const t = k / 40, o = Math.sin(t * Math.PI * 2 * waves) * amp * (1 - t * 0.5); d += (k ? 'L' : 'M') + (x1 + (x2 - x1) * t + nx * o).toFixed(2) + ' ' + (y1 + (y2 - y1) * t + ny * o).toFixed(2); }
    const col = SNAKE_COL[i % SNAKE_COL.length];
    el('path', { d, fill: 'none', stroke: col, 'stroke-width': 2.4, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', opacity: .92 });
    el('path', { d, fill: 'none', stroke: '#fff', 'stroke-width': 0.9, 'stroke-dasharray': '1 2.6', opacity: .45 });
    el('circle', { cx: x1, cy: y1, r: 2.5, fill: col }); el('circle', { cx: x1 - 0.9, cy: y1 - 0.7, r: .6, fill: '#fff' }); el('circle', { cx: x1 + 0.9, cy: y1 - 0.7, r: .6, fill: '#fff' });
    el('circle', { cx: x1 - 0.9, cy: y1 - 0.7, r: .28, fill: '#111' }); el('circle', { cx: x1 + 0.9, cy: y1 - 0.7, r: .28, fill: '#111' });
    el('circle', { cx: x2, cy: y2, r: 1, fill: col });
  });
  b.appendChild(svg);
  for (let i = 0; i < cfg.n; i++) { const p = document.createElement('div'); p.className = 'pawn'; p.id = 'pawn' + i; p.style.setProperty('--c', COLORS[i]); p.textContent = i + 1; b.appendChild(p); }
}
function placePawn(i, n, slow) {
  const p = $('pawn' + i), [x, y] = cellXY(n), o = cfg.n > 1 ? OFFS[i] : [0, 0];
  p.classList.toggle('slow', !!slow); p.style.left = (x + o[0]) + '%'; p.style.top = (y + o[1]) + '%';
}
function fit() { $('board').style.setProperty('--bs', Math.max(250, Math.min(window.innerWidth - 24, 560, window.innerHeight - 250)) + 'px'); }
addEventListener('resize', fit);

// ---------- 聲音 ----------
let actx = null;
function tone(f, d, type, v, when) {
  if (!sndOn) return; try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume();
    const t = actx.currentTime + (when || 0), o = actx.createOscillator(), g = actx.createGain(); o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v || .12, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + d + .02);
  } catch (e) {}
}
const sfx = {
  tick: () => tone(300 + Math.random() * 300, .05, 'square', .05), step: () => tone(520, .06, 'triangle', .1),
  up: () => [523, 659, 784, 1046].forEach((f, i) => tone(f, .14, 'triangle', .13, i * .09)),
  down: () => { for (let i = 0; i < 8; i++) tone(700 * Math.pow(.85, i), .1, 'sawtooth', .09, i * .07); },
  win: () => [523, 659, 784, 1046, 784, 1046, 1318].forEach((f, i) => tone(f, .2, 'triangle', .14, i * .12))
};

// ---------- 遊戲流程 ----------
const sleep = ms => new Promise(r => setTimeout(r, ms));
function hud() {
  $('hud').innerHTML = pos.map((p, i) => `<div class="chip${i === turn && !over ? ' on' : ''}" style="--c:${COLORS[i]}"><b>${i + 1}</b>玩家 ${i + 1}<br>第 ${p} 格</div>`).join('');
}
function startGame(sameBoard) {
  if (!sameBoard || !board) board = genBoard();
  pos = Array(cfg.n).fill(1); rolls = Array(cfg.n).fill(0); turn = 0; busy = false; over = false;
  $('setup').style.display = 'none'; $('game').style.display = 'block'; $('ov').style.display = 'none';
  fit(); drawBoard(); for (let i = 0; i < cfg.n; i++) placePawn(i, 1);
  $('die').textContent = '⚀'; $('roll').disabled = false; hud();
  $('msg').textContent = cfg.n > 1 ? '輪到 玩家 1,按「擲骰子」開始!' : '按「擲骰子」開始!';
}
async function doRoll() {
  if (busy || over) return; busy = true; $('roll').disabled = true;
  $('die').classList.add('roll'); for (let k = 0; k < 8; k++) { $('die').textContent = FACES[ri(0, 5)]; sfx.tick(); await sleep(85); }
  const d = ri(1, 6); $('die').classList.remove('roll'); $('die').textContent = FACES[d - 1];
  const me = turn, who = '玩家 ' + (me + 1); rolls[me]++;
  const path = stepsPath(pos[me], d, cfg.exact);
  $('msg').textContent = `${who} 擲出 ${d} 點`; await sleep(250);
  for (const c of path) { placePawn(me, c); pos[me] = c; sfx.step(); hud(); await sleep(210); }
  let land = pos[me], note = '';
  if (land === 100) { await sleep(150); return win(me); }
  if (board.snakeAt[land]) { const to = board.snakeAt[land]; note = `🐍 ${who} 踩到蛇頭!從 ${land} 滑到 ${to}`; $('msg').textContent = note; sfx.down(); await sleep(250); placePawn(me, to, true); pos[me] = to; await sleep(900); }
  else if (board.ladderAt[land]) { const to = board.ladderAt[land]; note = `🪜 ${who} 爬上樓梯!從 ${land} 到 ${to}`; $('msg').textContent = note; sfx.up(); await sleep(250); placePawn(me, to, true); pos[me] = to; await sleep(900); }
  else if (board.snakes.some(s => s[1] === land)) note = `${who} 走到蛇尾,什麼事也沒發生`;
  else if (board.ladders.some(l => l[1] === land)) note = `${who} 走到樓梯頂,樓梯只能往上走`;
  else note = `${who} 走到第 ${land} 格`;
  if (pos[me] === 100) { $('msg').textContent = `🪜 ${who} 爬上樓梯,直達終點!`; await sleep(300); return win(me); }
  $('msg').textContent = note;
  turn = (turn + 1) % cfg.n; hud(); busy = false; $('roll').disabled = false;
  if (cfg.n > 1) $('msg').textContent = note + `  → 輪到 玩家 ${turn + 1}`;
}
function win(i) {
  over = true; busy = false; hud(); sfx.win();
  $('ovt').textContent = cfg.n > 1 ? `🎉 玩家 ${i + 1} 獲勝!` : '🎉 抵達終點!';
  $('ovp').innerHTML = cfg.n > 1 ? `玩家 ${i + 1} 擲了 <b>${rolls[i]}</b> 次骰子,最先走到第 100 格!` : `你用了 <b>${rolls[i]}</b> 次骰子走到第 100 格!`;
  $('ov').style.display = 'flex';
}

// ---------- 事件 ----------
$('pick').onclick = e => { const b = e.target.closest('button'); if (!b) return; cfg.n = +b.dataset.n; [...$('pick').children].forEach(x => x.classList.toggle('on', x === b)); };
$('exact').onchange = e => { cfg.exact = e.target.checked; };
$('start').onclick = () => startGame(false);
$('roll').onclick = doRoll; $('die').onclick = doRoll;
$('newmap').onclick = () => startGame(false); $('again').onclick = () => startGame(true);
$('ov1').onclick = () => startGame(true); $('ov2').onclick = () => startGame(false);
$('back').onclick = () => { $('game').style.display = 'none'; $('setup').style.display = 'block'; $('ov').style.display = 'none'; over = true; };
$('snd').onclick = () => { sndOn = !sndOn; $('snd').textContent = sndOn ? '🔊' : '🔇'; };
addEventListener('keydown', e => { if ((e.code === 'Space' || e.key === 'Enter') && $('game').style.display === 'block' && $('ov').style.display !== 'flex') { e.preventDefault(); doRoll(); } });
</script>
</body>
</html>
