<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>釣魚圖鑑大冒險</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#0b1530;font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;color:#fff;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:8px;gap:6px;pointer-events:none;z-index:2}
#hud .grp{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
#hud .grp.r{justify-content:flex-end}
.pill{background:rgba(8,22,45,.62);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:700;color:#fff;pointer-events:auto;white-space:nowrap}
button{font-family:inherit;cursor:pointer}
.btn:hover{background:rgba(30,70,120,.8)}
.btn:active{transform:scale(.95)}
#bottom{position:fixed;bottom:0;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 8px 12px;pointer-events:none;z-index:2}
#hint{font-size:15px;font-weight:700;text-shadow:0 2px 4px #000a;background:rgba(0,0,0,.28);padding:4px 14px;border-radius:999px}
#baitBar{display:flex;gap:6px;pointer-events:auto}
.bait{background:rgba(8,22,45,.62);border:2px solid rgba(255,255,255,.2);border-radius:12px;padding:4px 10px;color:#fff;font-size:13px;font-weight:700}
.bait.sel{border-color:#ffd54a;background:rgba(90,70,10,.7)}
#toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.72);padding:10px 18px;border-radius:12px;font-weight:700;font-size:15px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:5;text-align:center;max-width:90vw}
#toast.show{opacity:1}
.mbg{position:fixed;inset:0;background:rgba(0,8,22,.72);display:none;align-items:center;justify-content:center;z-index:10}
.mbg.show{display:flex}
.modal{background:linear-gradient(#18406a,#0e2540);border:2px solid #6fb7e8;border-radius:18px;width:min(820px,95vw);max-height:92vh;overflow:auto;padding:16px;position:relative;box-shadow:0 10px 40px #000a;touch-action:pan-y}
.modal h2{font-size:22px;margin-bottom:8px}
.close{position:absolute;top:10px;right:12px;background:#c0392b;border:none;color:#fff;width:34px;height:34px;border-radius:50%;font-size:18px;font-weight:900}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.tab{background:rgba(255,255,255,.08);border:2px solid transparent;border-radius:10px;padding:5px 10px;color:#fff;font-size:13px;font-weight:700}
.tab.on{border-color:#ffd54a;background:rgba(255,213,74,.15)}
.tab.done{box-shadow:0 0 0 2px #4cd964 inset}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.card{background:rgba(255,255,255,.06);border-radius:12px;padding:6px 4px;text-align:center;border:2px solid transparent;cursor:pointer;position:relative}
.card.sel{border-color:#ffd54a}
.card canvas{width:100%;height:auto;display:block}
.card .nm{font-size:12px;font-weight:700;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .no{position:absolute;top:3px;left:6px;font-size:10px;opacity:.6}
.card .cnt{position:absolute;top:3px;right:6px;font-size:10px;opacity:.75}
.detail{display:flex;gap:12px;align-items:center;background:rgba(0,0,0,.25);border-radius:14px;padding:10px;margin-bottom:10px;flex-wrap:wrap}
.detail canvas{width:240px;max-width:100%;height:auto;background:radial-gradient(#2c6a9a,#0d2b48);border-radius:12px}
.detail .info{flex:1;min-width:200px;font-size:14px;line-height:1.65}
.detail .info b{font-size:19px}
.rar1{color:#c6d0d6}.rar2{color:#56b0ff}.rar3{color:#c77dff}.rar4{color:#ffc93c}
.bar{height:10px;background:rgba(255,255,255,.12);border-radius:5px;overflow:hidden;margin:4px 0 8px}
.bar>div{height:100%;background:linear-gradient(90deg,#4cd964,#ffd54a)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(255,255,255,.06);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.row .t{font-size:15px;font-weight:700}
.row .s{font-size:12px;opacity:.8}
.act{background:linear-gradient(#ffcf4a,#f0a020);color:#3a2400;border:none;border-radius:10px;padding:8px 14px;font-weight:900;font-size:14px;white-space:nowrap}
.act:disabled{filter:grayscale(1);opacity:.5}
.act.g{background:linear-gradient(#5fe08a,#2fae5a);color:#06301a}
.result{text-align:center}
.result canvas{width:min(400px,86vw);height:auto;background:radial-gradient(#2c6a9a,#0d2b48);border-radius:14px;margin:6px 0}
.result .badge{display:inline-block;background:#ff4f6a;color:#fff;border-radius:999px;padding:3px 12px;font-weight:900;margin:2px;animation:pop .5s}
.result .badge.rec{background:#2fae5a}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
#start{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(#1f5f8f,#071a33);text-align:center;gap:14px;padding:20px}
#start h1{font-size:clamp(32px,8vw,60px);text-shadow:0 4px 0 #0a2a4a,0 0 30px #4fc3ff}
#start p{opacity:.85;line-height:1.7}
#start canvas{position:static;width:min(420px,90vw);height:auto}
.big{font-size:22px;padding:12px 34px;border-radius:16px}
@media (max-width:600px){.pill{font-size:12px;padding:5px 9px}#hint{font-size:13px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="grp">
    <div class="pill" id="coinP">💰 0</div>
    <div class="pill" id="areaP">🌿 翠綠溪流</div>
    <div class="pill" id="timeP">☀️ 06:30</div>
  </div>
  <div class="grp r">
    <button class="pill btn" id="skipB" title="時間快轉 2 小時">⏩</button>
    <button class="pill btn" id="dexB">📖 圖鑑 0/105</button>
    <button class="pill btn" id="shopB">🛒 商店</button>
    <button class="pill btn" id="mapB">🗺️ 地點</button>
    <button class="pill btn" id="musB">🎵</button>
  </div>
</div>
<div id="bottom"><div id="hint">按住畫面蓄力，放開拋竿 🎣</div><div id="baitBar"></div></div>
<div id="toast"></div>
<div class="mbg" id="mbg"><div class="modal" id="modal"></div></div>
<div id="start">
  <h1>🎣 釣魚圖鑑大冒險</h1>
  <canvas id="startCv" width="840" height="260"></canvas>
  <p>七大釣場、105 種魚等你收集！<br>白天、晨昏、夜晚會出現不同的魚，傳說之魚只在特定時刻現身。</p>
  <button class="act big" id="startB">開始釣魚</button>
</div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const cv=$('#c'),ctx=cv.getContext('2d');
let W,H,DPR,S;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);S=Math.max(.7,Math.min(1.35,Math.min(W,H)/650));}
addEventListener('resize',resize);resize();
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,k)=>a+(b-a)*k;
function hexRgb(h){const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255]}
function rgba(h,a){const c=hexRgb(h);return`rgba(${c[0]},${c[1]},${c[2]},${a})`}
function mix(h1,h2,k){const a=hexRgb(h1),b=hexRgb(h2);return`rgb(${a.map((v,i)=>Math.round(v+(b[i]-v)*k)).join(',')})`}
function mixHex(h1,h2,k){const a=hexRgb(h1),b=hexRgb(h2);return'#'+a.map((v,i)=>Math.round(v+(b[i]-v)*k).toString(16).padStart(2,'0')).join('')}
function shade(h,k){return mix(h,k<0?'#000000':'#ffffff',Math.abs(k))}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ================= 釣場 ================= */
const AREAS=[
 {name:'翠綠溪流',icon:'🌿',cost:0,water:['#4fa8a0','#16504e'],dock:'rock',deco:'stream',bonus:300},
 {name:'寧靜湖泊',icon:'🏞️',cost:250,water:['#4a90b4','#123a58'],dock:'pier',deco:'lake',bonus:800},
 {name:'海風港灣',icon:'⚓',cost:1000,water:['#3f88bc','#0f345c'],dock:'pier',deco:'harbor',bonus:2000},
 {name:'虹彩珊瑚礁',icon:'🐠',cost:3000,water:['#38d2d0','#0c5488'],dock:'pier',deco:'reef',bonus:5000},
 {name:'蔚藍遠洋',icon:'🌊',cost:8000,water:['#1f72bc','#05224a'],dock:'boat',deco:'ocean',bonus:10000},
 {name:'冰封峽灣',icon:'❄️',cost:18000,water:['#5a94ac','#11314a'],dock:'ice',deco:'polar',bonus:20000},
 {name:'幽暗深淵',icon:'🌑',cost:40000,water:['#123056','#01040c'],dock:'boat',deco:'deep',bonus:50000},
];
const RAR_NAME=['','普通','稀有','史詩','傳說'],RAR_COL=['','#c6d0d6','#56b0ff','#c77dff','#ffc93c'];
const TIME_NAME={any:'⏰ 全天',day:'☀️ 白天',night:'🌙 夜晚',dawn:'🌅 晨昏'};

/* ================= 魚類資料 ================= */
// [名稱, 外形, 體高, 主色, 腹色, 花紋色, 花紋, 稀有度, 最小cm, 最大cm, 價格, 時段, 介紹, 特徵]
const RAW=[
[
['大肚魚','fish',.36,'#9aa38a','#e2e4d0','#7d8466','none',1,2,5,6,'any','體型嬌小、肚子圓鼓鼓，常成群在淺水處覓食孑孓。'],
['溪哥','fish',.3,'#9fb3c0','#eef2f4','#e07a5f','vbars',1,8,15,10,'day','繁殖期的雄魚身上會出現藍橘相間的婚姻色，非常亮眼。'],
['苦花','fish',.3,'#6f7d5c','#dcdabc','#4f5a3e','none',1,15,30,14,'any','學名鯝魚，用嘴巴刮食石頭上的藻類，會留下一道道「刮痕」。'],
['鯽魚','fish',.42,'#a8925a','#ece0b0','#8d7a48','scales',1,10,25,9,'any','適應力超強，幾乎在任何溪流和池塘都能找到牠。'],
['泥鰍','eel',.13,'#8a7650','#cfc092','#5e4d2c','spots',1,8,15,8,'any','會用腸子呼吸空氣，天氣悶熱時常浮上水面吞氣。','barbel'],
['吳郭魚','fish',.46,'#6d7f78','#cdd4cb','#4e5b56','vbars',1,15,35,9,'any','又名台灣鯛，雌魚會把魚卵含在嘴裡孵化。'],
['鰕虎','fish',.24,'#8c8a6e','#ddd8b6','#4c6a8a','spots',1,4,10,8,'day','腹鰭特化成吸盤，能牢牢吸附在湍急溪流的石頭上。','bighead'],
['台灣鬥魚','fish',.4,'#3f6f8f','#9fc4d4','#d24a3a','vbars',2,4,7,30,'day','雄魚鰭色鮮豔，會在水面吐泡泡築巢，是台灣原生的美麗小魚。'],
['香魚','fish',.24,'#8fa39a','#eef2ec','#e8c14a','none',2,15,25,36,'dawn','肉質帶有淡淡的西瓜香氣，喜歡清澈湍急的溪水。'],
['石賓','fish',.32,'#7c8a6a','#dadcc0','#3d4a35','vbars',2,20,40,40,'any','身上有六條黑色橫帶，是溪流中力氣不小的對手。'],
['何氏棘魞','fish',.3,'#7a8a5c','#dedab6','#c0503a','none',2,20,45,45,'dawn','嘴邊有鬚、鰭帶紅色，喜歡藏在深潭的大石頭底下。','barbel'],
['虹鱒','fish',.28,'#7e9c7a','#f4e8e6','#d8607a','spots',2,25,50,50,'dawn','身體側面有一道彩虹般的粉紅色帶，喜歡冰涼的水。','hline'],
['鱸鰻','eel',.13,'#5a5034','#a49770','#3c351f','spots',3,60,150,150,'night','夜行性的大型鰻魚，力氣極大，傳說能爬過山坡到另一條溪。'],
['櫻花鉤吻鮭','fish',.28,'#6c8a7a','#f4dada','#2f3f3a','spots',4,20,40,500,'dawn','冰河時期遺留下來的國寶魚，只棲息在高山溪流，釣到後請溫柔放流！','hline'],
['翠玉溪神','fish',.3,'#2fd08a','#b8ffd8','#7affc0','shine',4,80,120,800,'night','溪流深處的守護神，鱗片如翡翠般發光，只在月夜現身。','glow'],
],[
['鯉魚','fish',.38,'#b08a4a','#efdcac','#7a5a2a','scales',1,30,80,16,'any','嘴邊有兩對鬍鬚，是最常見的淡水大魚，力氣不小。','barbel'],
['草魚','fish',.28,'#8a8a5a','#e2e0b6','#5a5a30','scales',1,40,90,18,'day','只吃水草的素食者，常被放進池塘幫忙除草。'],
['鰱魚','fish',.34,'#a9b4bd','#f0f2f4','#8a96a0','none',1,40,80,15,'any','受到驚嚇時會整群跳出水面，場面十分壯觀。'],
['大頭鰱','fish',.36,'#7d8590','#dde1e6','#5a6270','spots',1,50,100,20,'any','頭部佔了身體三分之一，專門濾食水中的浮游生物。','bighead'],
['藍鰓太陽魚','tall',.56,'#5d7a5a','#e8b04a','#2a3f6a','vbars',1,10,20,12,'day','鰓蓋後方有一塊深藍色斑點，像一隻小小的眼睛。'],
['大口黑鱸','fish',.33,'#5f7a3e','#e6e8c8','#2d3a1e','hline',2,30,60,50,'dawn','路亞釣客最愛的目標，張口可以吞下自己一半大的獵物。','bighead'],
['鱖魚','fish',.38,'#9a8550','#eee0b8','#3f3520','spots',2,25,45,48,'dawn','「桃花流水鱖魚肥」，古詩裡稱讚的美味淡水魚。','spiny'],
['鯰魚','fish',.24,'#4f4a42','#b4ac9c','#33302a','none',2,40,100,42,'night','靠長長的鬍鬚在黑暗中感應獵物，是湖底的夜行獵人。','barbel bighead'],
['七星鱧','fish',.22,'#4d4a36','#aca684','#2a281a','spots',2,40,80,40,'any','俗稱雷魚，能直接呼吸空氣，就算在泥巴裡也能活好幾天。'],
['白斑狗魚','fish',.2,'#6a7a4a','#e2e6c4','#d6db9a','spots',2,50,100,60,'any','嘴巴像鴨嘴、滿口利齒，是北方湖泊的頂級掠食者。','teeth'],
['錦鯉','fish',.38,'#f4f2ec','#ffffff','#e0452a','patches',3,40,80,220,'day','被譽為「游泳的寶石」，紅白相間的花紋每一條都獨一無二。','barbel'],
['胭脂魚','tall',.6,'#c87a6a','#f2ccbc','#8a3a2a','vbars',3,40,90,180,'any','背鰭高高揚起像一面帆，有「一帆風順」的好兆頭。'],
['中華鱘','shark',.2,'#6a7078','#d8dce0','#3a4048','scutes',3,100,250,380,'night','活化石般的古老魚類，身上有五排骨板，已經存在超過一億年。','barbel'],
['金鱗湖王','fish',.38,'#f0c040','#fff0a0','#ffe070','shine',4,80,150,900,'dawn','湖心的傳說巨鯉，金色鱗片能映出月光，據說躍過龍門就會化為龍。','glow barbel'],
['湖底巨鯰','fish',.24,'#3a3530','#8a8070','#ffb040','shine',4,150,300,1000,'night','活了上百年的巨鯰，漁夫們口耳相傳說牠能一口吞下整條小船。','barbel bighead glow'],
],[
['竹莢魚','fish',.26,'#7d97a8','#eaf0f4','#e0c050','hline',1,15,30,14,'any','身體側線上有一排硬硬的稜鱗，就像竹子的節一樣。'],
['沙丁魚','fish',.22,'#4f7fa8','#f0f4f8','#2d4a6a','spots',1,10,20,10,'day','總是成千上萬集體行動，組成閃閃發亮的「魚球」。'],
['鯖魚','fish',.25,'#3f7a6a','#eef2f2','#1f3a3a','wave',1,25,40,16,'any','背上有藍綠色的波浪花紋，游速很快，常成群出沒。'],
['秋刀魚','fish',.13,'#4a6f9a','#eef2f6','#e8c040','none',1,25,35,15,'night','細長如刀，秋天最肥美，晚上會被漁船的燈光吸引。'],
['烏魚','fish',.26,'#5a6a7a','#dde2e6','#3a4550','hstripes',1,40,70,25,'any','冬至前後成群南下，魚卵就是珍貴的烏魚子。'],
['黑鯛','fish',.42,'#4a4f55','#acb1b6','#2a2e33','vbars',1,25,45,26,'dawn','俗稱黑格，生性謹慎狡猾，是磯釣的經典目標。'],
['石狗公','fish',.38,'#a85a3a','#ecb494','#6a3020','spots',1,15,25,18,'night','擅長偽裝成岩石，背鰭的刺帶有微毒，抓的時候要小心。','spiny bighead'],
['真鯛','fish',.42,'#e07a80','#fae2e4','#5ab0d0','spots',2,30,60,65,'day','粉紅色身體點綴著藍色亮點，在日本被視為喜慶的魚中之王。'],
['牙鮃','flat',.5,'#8a7a5a','#ccbc94','#4a3f2a','spots',2,40,80,70,'any','俗稱比目魚，兩隻眼睛都長在同一側，平躺在海底伏擊獵物。'],
['河豚','puff',.9,'#b8a870','#f6f2e2','#4a4a3a','spots',2,15,30,55,'day','受到驚嚇時會把肚子灌滿水鼓成球，內臟含有劇毒。'],
['白帶魚','eel',.1,'#d8e0e8','#ffffff','#a8b8c8','none',2,80,150,65,'night','全身銀亮像一條緞帶，在水中常常頭上尾下地直立漂浮。','teeth'],
['星鰻','eel',.12,'#8a6a4a','#e4d4b4','#f4f4e4','spots',2,50,90,55,'night','身體側面有一排白色小點，像夜空中的星星。'],
['七星鱸','fish',.28,'#9aa8b0','#f0f2f4','#4a5560','spots',2,40,80,60,'dawn','背部散布黑色斑點，會游進河口追捕小魚。'],
['午仔魚','fish',.3,'#b8b080','#f2f0e0','#e8d050','none',2,25,40,50,'any','胸鰭下方有幾根游離的絲狀鰭條，用來在沙地上探找食物。'],

/* ================= 畫魚 ================= */
function fishBody(hh,nose,tb,fl){
  const X=k=>tb+k*(nose-tb),p=new Path2D(),bh=fl.bighead?1.18:1,bl=fl.blunt?1:0;
  p.moveTo(nose,bl?-hh*.1:0);
  p.bezierCurveTo(X(.98),-hh*(.7+bl*.5)*bh,X(.62),-hh*1.1*bh,X(.32),-hh*.92);
  p.bezierCurveTo(X(.15),-hh*.72,X(.05),-hh*.38,X(0),-hh*.22);
  p.lineTo(X(0),hh*.22);
  p.bezierCurveTo(X(.05),hh*.38,X(.15),hh*.72,X(.32),hh*.92);
  p.bezierCurveTo(X(.62),hh*1.1,X(.96),hh*.8,nose,bl?hh*.15:0);
  p.closePath();return p;
}
function tri(c,pts,col){c.beginPath();c.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)c.lineTo(pts[i],pts[i+1]);c.closePath();c.fillStyle=col;c.fill()}
function drawFish(c,f,x,y,L,o={}){
  const dir=o.dir||1,t=o.t||0,sil=o.sil,fl=f.flags,hh=f.h/2;
  const c1=sil||f.c1,c2=sil||f.c2,c3=sil||f.c3,finC=sil||rgba(mixHex(f.c1,f.c3,.45),.88),dk=sil||shade(f.c1,-.45);
  const wig=o.still?0:Math.sin(t*7+f.id)*.16*(o.wig||1);
  const glow=!sil&&fl.glow;
  c.save();c.translate(x,y);c.scale(dir*L,L);
  const px=1/L;c.lineJoin='round';c.lineCap='round';
  let body,eye=[.36,-hh*.25,clamp(hh*.17,.02,.045)],mouth=[.48,hh*.05];
  const fillBody=()=>{
    if(glow){c.shadowColor=f.c3;c.shadowBlur=(o.glowBlur||16)*(0.75+0.25*Math.sin(t*3));}
    if(fl.trans&&!sil)c.globalAlpha*=.62;
    if(sil)c.fillStyle=sil;else{const g=c.createLinearGradient(0,-Math.max(hh,.08),0,Math.max(hh,.08));g.addColorStop(0,shade(c1,-.12));g.addColorStop(.4,c1);g.addColorStop(1,c2);c.fillStyle=g;}
    c.fill(body);c.shadowBlur=0;
    if(!sil){c.save();c.clip(body);drawPattern(c,f,hh,t);
      const s=c.createLinearGradient(0,-hh,0,hh*.2);s.addColorStop(0,'rgba(255,255,255,0)');s.addColorStop(.35,'rgba(255,255,255,.16)');s.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=s;c.fillRect(-.6,-hh*1.5,1.2,hh*1.7);
      c.restore();c.strokeStyle=rgba(f.c1,.9);c.strokeStyle=shade(f.c1,-.35);c.lineWidth=1.2*px;c.stroke(body);}
    if(fl.trans&&!sil)c.globalAlpha/=.62;
  };
  const shape=f.shape;
  if(shape==='fish'||shape==='tall'||shape==='sword'){
    const tall=shape==='tall',nose=shape==='sword'?.3:tall?.44:.48,tb=tall?-.28:-.33,X=k=>tb+k*(nose-tb);
    body=fishBody(hh,nose,tb,fl);
    // dorsal
    if(fl.mola){
      body=new Path2D();body.ellipse(.03,0,.42,hh*.92,0,0,Math.PI*2);
      tri(c,[-.18,-hh*.8,-.3,-hh*1.75,-.4,-hh*.5],finC);tri(c,[-.18,hh*.8,-.3,hh*1.75,-.4,hh*.5],finC);
      c.beginPath();for(let i=0;i<=8;i++){const yy=-hh*.75+i*hh*.1875;c.lineTo(-.43-(i%2)*.05,yy)}c.fillStyle=finC;c.fill();
      eye=[.3,-hh*.2,.04];mouth=[.44,0];
    }else{
      c.beginPath();
      if(fl.sail){c.moveTo(X(.85),-hh*.9);c.quadraticCurveTo(X(.62),-hh*3.6,X(.12),-hh*2.1);c.lineTo(X(.12),-hh*.8);}
      else if(tall){c.moveTo(X(.78),-hh*.88);c.quadraticCurveTo(X(.4),-hh*1.55,X(-.08),-hh*1.15);c.lineTo(X(.06),-hh*.45);}
      else if(fl.lion){for(let i=0;i<7;i++){const xx=X(.8-i*.1);c.moveTo(xx,-hh*.8);c.lineTo(xx-.04,-hh*2.1+i*hh*.1);c.lineTo(xx-.06,-hh*.7);}}
      else{c.moveTo(X(.68),-hh*.9);c.quadraticCurveTo(X(.52),-hh*1.75,X(.24),-hh*1.38);c.lineTo(X(.2),-hh*.85);}
      c.closePath();c.fillStyle=finC;c.fill();
      if(fl.spiny&&!fl.lion){c.strokeStyle=sil||shade(f.c1,-.5);c.lineWidth=1.3*px;c.beginPath();for(let i=0;i<5;i++){const xx=X(.66-i*.09);c.moveTo(xx,-hh*.9);c.lineTo(xx-.02,-hh*1.7+i*hh*.08)}c.stroke();}
      // anal
      c.beginPath();
      if(tall){c.moveTo(X(.55),hh*.88);c.quadraticCurveTo(X(.3),hh*1.5,X(-.08),hh*1.15);c.lineTo(X(.06),hh*.45);}
      else{c.moveTo(X(.36),hh*.86);c.lineTo(X(.2),hh*1.38);c.lineTo(X(.1),hh*.72);}
      c.closePath();c.fillStyle=finC;c.fill();
      if(fl.finlets){c.fillStyle=sil||f.c3;for(let i=0;i<5;i++){const xx=X(.22-i*.045);tri(c,[xx,-hh*.62+i*hh*.1,xx-.03,-hh*.85+i*hh*.1,xx-.035,-hh*.5+i*hh*.1],sil||f.c3);tri(c,[xx,hh*.62-i*hh*.1,xx-.03,hh*.85-i*hh*.1,xx-.035,hh*.5-i*hh*.1],sil||f.c3)}}
      if(fl.tripod){c.strokeStyle=sil||shade(f.c1,-.3);c.lineWidth=1.5*px;c.beginPath();c.moveTo(X(.75),hh*.6);c.lineTo(X(.8),hh*3.2);c.moveTo(X(.2),hh*.5);c.lineTo(X(.05),hh*3.2);c.moveTo(X(.05),hh*.3);c.lineTo(X(-.25),hh*2.6);c.stroke();}
      if(fl.lobed){c.fillStyle=finC;[[.65,1],[.3,1],[.6,-1],[.25,-1]].forEach(([k,s])=>{c.beginPath();c.ellipse(X(k)-.03,s*hh*1.05,.06,.025,s*.5,0,Math.PI*2);c.fill()});}
      // tail
      c.save();c.translate(tb,0);c.rotate(wig);

      else{

    if(fl.tube&&!sil){c.save();c.fillStyle='rgba(180,255,220,.25)';c.strokeStyle='rgba(200,255,230,.6)';c.lineWidth=px;c.beginPath();c.ellipse(X(.82),-hh*.55,.09,hh*.6,0,0,Math.PI*2);c.fill();c.stroke();c.restore();eye=[X(.83),-hh*.62,.03];}
    if(shape==='sword'){tri(c,[X(.96),-hh*.2,.58,-.006,X(.96),hh*.1],sil||shade(f.c1,-.15));}
    // gill
    if(!sil&&!fl.mola){c.strokeStyle=rgba('#000000',.25);c.lineWidth=1.2*px;c.beginPath();c.moveTo(X(.78),-hh*.55);c.quadraticCurveTo(X(.72),0,X(.78),hh*.55);c.stroke();}

    // dorsal & ventral fin strip
    c.beginPath();c.moveTo(fin[0][0],top[0][1]);fin.forEach(p=>c.lineTo(p[0],p[1]));for(let i=N;i>=0;i--)c.lineTo(fin[i][0],fin[i][2]);c.closePath();

    eye=fl.box?[.22,-.08,.045]:fl.blob?[.2,-.08,.03]:[.2,-.12,.055];mouth=[fl.box?.35:.34,.03];

    body=new Path2D();body.moveTo(.5,.02);body.bezierCurveTo(.47,-s*.9,.25,-s*1.1,-.02,-s*.92);body.bezierCurveTo(-.22,-s*.6,-.32,-s*.28,-.38,-s*.12);body.lineTo(-.38,s*.12);body.bezierCurveTo(-.3,s*.32,-.1,s*.9,.12,s*.95);body.bezierCurveTo(.32,s*.95,.47,s*.6,.5,.02);body.closePath();
    fillBody();
    if(!sil){c.strokeStyle=rgba('#000000',.3);c.lineWidth=1.2*px;for(let i=0;i<5;i++){c.beginPath();c.moveTo(.27-i*.022,-s*.35);c.lineTo(.26-i*.022,s*.35);c.stroke();}}

}
function drawPattern(c,f,hh,t){
  const col=f.c3,rng=mulberry(f.id*7919+13),H2=Math.max(hh,.06)*1.4;
  switch(f.pat){
    case'vbars':c.fillStyle=rgba(col,.45);for(let i=0;i<6;i++){const x=.3-i*.12;c.fillRect(x-.025,-H2,.045,H2*2)}break;
    case'eyeband':c.fillStyle=rgba('#1a1a1a',.85);c.fillRect(.24,-H2,.06,H2*2);c.fillStyle=rgba(col,.9);c.fillRect(-.6,-H2,.28,H2*2);break;
    case'hline':c.fillStyle=rgba(col,.55);c.fillRect(-.6,-hh*.1,1.2,hh*.2);break;
    case'hstripes':c.fillStyle=rgba(col,.75);for(let k=-4;k<=4;k++)c.fillRect(-.6,k*hh/4.5-hh*.04,1.2,hh*.08);break;
    case'bellystripe':c.fillStyle=rgba(col,.5);for(let k=1;k<4;k++)c.fillRect(-.6,k*hh/4,1.2,hh*.07);break;
    case'spots':c.fillStyle=rgba(col,.75);for(let i=0;i<22;i++){const x=rng()*1-.5,y=(rng()*2-1)*hh,r=.008+rng()*.018;c.beginPath();c.arc(x,y,r,0,7);c.fill()}break;
    case'photo':c.fillStyle=col;c.shadowColor=col;c.shadowBlur=8;for(let i=0;i<9;i++){const x=.35-i*.09;c.beginPath();c.arc(x,hh*.62,.012,0,7);c.fill()}c.shadowBlur=0;break;
    case'bands':[.3,.04,-.26].forEach((x,i)=>{const w=i===2?.05:.075;c.fillStyle='#1a1a1a';c.fillRect(x-w/2-.015,-H2,w+.03,H2*2);c.fillStyle='#fff';c.beginPath();c.ellipse(x,0,w/2,H2*.85,0,0,7);c.fill()});break;
    case'wave':c.strokeStyle=rgba(col,.55);c.lineWidth=.012;for(let k=0;k<6;k++){c.beginPath();for(let x=-.5;x<=.5;x+=.02){const y=-hh*.9+k*hh*.22+Math.sin(x*28+k)*hh*.08;x===-.5?c.moveTo(x,y):c.lineTo(x,y)}c.stroke()}break;
    case'scales':c.strokeStyle=rgba(col,.35);c.lineWidth=.006;for(let x=-.3;x<.38;x+=.05)for(let y=-hh;y<hh;y+=.045){c.beginPath();c.arc(x+((Math.round(y/.045))%2)*.025,y,.025,-1.2,1.2);c.stroke()}break;
    case'patches':c.fillStyle=col;for(let i=0;i<4;i++){c.beginPath();c.ellipse(.3-i*.2+rng()*.06,-hh*.4+rng()*hh*.5,.06+rng()*.05,hh*(.35+rng()*.3),rng(),0,7);c.fill()}break;
    case'scutes':c.fillStyle=rgba('#e8e2d0',.8);for(let i=0;i<10;i++){const x=.3-i*.065;[[-hh*.75],[0]].forEach(([y])=>{c.beginPath();c.moveTo(x,y-.015);c.lineTo(x+.015,y);c.lineTo(x,y+.015);c.lineTo(x-.015,y);c.fill()})}break;
    case'regal':c.fillStyle='#10183a';c.beginPath();c.moveTo(.32,-hh*.5);c.quadraticCurveTo(0,-hh*1.1,-.3,-hh*.6);c.quadraticCurveTo(-.05,-hh*.55,-.3,hh*.1);c.quadraticCurveTo(0,0,.32,-hh*.2);c.fill();break;
    case'oarfish':c.fillStyle=rgba('#4a5060',.5);for(let i=0;i<30;i++){c.beginPath();c.ellipse(rng()-.5,(rng()*2-1)*hh*.7,.012,.004,0,0,7);c.fill()}break;
    case'shine':{const g=c.createLinearGradient(-.5,-hh,.5,hh),k=(t*.35)%1.6-.3;g.addColorStop(clamp(k-.15,0,1),'rgba(255,255,255,0)');g.addColorStop(clamp(k,0,1),'rgba(255,255,255,.55)');g.addColorStop(clamp(k+.15,0,1),'rgba(255,255,255,0)');c.fillStyle=g;c.fillRect(-.6,-H2,1.2,H2*2);
      c.strokeStyle=rgba(col,.4);c.lineWidth=.006;for(let x=-.3;x<.38;x+=.05)for(let y=-hh;y<hh;y+=.045){c.beginPath();c.arc(x+((Math.round(y/.045))%2)*.025,y,.025,-1.2,1.2);c.stroke()}break;}
    case'rainbow':{const g=c.createLinearGradient(-.5,0,.5,0);for(let i=0;i<=6;i++)g.addColorStop(i/6,`hsla(${(i*55+t*80)%360},95%,60%,.75)`);c.fillStyle=g;c.fillRect(-.6,-H2,1.2,H2*2);break;}

  }

}
function fitL(f,cw,ch){
  const fl=f.flags,hr={fish:f.h*1.7+(fl.tripod?f.h*1.6:0)+(fl.wings?.05:0),tall:f.h*(fl.mola?1.85:1.55),eel:f.h*(fl.crest?4.5:2.1),flat:f.h+.15,puff:fl.spiny?.9:.78,shark:f.h*3.3,sword:f.h*(fl.sail?2.4:2.3),ray:1.02,angler:f.h*1.15+.1}[f.shape];
  const wr=f.shape==='sword'?1.15:f.shape==='ray'?1.0:1.04;
  return Math.min(cw*.88/wr,ch*.82/hr);
}
function drawFishFit(c,f,cw,ch,o={}){
  const L=fitL(f,cw,ch);let ox=0,oy=0;
  if(f.shape==='ray')ox=.11*L;if(f.shape==='sword')ox=-.03*L;if(f.shape==='angler')oy=f.h*.22*L;if(f.shape==='tall'&&!f.flags.mola)ox=.02*L;if(f.flags.crest)oy=f.h*1.2*L;if(f.flags.tripod)oy=-f.h*.8*L;if(f.flags.sail)oy=f.h*.4*L;
  drawFish(c,f,cw/2+ox,ch/2+oy,L,o);
}

function sched(){
  if(!actx)return;
  if(!musicOn){nextT=actx.currentTime+.1;return}
  const deep=G.area===6,spb=deep?60/62/2:60/96/2,key=AREA_KEY[G.area]||0;
  while(nextT<actx.currentTime+.25){
    const bar=Math.floor(step/8)%4,k=step%8,t=nextT;
    if(!deep){
      const ch=PROG[bar].map(m=>m+key),night=period()==='night';
      if([0,2,3,5,6].includes(k))uke(mtof(ch[[0,1,2,3,1,2,3,0][k]]+12),t,night?.035:.05);
      if(k===0||k===3||k===6)bass(mtof(ch[k===3?2:0]-12),t,.13);
      shaker(t,k%2?.03:.014);
      if(Math.random()<(night?.18:.3)){melIdx=clamp(melIdx+Math.floor(Math.random()*5)-2,0,PENT.length-1);marimba(mtof(PENT[melIdx]+key+12),t,.07)}
    }else{
      const ch=PROG_D[bar];
      if(k===0)pad(ch.map(m=>m+12),t,spb*8.2);
      if(k===0||k===4)bass(mtof(ch[0]-12),t,.08);
      if(Math.random()<.16){melIdx=clamp(melIdx+Math.floor(Math.random()*5)-2,0,6);bell(mtof([57,60,62,64,67,69,72][melIdx]+12),t,.05)}

function period(h){h=h===undefined?G.time/60:h;if((h>=5&&h<7)||(h>=17&&h<19))return'dawn';if(h>=7&&h<17)return'day';return'night'}
function timeOk(tm){const p=period();if(tm==='any'||G.area===6)return true;if(tm==='dawn')return p==='dawn';if(tm==='day')return p!=='night';if(tm==='night')return p!=='day';return true}
function pickFish(bait){
  const pool=FISH.filter(f=>f.area===G.area&&timeOk(f.time)),rod=RODS[G.rod];let tot=0;
  const ws=pool.map(f=>{let w=[0,62,27,9,2][f.rar]*BAITS[bait].mult[f.rar-1]*(f.rar>=3?1+rod.bonus:1)*(G.dex[f.id]?1:1.3);tot+=w;return w});
  let r=Math.random()*tot;for(let i=0;i<pool.length;i++){r-=ws[i];if(r<=0)return pool[i]}return pool[0];

  const m=mg;m.t+=dt;
  if(m.t>m.tNext){m.ft=clamp(m.f+(Math.random()*2-1)*(.25+m.d*.7),.03,.97);if(Math.random()<m.d*.35)m.ft=Math.random()<.5?.04:.96;m.tNext=m.t+(.35+Math.random()*1.2)*(1.2-m.d*.7)}

function title(){const n=caughtCount();return n>=105?'👑 圖鑑完成者':n>=90?'🌟 傳說釣神':n>=70?'🎖️ 釣魚大師':n>=50?'🐋 資深釣師':n>=30?'🐟 熟練釣手':n>=12?'🎣 見習釣手':'🌱 新手釣客'}
function renderDex(){
  const n=caughtCount(),pct=Math.round(n/FISH.length*100);
  let html=`<h2>📖 魚類圖鑑</h2><div style="font-size:14px">稱號：<b>${title()}</b>　收集 <b>${n}/${FISH.length}</b>（${pct}%）　總釣獲 <b>${G.total}</b> 條</div><div class="bar"><div style="width:${pct}%"></div></div>`;
  html+='<div class="tabs">'+AREAS.map((a,i)=>`<button class="tab ${i===dexTab?'on':''} ${G.areaDone.includes(i)?'done':''}" data-i="${i}">${a.icon} ${a.name} ${caughtCount(i)}/15</button>`).join('')+'</div>';
  html+='<div class="detail" id="dexDetail"></div><div class="grid">';
  FISH.filter(f=>f.area===dexTab).forEach((f,i)=>{const r=G.dex[f.id];html+=`<div class="card ${dexSel===f.id?'sel':''}" data-id="${f.id}" style="${r?'border-color:'+rgba(RAR_COL[f.rar],.45):''}"><span class="no">No.${String(f.id+1).padStart(3,'0')}</span>${r?`<span class="cnt">×${r.n}</span>`:''}<canvas width="220" height="140" data-id="${f.id}"></canvas><div class="nm ${r?'rar'+f.rar:''}">${r?f.name:'？？？'}</div></div>`});
  html+='</div>';
  openModal(html);
  document.querySelectorAll('.tab').forEach(e=>e.onclick=()=>{dexTab=+e.dataset.i;dexSel=null;SFX.click();renderDex();$('#modal').scrollTop=0});
  document.querySelectorAll('.card canvas').forEach(c=>{const f=FISH[+c.dataset.id],x=c.getContext('2d');drawFishFit(x,f,c.width,c.height,{t:1,still:true,noSpark:true,sil:G.dex[f.id]?null:'#0b1a2c',glowBlur:10})});
  document.querySelectorAll('.card').forEach(e=>e.onclick=()=>{dexSel=+e.dataset.id;SFX.click();document.querySelectorAll('.card').forEach(x=>x.classList.toggle('sel',+x.dataset.id===dexSel));renderDetail()});
  if(dexSel===null){const first=FISH.find(f=>f.area===dexTab&&G.dex[f.id]);dexSel=first?first.id:FISH.find(f=>f.area===dexTab).id}
  document.querySelectorAll('.card').forEach(x=>x.classList.toggle('sel',+x.dataset.id===dexSel));
  renderDetail();
}
function renderDetail(){
  const f=FISH[dexSel],r=G.dex[f.id],el=$('#dexDetail');animCvs.length=0;
  el.innerHTML=`<canvas id="detCv" width="480" height="280"></canvas><div class="info">
   <div style="opacity:.6;font-size:12px">No.${String(f.id+1).padStart(3,'0')}　${AREAS[f.area].icon} ${AREAS[f.area].name}</div>
   <b class="${r?'rar'+f.rar:''}">${r?f.name:'？？？'}</b>　<span class="rar${f.rar}">${'★'.repeat(f.rar)} ${RAR_NAME[f.rar]}</span><br>
   🕐 出沒時段：${G.area===6||f.area===6?'🌑 深海（不分晝夜）':TIME_NAME[f.time]}<br>
   ${r?`📏 體長範圍：${f.min}～${f.max} cm<br>🏅 最大紀錄：<b>${r.max} cm</b>　🎣 釣獲 ${r.n} 次<br>💰 參考價：約 ${f.price}<br><span style="opacity:.9">${f.desc}</span>`:`<span style="opacity:.75">尚未釣到這種魚。<br>提示：${f.rar>=3?'稀有度很高，試試特製或黃金魚餌！':'在對應時段多拋幾次竿吧！'}</span>`}
  </div>`;
  animCvs.push({cv:$('#detCv'),f,sil:r?null:'#06121f'});
}
function openShop(){
  SFX.click();
  let html=`<h2>🛒 釣具商店</h2><div style="margin-bottom:10px">持有金幣：<b>💰 ${G.coins.toLocaleString()}</b></div><h3 style="margin:6px 0">🎣 釣竿</h3>`;
  RODS.forEach((r,i)=>{const own=G.rods.includes(i),eq=G.rod===i;html+=`<div class="row"><div><div class="t">${r.name} ${eq?'✅':''}</div><div class="s">${r.desc}｜綠框 ${Math.round(r.zone*100)}%・收線 ×${r.speed}・稀有魚 +${Math.round(r.bonus*100)}%</div></div>${eq?'<button class="act" disabled>使用中</button>':own?`<button class="act g" data-eq="${i}">裝備</button>`:`<button class="act" data-buy="${i}" ${G.coins<r.price?'disabled':''}>💰 ${r.price.toLocaleString()}</button>`}</div>`});
  html+='<h3 style="margin:10px 0 6px">🪝 魚餌</h3>';
  BAITS.forEach((b,i)=>{if(!i)return;html+=`<div class="row"><div><div class="t">${b.icon} ${b.name}（持有 ${G.bait[i]}）</div><div class="s">${b.desc}</div></div><button class="act" data-bait="${i}" ${G.coins<b.price?'disabled':''}>${b.pack} 個 💰${b.price}</button></div>`});
  openModal(html);
  document.querySelectorAll('[data-buy]').forEach(e=>e.onclick=()=>{const i=+e.dataset.buy,r=RODS[i];if(G.coins<r.price)return;G.coins-=r.price;G.rods.push(i);G.rod=i;SFX.coin();toast(`買到了 ${r.name}！`);save();updateHud();openShop()});
  document.querySelectorAll('[data-eq]').forEach(e=>e.onclick=()=>{G.rod=+e.dataset.eq;save();openShop()});
  document.querySelectorAll('[data-bait]').forEach(e=>e.onclick=()=>{const i=+e.dataset.bait,b=BAITS[i];if(G.coins<b.price)return;G.coins-=b.price;G.bait[i]+=b.pack;SFX.coin();save();updateHud();renderBait();openShop()});
}
function openMap(){
  SFX.click();
  let html=`<h2>🗺️ 釣場地圖</h2><div style="margin-bottom:10px">持有金幣：<b>💰 ${G.coins.toLocaleString()}</b>　<span style="opacity:.75;font-size:13px">（集滿一區圖鑑可獲得額外獎勵）</span></div>`;
  AREAS.forEach((a,i)=>{const un=G.unlocked.includes(i),cur=G.area===i;html+=`<div class="row"><div><div class="t">${a.icon} ${a.name} ${cur?'📍':''} ${G.areaDone.includes(i)?'🏆':''}</div><div class="s">圖鑑 ${caughtCount(i)}/15・全收集獎勵 💰${a.bonus.toLocaleString()}</div></div>${cur?'<button class="act" disabled>目前位置</button>':un?`<button class="act g" data-go="${i}">前往</button>`:`<button class="act" data-un="${i}" ${G.coins<a.cost?'disabled':''}>解鎖 💰${a.cost.toLocaleString()}</button>`}</div>`});
  openModal(html);
  const go=i=>{G.area=i;st='idle';hooked=null;mg=null;ambient.length=0;save();updateHud();closeModal();toast(`${AREAS[i].icon} 來到了「${AREAS[i].name}」`);if(window._waveLP)window._waveLP.frequency.value=i===6?180:420};
  document.querySelectorAll('[data-go]').forEach(e=>e.onclick=()=>go(+e.dataset.go));
  document.querySelectorAll('[data-un]').forEach(e=>e.onclick=()=>{const i=+e.dataset.un;if(G.coins<AREAS[i].cost)return;G.coins-=AREAS[i].cost;G.unlocked.push(i);SFX.coin();go(i)});
}
$('#dexB').onclick=openDex;$('#shopB').onclick=openShop;$('#mapB').onclick=openMap;
$('#musB').onclick=()=>{initAudio();musicOn=!musicOn;if(musicG)musicG.gain.value=musicOn?.5:0;updateHud()};
$('#skipB').onclick=()=>{if(st!=='idle'){toast('收竿後才能快轉時間喔');return}G.time=(G.time+120)%1440;SFX.click();toast('⏩ 時間過了 2 小時（'+({day:'白天',dawn:'晨昏',night:'夜晚'})[period()]+'）');save()};
['dexB','shopB','mapB','musB','skipB'].forEach(id=>$('#'+id).addEventListener('pointerdown',e=>e.stopPropagation()));

/* ================= 主迴圈 ================= */
let last=performance.now(),saveT=0,timeT=0;
function loop(ts){
  const dt=Math.min(.05,(ts-last)/1000);last=ts;now+=dt;
  if(!modalOpen){G.time=(G.time+dt*6)%1440}
  if(st==='charging'){power+=powDir*dt*1.1;if(power>1){power=1;powDir=-1}if(power<0){power=0;powDir=1}}
  if(st==='waiting'&&now>=biteAt){st='bite';biteEnd=now+(1-hooked.rar*.08);SFX.bite();ripples.push({x:bob.tx,y:bob.ty,r:4,a:1});addSplash(bob.tx,bob.ty,8);if(navigator.vibrate)try{navigator.vibrate(80)}catch(e){}}
  if(st==='bite'&&now>biteEnd){st='idle';toast('魚跑掉了…浮標沉下去要馬上點擊！');hooked=null}
  if(st==='reeling'&&mg&&!modalOpen)updateMg(dt);
  ctx.clearRect(0,0,W,H);drawScene(dt);
  animCvs.forEach(a=>{const x=a.cv.getContext('2d');x.clearRect(0,0,a.cv.width,a.cv.height);drawFishFit(x,a.f,a.cv.width,a.cv.height,{t:now,sil:a.sil,glowBlur:26})});
  updateHint();timeT-=dt;if(timeT<=0){updateTime();timeT=.25}
  saveT+=dt;if(saveT>10){saveT=0;save()}
  requestAnimationFrame(loop);
}
// 開始畫面
(function(){const c=$('#startCv'),x=c.getContext('2d');const picks=[FISH[13],FISH[42],FISH[57],FISH[73],FISH[104]];let t=0;
  function anim(){if($('#start').style.display==='none')return;t+=.016;x.clearRect(0,0,c.width,c.height);picks.forEach((f,i)=>{const cx=90+i*165,cy=130+Math.sin(t*2+i)*16;x.save();x.translate(cx-80,cy-65);drawFishFit(x,f,160,130,{t:t+i});x.restore()});requestAnimationFrame(anim)}anim();})();
$('#startB').onclick=()=>{initAudio();$('#start').style.display='none';SFX.click();if(window._waveLP)window._waveLP.frequency.value=G.area===6?180:420;
  if(!G.total)toast('按住畫面蓄力，放開拋竿！浮標沉下去時快點擊 🎣',4000)};
renderBait();updateHud();updateTime();requestAnimationFrame(loop);
</script>
